问题，我们是通过裁剪 Noto Sans SC 并内置在应用包中，以驱动中文文本渲染的，这也导致 MPFlutter 初始包大小超过 5M。</p>\n\n\n<p class=\"feishu-p\">我们需要另辟蹊径解决这些问题。</p>\n\n\n\n<h3 id=\"heading-minitex_deep-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-minitex_deep-3\" class=\"heading-anchor\">#</a>二、技术目标</h3>\n\n\n<p class=\"feishu-p\">使用 JavaScript + Web Canvas 2D 编写一个在功能上对齐 Skia 文本渲染能力的库。</p>\n\n\n<p class=\"feishu-p\">该库需要是：</p>\n\n<ul class=\"feishu-ul\">\n<li>跨平台的，至少是微信小程序、Web 都可用的；</li>\n<li>在接口上对齐 Skia，以保证 Flutter / Dart 的调用是一致的；</li>\n<li>不能依赖外部的 TTF 字体文件，且需要保证文本换行、描边、阴影、装饰等功能与 Skia 实现一致。</li>\n</ul>\n\n\n<h3 id=\"heading-minitex_deep-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-minitex_deep-4\" class=\"heading-anchor\">#</a>三、原理分析</h3>\n\n\n<p class=\"feishu-p\">Skia 是一个开源的 2D 渲染库，主要由矢量绘制、文本绘制、位图绘制功能组合而成。</p>\n\n\n<p class=\"feishu-p\">通过阅读 Flutter 和 Skia 源码，我们梳理出相关的渲染流程，如下图：</p>\n\n\n", "headings": [{"id": "heading-minitex_deep-1", "title": "5.2 MiniTex 技术原理与架构解析", "level": 2}, {"id": "heading-minitex_deep-2", "title": "一、背景", "level": 3}, {"id": "heading-minitex_deep-3", "title": "二、技术目标", "level": 3}, {"id": "heading-minitex_deep-4", "title": "三、原理分析", "level": 3}], "wordCount": 845, "readTime": 2, "file": "Blog Articles_免加载字体的 Flutter 文本渲染器 —— MiniTex_B62mwAlrzilcoukX16qcupsNndf.html"}, {"id": "wechat_features", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "微信小程序平台特性概述", "icon": "📱", "date": "2024年7月9日", "html": "\n<h2 id=\"heading-wechat_features-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-wechat_features-1\" class=\"heading-anchor\">#</a>六、微信小程序平台特性</h2>\n\n\n", "headings": [{"id": "heading-wechat_features-1", "title": "六、微信小程序平台特性", "level": 2}], "wordCount": 16, "readTime": 1, "file": "11_微信小程序平台特性_FASdwpqeKi2ej8kpALOcsECbnuM.html"}, {"id": "domain", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "业务域名配置与限制", "icon": "🌐", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-domain-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-domain-1\" class=\"heading-anchor\">#</a>6.1 业务域名配置与限制</h2>\n\n\n<p class=\"feishu-p\">MPFlutter 与一般的 Flutter 应用在网络请求上有一定区别，你需要在微信小程序开发者后台添加业务域名，才能使用 http 或者 dio 访问对应 HTTP 服务的数据。</p>\n\n\n<p class=\"feishu-p\">这个限制来自于微信官方，具体操作方法请阅读文档。</p>\n\n\n<p class=\"feishu-p\"><a href=\"https://developers.weixin.qq.com/miniprogram/dev/framework/ability/network.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://developers.weixin.qq.com/miniprogram/dev/framework/ability/network.html</a></p>\n\n\n\n<h4 id=\"heading-domain-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-domain-2\" class=\"heading-anchor\">#</a>哪些域名需要添加？</h4>\n\n\n\n<h5 id=\"heading-domain-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-domain-3\" class=\"heading-anchor\">#</a>常规的 HTTP 请求</h5>\n\n\n<p class=\"feishu-p\">只要你使用到了 http 或者 dio，无论是发起 GET 还是 POST 请求，都需要添加域名到开发者后台。</p>\n\n\n\n<h5 id=\"heading-domain-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-domain-3\" class=\"heading-anchor\">#</a>图片 URL</h5>\n\n\n<p class=\"feishu-p\">无论是使用 Flutter 的 Image 组件，还是第三方提供的 flutter_svg 库，只要对应的 Image 组件有访问互联网上的图片，对应 URL 的域名就需要添加到开发者后台。</p>\n\n\n\n<h5 id=\"heading-domain-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-domain-3\" class=\"heading-anchor\">#</a>字体</h5>\n\n\n<p class=\"feishu-p\">如果你使用到了 Google 字体服务，你需要添加 <a href=\"http://fonts.gstatic.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">fonts.gstatic.com</a> 到开发者后台。</p>\n\n\n<p class=\"feishu-p\">由于一个域名只能被添加到 100 个小程序中，如果不能正常添加 Google 的域名，那么你需要自行搭建字体下载服务，全局代理至 <a href=\"http://fonts.gstatic.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">fonts.gstatic.com</a> 。</p>\n\n\n<p class=\"feishu-p\">未来 MPFlutter 官方可能提供 SaaS 形式的字体渐进式加载服务，请关注。</p>\n\n\n\n<h4 id=\"heading-domain-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-domain-3\" class=\"heading-anchor\">#</a>调试状态下跳过域名检查</h4>\n\n\n<p class=\"feishu-p\">你可以微信开发者工具 > 项目 > 详情 > 勾选不校验合法域名，这样可以在 PC 预览的情况下，可以免域名校验。</p>\n\n\n<p class=\"feishu-p\">在真机预览的场景，点击右上角【More】按钮，打开【开发调试】就可以免域名校验。</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-domain-1", "title": "6.1 业务域名配置与限制", "level": 2}, {"id": "heading-domain-2", "title": "哪些域名需要添加？", "level": 4}, {"id": "heading-domain-3", "title": "调试状态下跳过域名检查", "level": 4}], "wordCount": 733, "readTime": 2, "file": "微信小程序平台特性_业务域名_ORrawSYFBiGaZfk3OAXcriNrnOb.html"}, {"id": "wechat_api", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "微信小程序 API 封装库 (mpflutter_wechat_api)", "icon": "⚙️", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-wechat_api-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-wechat_api-1\" class=\"heading-anchor\">#</a>6.2 微信小程序 API 封装库 (mpflutter_wechat_api)</h2>\n\n\n<p class=\"feishu-p\">微信小程序提供了一系统的 API，可用于获取以下能力：</p>\n\n<ul class=\"feishu-ul\">\n<li>基础信息</li>\n<li>网络</li>\n<li>本地文件读写</li>\n<li>蓝牙</li>\n<li>支付</li>\n<li>......</li>\n</ul>\n\n<p class=\"feishu-p\">你可以通过微信官方文档了解</p>\n\n\n<p class=\"feishu-p\"><a href=\"https://developers.weixin.qq.com/miniprogram/dev/api/\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://developers.weixin.qq.com/miniprogram/dev/api/</a></p>\n\n\n\n<h4 id=\"heading-wechat_api-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-wechat_api-2\" class=\"heading-anchor\">#</a>封装库</h4>\n\n\n<p class=\"feishu-p\">对于 MPFlutter 应用，如果每一个 API 的调用都需要开发者自行编写 Channel，那是非常麻烦的。</p>\n\n\n<p class=\"feishu-p\">我们特别提供了 <a href=\"https://pub.dev/packages/mpflutter_wechat_api\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">mpflutter_wechat_api</a> 库，这个库提供了 Dart 的调用封装，你不需要编写任何 JavaScript 代码就可以调用微信 API。</p>\n\n\n<p class=\"feishu-p\">添加以下依赖到 pubspec.yaml 就可以使用了：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">\n  mpflutter_wechat_api: {请自行替换成最新版本号}</code></pre>\n                </div>\n\n\n\n<h4 id=\"heading-wechat_api-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-wechat_api-3\" class=\"heading-anchor\">#</a>示例代码</h4>\n\n\n<p class=\"feishu-p\">对于同步返回方法，你可以直接获取结果。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wechat_api/mpflutter_wechat_api.dart&#x27;;\n\nfinal result = wx.getSystemInfoSync();\nprint(result.model);</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">对于异步返回方法以及带参数的方法，你需要使用 .. 的方法设置 Option 参数。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wechat_api/mpflutter_wechat_api.dart&#x27;;\n\nwx.getSystemInfoAsync(GetSystemInfoAsyncOption()\n      ..success = (result) {\n        final snackBar = SnackBar(\n          content: Text(&#x27;Device model = ${result.model}&#x27;),\n        );\n        ScaffoldMessenger.of(context).showSnackBar(snackBar);\n      });</code></pre>\n                </div>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-wechat_api-1", "title": "6.2 微信小程序 API 封装库 (mpflutter_wechat_api)", "level": 2}, {"id": "heading-wechat_api-2", "title": "封装库", "level": 4}, {"id": "heading-wechat_api-3", "title": "示例代码", "level": 4}], "wordCount": 1628, "readTime": 5, "file": "微信小程序平台特性_微信小程序 API 封装库_KAs6wdMfRiQ1Y0kGB5CcxzMgntc.html"}, {"id": "platform_view", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "Platform View 原生视图组件", "icon": "🖼️", "date": "2024年7月9日", "html": "\n<h2 id=\"heading-platform_view-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-platform_view-1\" class=\"heading-anchor\">#</a>6.3 Platform View 原生视图组件</h2>\n\n\n<p class=\"feishu-p\">MPFlutter CanvasKit 只负责 Flutter Widgets 渲染，对于特定平台的组件则需要使用 PlatformView 渲染。</p>\n\n\n<p class=\"feishu-p\">PlatformView 的实现，实际上就是在 Canvas 的最上方覆盖一个原生视图，并且该视图跟随 Shadow Widget 移动。</p>\n\n\n<p class=\"feishu-p\">PlatformView 有以下能力限制：</p>\n\n<ul class=\"feishu-ul\">\n<li>层级最高，无法在 PlatformView 上叠加任何视图。</li>\n<li>跟随移动不及时，Shadow Widget 的移动与 PlatformView 不完全同步，因此建议你不要在 ScrollView 中使用。</li>\n<li>不建议在 ListView 的每一个 ListItem 中添加 PlatformView，过多的 PlatformView 会影响性能，请使用其它替代方式使用。</li>\n</ul>\n\n<p class=\"feishu-p\">官方已支持的 PlatformView：</p>\n\n<ul class=\"feishu-ul\">\n<li><a href=\"https://mpflutter.feishu.cn/wiki/QIlpwxyb1iiCqlkMSDvcY219nNc\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">MapView</a></li>\n<li><a href=\"https://mpflutter.feishu.cn/wiki/SVt5wK7GEiKgvDk3WOCcE20Bnge\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">VideoView</a></li>\n<li><a href=\"https://mpflutter.feishu.cn/wiki/Kk5YwA07ziP7ezklvcMcrMh6nye\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">WebView</a></li>\n<li><a href=\"https://mpflutter.feishu.cn/wiki/T4ITw9uUKiWCb7kD0knc7FNenme\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Button</a></li>\n<li><a href=\"https://mpflutter.feishu.cn/wiki/YWIMwKyzriS685k0PuxceYTjnke\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Image</a></li>\n<li><a href=\"https://mpflutter.feishu.cn/wiki/EwzjwLJUyiwu4GkNXB5cCCJxnMb\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Editable</a></li>\n</ul>\n\n<p class=\"feishu-p\">官方未支持的：</p>\n\n<ul class=\"feishu-ul\">\n<li>Camara</li>\n<li>Ad</li>\n</ul>\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-platform_view-1", "title": "6.3 Platform View 原生视图组件", "level": 2}], "wordCount": 485, "readTime": 1, "file": "微信小程序平台特性_Platform View_SBAGwVMiVig6aok7EYYcsYKZnoM.html"}, {"id": "platform_view_overlay", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "Platform View Overlay 全屏覆盖方案", "icon": "📑", "date": "2024年7月9日", "html": "\n<h2 id=\"heading-platform_view_overlay-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-platform_view_overlay-1\" class=\"heading-anchor\">#</a>6.4 Platform View Overlay 全屏覆盖方案</h2>\n\n\n<p class=\"feishu-p\">该特性要求使用 2.7.0+ 版本</p>\n\n\n<p class=\"feishu-p\">Platform View 默认是不支持在其上方添加任何 Flutter Widget 的，因为 Platform View 的层级最高。</p>\n\n\n<p class=\"feishu-p\">但是，这会导致地图应用难以使用 MPFlutter 开发。</p>\n\n\n<p class=\"feishu-p\">为此，官方特别提供 Overlay 方案，原理是通过将 Scaffold 的背景变成透明，将 Platform View 置于画布最下方实现的。</p>\n\n\n\n<h4 id=\"heading-platform_view_overlay-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-platform_view_overlay-2\" class=\"heading-anchor\">#</a>用法</h4>\n\n\n<p class=\"feishu-p\">请参考以下代码开发。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">import &#x27;package:flutter/material.dart&#x27;;\nimport &#x27;package:mpflutter_core/mpflutter_core.dart&#x27;;\nimport &#x27;package:mpflutter_wechat_api/mpflutter_wechat_api.dart&#x27;;\nimport &#x27;package:mpflutter_wechat_mapview/mpflutter_wechat_mapview.dart&#x27;;\n\nclass WXMapView extends StatefulWidget {\n  const WXMapView({super.key});\n\n  @override\n  State&lt;WXMapView&gt; createState() =&gt; _WXMapViewState();\n}\n\nclass _WXMapViewState extends State&lt;WXMapView&gt; {\n  final controller = MPFlutter_Wechat_MapViewController();\n  String selectedAddress = &quot;&quot;;\n\n  @override\n  Widget build(BuildContext context) {\n    return MPFlutterPlatformOverlaySupport( // 使用 MPFlutterPlatformOverlaySupport 包裹 Scaffold\n      child: Scaffold(\n        backgroundColor: Colors.transparent, // Scaffold 的背景必须是透明的\n        appBar: AppBar(\n          title: const Text(&#x27;WXMapView&#x27;),\n        ),\n        body: Stack( // 使用 Stack 布局地图和 Overlay Widgets\n          children: [\n            Positioned.fill(\n              child: MPFlutter_Wechat_MapView(\n                controller: controller,\n                longitude: 113.347698,\n                latitude: 23.100022,\n                showLocation: true,\n                markers: const [\n                  {\n                    &quot;id&quot;: &quot;HeJi&quot;,\n                    &quot;title&quot;: &quot;赫基大厦&quot;,\n                    &quot;longitude&quot;: 113.347698,\n                    &quot;latitude&quot;: 23.100022,\n                  },\n                  {\n                    &quot;id&quot;: &quot;WeChat&quot;,\n                    &quot;title&quot;: &quot;微信总部&quot;,</code></pre>\n                </div>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-platform_view_overlay-1", "title": "6.4 Platform View Overlay 全屏覆盖方案", "level": 2}, {"id": "heading-platform_view_overlay-2", "title": "用法", "level": 4}], "wordCount": 2117, "readTime": 7, "file": "微信小程序平台特性_Platform View Overlay_DUPFwi89nixeQ7k4D28cmboWnog.html"}, {"id": "share", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "分享到会话、朋友圈与单页模式", "icon": "🔗", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-share-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-share-1\" class=\"heading-anchor\">#</a>6.5 分享到会话、朋友圈与单页模式</h2>\n\n\n\n<h4 id=\"heading-share-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-share-2\" class=\"heading-anchor\">#</a>分享到会话</h4>\n\n\n<p class=\"feishu-p\">我们是根据微信官方提供的 <a href=\"https://developers.weixin.qq.com/miniprogram/dev/reference/api/Page.html#onShareAppMessage-Object-object\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">onShareAppMessage</a> 回调实现的，如有疑问请先阅读官方文档。</p>\n\n\n\n<h5 id=\"heading-share-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-share-3\" class=\"heading-anchor\">#</a>方法一、直接使用 MPFlutterWechatAppDelegate 类</h5>\n\n\n<p class=\"feishu-p\">MPFlutterWechatAppDelegate 类用于封装来自微信小程序的生命周期事件，你可以在这里得到小程序切后台、切前台、从分享卡片进入等回调。</p>\n\n\n<p class=\"feishu-p\">onShareAppMessage 封装在这个类中，你可以直接在 onShareAppMessage 中返回符合微信官方要求的字段，并且在  onLaunch / onEnter 中响应用户路由。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">class MyAppDelegate {\n  late MPFlutterWechatAppDelegate appDelegate;\n\n  MyAppDelegate() {\n    appDelegate = MPFlutterWechatAppDelegate(\n      onShareAppMessage: (detail) {\n        print(&quot;当用户点击分享给朋友时，回调，应组装对应的 Map 信息，用于展示和回跳。&quot;);\n        return onShareAppMessage(detail);\n      },\n      // 如果你需要异步返回 shareAppMessage 结果，请使用这个回调。\n      // 你最多只有 3 秒时间处理异步请求。\n      // onShareAppMessageAsync: (detail, callback) async {\n      //   await Future.delayed(const Duration(milliseconds: 1500));\n      //   callback({\n      //     &quot;title&quot;: &quot;delay&quot;,\n      //     &quot;path&quot;: &quot;pages/index/index&quot;,\n      //   });\n      // },\n      onLaunch: (query) async {\n        print(&quot;应用冷启动时，会收到回调，应根据 query 决定是否要跳转页面。&quot;);\n        await Future.delayed(Duration(seconds: 1)); // 加个延时，保障 navigator 已初始化。\n        onLaunchOrEnter(query);\n      },\n      onEnter: (query) {\n        print(&quot;应用热启动（例如用户从分享卡片进入小程序）时，会收到回调，应根据 query 决定是否要跳转页面。&quot;);\n        onLaunchOrEnter(query);\n      },\n    );\n  }\n\n  Map onShareAppMessage(mpjs.JSObject detail) {\n    final currentRoute = MPNavigatorObserver.currentRoute;\n    if (currentRoute != null) {\n      final routeName = currentRoute.settings.name;\n      return {\n        &quot;title&quot;: (() {\n          if (routeName == &quot;/map_demo&quot;) {\n            return &quot;Map Demo&quot;;\n          } else {\n            return &quot;Awesome Project&quot;;\n          }\n        })(),</code></pre>\n                </div>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-share-1", "title": "6.5 分享到会话、朋友圈与单页模式", "level": 2}, {"id": "heading-share-2", "title": "分享到会话", "level": 4}], "wordCount": 1986, "readTime": 6, "file": "微信小程序平台特性_分享到会话、朋友圈_KDWRwdmnQiuqkokcWKmc3ig2nKg.html"}, {"id": "custom_wechat_pkg", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "自制微信小程序 Package 指南", "icon": "📦", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-custom_wechat_pkg-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-custom_wechat_pkg-1\" class=\"heading-anchor\">#</a>6.6 自制微信小程序 Package 指南</h2>\n\n\n<p class=\"feishu-p\">如果本文档提供的 mpflutter_wechat_api 和 Platform View 不能满足你的需要，你可以通过自制 Package 实现个性化能力。</p>\n\n\n<p class=\"feishu-p\">一个 MPFlutter Plugin 和普通的 Flutter Plugin 没有本质上的区别，它们都可以上传到 pub.dev。</p>\n\n\n<p class=\"feishu-p\">Package Name 必须以  mpflutter_wechat_ 开头，否则相关 JS 和 WXML 产物不会被打包到小程序中。</p>\n\n\n\n<h4 id=\"heading-custom_wechat_pkg-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-custom_wechat_pkg-2\" class=\"heading-anchor\">#</a>Simple Plugin</h4>\n\n\n<p class=\"feishu-p\">这是一种可通过 Dart 调用 JavaScript 的插件，它不包含任何界面逻辑。</p>\n\n\n<p class=\"feishu-p\">从以下模板工程开始开发：</p>\n\n\n\n<h5 id=\"heading-custom_wechat_pkg-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-custom_wechat_pkg-3\" class=\"heading-anchor\">#</a>源码解读</h5>\n\n\n<p class=\"feishu-p\">mpflutter_wechat_awesome_package.dart</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_core/mpjs/mpjs.dart&#x27; as mpjs;\n\nclass MPFlutter_Wechat_AwesomePackage {\n  MPFlutter_Wechat_AwesomePackage();\n\n  void sayHello() {\n    final newObjectFromJavaScript = mpjs.JSObject(\n      &quot;MPFlutter_Wechat_AwesomePackage&quot;,\n    );\n    final returnValue = newObjectFromJavaScript.callMethod(\n      &quot;sayHello&quot;,\n      [&quot;Pony&quot;], // 也可以传入 Function 到 JS 环境用于回调，例如 [(String arg1) { print(arg1); }]\n    );\n    print(&#x27;value from javascripot&#x27; + returnValue);\n  }\n}\n</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">mpjs 是由 MPFlutter 提供的 JavaScript FFI 封装，使用 mpjs 可以很方便地访问 JS 上下文。</p>\n\n\n<p class=\"feishu-p\">在这里：</p>\n\n\n<p class=\"feishu-p\">1.通过 new mpjs.JSObject 创建一个来自于 JavaScript 环境的对象</p>\n\n<p class=\"feishu-p\">2.调用该对象的 sayHello 方法，参数为 Pony。</p>\n\n<p class=\"feishu-p\">3.获取 sayHello 的返回值，并打印。</p>\n\n<p class=\"feishu-p\">wechat/main.js</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">javascript</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-javascript\">class MPFlutter_Wechat_AwesomePackage {\n  sayHello(to) {\n    if (to) {</code></pre>\n                </div>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-custom_wechat_pkg-1", "title": "6.6 自制微信小程序 Package 指南", "level": 2}, {"id": "heading-custom_wechat_pkg-2", "title": "Simple Plugin", "level": 4}], "wordCount": 1629, "readTime": 5, "file": "微信小程序平台特性_自制微信小程序 Package_Oc9Kw42X5i8naHkNeo8c6JKGnPc.html"}, {"id": "audioplayers", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "audioplayers 音频播放适配", "icon": "🎵", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-audioplayers-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-audioplayers-1\" class=\"heading-anchor\">#</a>6.7 audioplayers 音频播放适配</h2>\n\n\n<p class=\"feishu-p\">MPFlutter 已完成对 audioplayers 库的适配工作，你可以在微信小程序、微信小游戏中使用 audioplayers 库进行音频播放操作。</p>\n\n\n<p class=\"feishu-p\">只需要在 pubspec.yaml 中添加以下依赖就可以：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">\n  audioplayers: ^5.2.0\n\n\n\n      url: https://github.com/mpflutter/audioplayers.git\n      ref: mpflutter-v5.2.1\n      path: packages/audioplayers_web</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">具体 audioplayers 用法请参考 <a href=\"https://github.com/bluefireteam/audioplayers\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://github.com/bluefireteam/audioplayers</a></p>\n\n\n\n<h4 id=\"heading-audioplayers-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-audioplayers-2\" class=\"heading-anchor\">#</a>InnerAudio</h4>\n\n\n<p class=\"feishu-p\">MPFlutter 针对 audioplayers 的实现是使用 WebAudio API 的，WebAudio API 已知可能造成内存泄漏，是微信小程序的问题。</p>\n\n\n<p class=\"feishu-p\">开源社区有基于 <a href=\"https://developers.weixin.qq.com/miniprogram/dev/api/media/audio/InnerAudioContext.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">InnerAudio</a> 的封装，建议优先使用。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">\n  audioplayers: ^5.2.0\n\n\n\n      url: https://github.com/swiftdo/audioplayers.git\n      ref: mpflutter-v5.2.1-inner\n      path: packages/audioplayers_web</code></pre>\n                </div>\n\n\n\n<h4 id=\"heading-audioplayers-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-audioplayers-3\" class=\"heading-anchor\">#</a>静音状态</h4>\n\n\n<p class=\"feishu-p\">默认情况，小程序的声音会遵循设备的静音设置，如果你需要在静音的情况下播放声音，可以调用以下微信 API。</p>\n\n\n<p class=\"feishu-p\"><a href=\"https://developers.weixin.qq.com/miniprogram/dev/api/media/audio/wx.setInnerAudioOption.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://developers.weixin.qq.com/miniprogram/dev/api/media/audio/wx.setInnerAudioOption.html</a></p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-audioplayers-1", "title": "6.7 audioplayers 音频播放适配", "level": 2}, {"id": "heading-audioplayers-2", "title": "InnerAudio", "level": 4}, {"id": "heading-audioplayers-3", "title": "静音状态", "level": 4}], "wordCount": 1256, "readTime": 4, "file": "微信小程序平台特性_audioplayers_GMMYwi7LLiiO27kG1Z1cw0SPnXg.html"}, {"id": "splash", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "Splash 闪屏机制与配置", "icon": "✨", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-splash-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-splash-1\" class=\"heading-anchor\">#</a>6.8 Splash 闪屏机制与配置</h2>\n\n\n\n<h4 id=\"heading-splash-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-splash-2\" class=\"heading-anchor\">#</a>为什么需要闪屏</h4>\n\n\n<p class=\"feishu-p\">闪屏主要用于小程序冷启动时，避免用户看到白屏而存在的。</p>\n\n\n<p class=\"feishu-p\">为什么用户会看到白屏？</p>\n\n<ul class=\"feishu-ul\">\n<li>Canvas 以及 CanvasKit 的初始化，需要一定时间。</li>\n<li>Flutter Framework 启动过程中，需要初始化各种依赖。</li>\n<li>分包加载过程，需要从远端下载资源、代码。</li>\n</ul>\n\n\n<h4 id=\"heading-splash-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-splash-3\" class=\"heading-anchor\">#</a>闪屏的展示、隐藏逻辑</h4>\n\n\n<p class=\"feishu-p\">默认的闪屏会在冷启动时展示，在 runMPApp 后隐藏。</p>\n\n\n<p class=\"feishu-p\">你可以通过 MPFlutterSplashManager 进一步控制闪屏的展示、隐藏时机。</p>\n\n\n\n<h4 id=\"heading-splash-4\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-splash-4\" class=\"heading-anchor\">#</a>自定义闪屏内容</h4>\n\n\n<p class=\"feishu-p\">默认的闪屏是一个无限循环的 Loading 图标。</p>\n\n\n<p class=\"feishu-p\">你可以通过修改 wechat/pages/index/splash.wxml 中的代码，自定义闪屏内容。</p>\n\n\n<p class=\"feishu-p\">这需要一定的原生小程序开发知识。</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-splash-1", "title": "6.8 Splash 闪屏机制与配置", "level": 2}, {"id": "heading-splash-2", "title": "为什么需要闪屏", "level": 4}, {"id": "heading-splash-3", "title": "闪屏的展示、隐藏逻辑", "level": 4}, {"id": "heading-splash-4", "title": "自定义闪屏内容", "level": 4}], "wordCount": 382, "readTime": 1, "file": "微信小程序平台特性_Splash 闪屏_Rjlwwd3Puib14tkeToIcbUsRnwg.html"}, {"id": "tap_request", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "Tap Request 用户手势限制问题", "icon": "👆", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-tap_request-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-tap_request-1\" class=\"heading-anchor\">#</a>6.9 Tap Request 用户手势限制问题</h2>\n\n\n<p class=\"feishu-p\">要求 mpflutter_wechat_button 0.0.3 以上版本</p>\n\n\n<p class=\"feishu-p\">微信小程序出于安全考虑，对于部分 API 是要求用户 Tap 以后才允许触发的。</p>\n\n\n<p class=\"feishu-p\">例如 wx.requestSubscribeMessage 这个 API，如果是非 Tap 触发则会报 fail can only be invoked by user TAP gesture 错误。</p>\n\n\n\n<h5 id=\"heading-tap_request-2\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-tap_request-2\" class=\"heading-anchor\">#</a>解决方案</h5>\n\n\n<p class=\"feishu-p\">使用 Platform View Button 组件可以解决问题，需要在 onTap 回调中立刻调用对应 API。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wechat_button/mpflutter_wechat_button.dart&#x27;;\n\nMPFlutter_Wechat_Button(\n  onTap: (_) {\n    wx.requestSubscribeMessage(\n      RequestSubscribeMessageOption()\n        ..tmplIds = [&quot;123&quot;]\n        ..success = (result) {\n          print(&#x27;success&#x27;);\n        }\n        ..fail = (result) {\n          print(&#x27;fail&#x27;);\n          print(result.errCode);\n          print(result.errMsg);\n        },\n    );\n  },\n  child: MaterialButton(\n    onPressed: () {},\n    child: Text(&#x27;Wechat API Test&#x27;),\n  ),\n),</code></pre>\n                </div>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-tap_request-1", "title": "6.9 Tap Request 用户手势限制问题", "level": 2}], "wordCount": 1072, "readTime": 3, "file": "微信小程序平台特性_Tap Request 问题_R0HbwZnz1ivmSkkmLdOcEWdan3i.html"}, {"id": "dark_mode", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "Dark Mode 暗色模式适配", "icon": "🌙", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-dark_mode-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-dark_mode-1\" class=\"heading-anchor\">#</a>6.10 Dark Mode 暗色模式适配</h2>\n\n\n<p class=\"feishu-p\">已支持，要求 MPFlutter 2.1.0 版本。</p>\n\n\n<p class=\"feishu-p\">请先阅读微信文档：<a href=\"https://developers.weixin.qq.com/miniprogram/dev/framework/ability/darkmode.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://developers.weixin.qq.com/miniprogram/dev/framework/ability/darkmode.html</a></p>\n\n\n<p class=\"feishu-p\">MPFlutter 通过 MPFlutterDarkmodeManager 类提供信息，可实现以下能力：</p>\n\n<ul class=\"feishu-ul\">\n<li>检测当前用户屏幕是否为暗色模式</li>\n<li>监听暗色、浅色模式变化</li>\n</ul>\n\n\n<h4 id=\"heading-dark_mode-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-dark_mode-2\" class=\"heading-anchor\">#</a>暗色模式主题</h4>\n\n\n<p class=\"feishu-p\">需要配合 Material DarkMode Theme 使用，参考代码如下：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">@override\n  Widget build(BuildContext context) {\n    return material.MaterialApp(\n      darkTheme: material.ThemeData(\n        useMaterial3: true,\n        appBarTheme: material.AppBarTheme(\n          color: material.Colors.black,\n          foregroundColor: material.Colors.grey,\n          elevation: 5.0,\n          centerTitle: false,\n        ),\n        platform: material.TargetPlatform.iOS,\n      ),\n      theme: material.ThemeData(\n        useMaterial3: true,\n        appBarTheme: material.AppBarTheme(\n          color: material.Colors.blue,\n          foregroundColor: material.Colors.white,\n          elevation: 5.0,\n          centerTitle: false,\n        ),\n        platform: material.TargetPlatform.iOS,\n      ),\n      themeMode: MPFlutterDarkmodeManager.isDarkmode()\n          ? material.ThemeMode.dark\n          : material.ThemeMode.light,\n);</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">监听暗色、浅色变化：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">MPFlutterDarkmodeManager.addThemeListener(() {\n  // Theme 变化，使用 setState 等方式要求 MaterialApp 刷新。\n});</code></pre>\n                </div>\n\n\n\n<h4 id=\"heading-dark_mode-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-dark_mode-3\" class=\"heading-anchor\">#</a>微信小程序配置</h4>\n\n\n<p class=\"feishu-p\">你需要在 app.json 中设置 darkmode: true 才可以启用暗色主题，同时需要在 window 中去掉 backgroundTextStyle 和 navigationBarTextStyle 配置。</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-dark_mode-1", "title": "6.10 Dark Mode 暗色模式适配", "level": 2}, {"id": "heading-dark_mode-2", "title": "暗色模式主题", "level": 4}, {"id": "heading-dark_mode-3", "title": "微信小程序配置", "level": 4}], "wordCount": 1821, "readTime": 6, "file": "微信小程序平台特性_Dark Mode 适配_HR2RwgXLgi4Vwek9lyWc1q4Un2g.html"}, {"id": "order_center", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "微信小程序订单中心页接入", "icon": "🛒", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-order_center-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-order_center-1\" class=\"heading-anchor\">#</a>6.11 微信小程序订单中心页接入</h2>\n\n\n<p class=\"feishu-p\">该功能未发布，请使用 Nightly 版本。</p>\n\n\n<p class=\"feishu-p\">针对微信官方《<a href=\"https://developers.weixin.qq.com/community/develop/doc/00046880140f2842cdee491545b801?highLine=%25E8%25AE%25A2%25E5%258D%2595%25E4%25B8%25AD%25E5%25BF%2583\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">关于小程序订单中心页设置的公告</a>》要求，我们提供以下构建方案。</p>\n\n\n<p class=\"feishu-p\">1.修改 scripts/build_wechat.dart，添加以下构建选项：</p>\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">javascript</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-javascript\">build_tools.addShadowPage(&#x27;order&#x27;);</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">2.然后在 MPFlutterWechatAppDelegate 中，使用 launchOptions[\"path\"] 获取页面路径，判断是否为 pages/index/order 响应跳转。</p>\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">MPFlutterWechatAppDelegate(\n      onLaunch: (query, options) {\n            final path = options[&#x27;path&#x27;];\n            if (path == &quot;pages/index/order&quot;) {\n              // 订单中心页\n            }\n      },\n)\n    </code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">3.添加 pages/index/order 路径到微信小程序后台评论</p>\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-order_center-1", "title": "6.11 微信小程序订单中心页接入", "level": 2}], "wordCount": 992, "readTime": 3, "file": "微信小程序平台特性_订单中心页_W0qnwZPPkiO5PTk7RbscZX9bn4e.html"}, {"id": "socket", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "Socket 与 WebSocket 通信", "icon": "🔄", "date": "2024年6月26日", "html": "\n<h2 id=\"heading-socket-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-socket-1\" class=\"heading-anchor\">#</a>6.12 Socket 与 WebSocket 通信</h2>\n\n\n\n<h3 id=\"heading-socket-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-socket-2\" class=\"heading-anchor\">#</a>Socket</h3>\n\n\n<p class=\"feishu-p\">使用 mpflutter_wechat_socket 库可以在微信小程序上与服务器使用 TCPSocket 通信，官方是基于微信提供的 API 进行封装的，请注意域名配置和端口号限制。</p>\n\n\n<p class=\"feishu-p\">相关文档：<a href=\"https://developers.weixin.qq.com/miniprogram/dev/api/network/tcp/wx.createTCPSocket.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://developers.weixin.qq.com/miniprogram/dev/api/network/tcp/wx.createTCPSocket.html</a></p>\n\n\n\n<h5 id=\"heading-socket-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-socket-3\" class=\"heading-anchor\">#</a>使用方法</h5>\n\n\n<p class=\"feishu-p\">添加依赖到 pubspec.yaml 中：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">\n  mpflutter_wechat_socket: ^0.0.1</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">在需要通信的地方，编写以后代码：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wechat_socket/mpflutter_wechat_socket.dart&#x27;;\n\nMPFlutter_Wechat_Socket.connect(&#x27;127.0.0.1&#x27;, 1234).then((socket) {\n  print(&#x27;Connected to server&#x27;);\n\n  // 发送测试数据\n  socket.write(&#x27;Hello, server!&#x27;);\n\n  // 监听服务器返回的数据\n  socket.listen((data) {\n    print(&#x27;Received from server: $data&#x27;);\n  }, onDone: () {\n    print(&#x27;Server closed the connection&#x27;);\n    socket.destroy();\n  }, onError: (error) {\n    print(&#x27;Error: $error&#x27;);\n    socket.destroy();\n  });\n\n  // 关闭连接\n  Future.delayed(Duration(seconds: 5), () {\n    print(&#x27;Closing connection&#x27;);\n    socket.close();\n  });\n}).catchError((error) {\n  print(&#x27;Error connecting to server: $error&#x27;);\n});</code></pre>\n                </div>\n\n\n\n<h3 id=\"heading-socket-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-socket-3\" class=\"heading-anchor\">#</a>WebSocket</h3>\n\n\n<p class=\"feishu-p\">web_socket_channel 是常用的 websocket client 库，MPFlutter 官方通过 Fork 的方式在 web_socket_channel 的基础上添加微信小程序支持。</p>\n\n\n<p class=\"feishu-p\">同样的，开发者也需要注意相关的域名和端口限制。0 字</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-socket-1", "title": "6.12 Socket 与 WebSocket 通信", "level": 2}, {"id": "heading-socket-2", "title": "Socket", "level": 3}, {"id": "heading-socket-3", "title": "WebSocket", "level": 3}], "wordCount": 1662, "readTime": 5, "file": "微信小程序平台特性_Socket、WebSocket_R56vwolrriKQCOkjJ6pcCX1Bnaf.html"}, {"id": "imsdk", "chapterId": "chap_wechat_features", "chapterTitle": "七、微信小程序平台特性", "title": "在微信小程序中使用 Tencent IMSDK", "icon": "💬", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-imsdk-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-imsdk-1\" class=\"heading-anchor\">#</a>6.13 在微信小程序中使用 Tencent IMSDK</h2>\n\n\n<p class=\"feishu-p\">腾讯云 IMSDK 支持 Flutter 和微信小程序使用，在 MPFlutter 中同样可用。</p>\n\n\n<p class=\"feishu-p\">本文档将指引你集成并运行 IMSDK。</p>\n\n\n<p class=\"feishu-p\">1.下载模板工程 <a href=\"https://mpflutter.feishu.cn/wiki/I45wwTI9XiH0AXkvQUEc2jZ8nFP\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">编写第一个 MPFlutter 微信小程序</a></p>\n\n<p class=\"feishu-p\">2.在 scripts/build_wechat.dart 文件中添加以下配置</p>\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">javascript</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-javascript\">import &#x27;package:mpflutter_build_tools/main.dart&#x27; as build_tools;\n\n\n  final buildArgs = [...arguments]..add(&#x27;--wechat&#x27;);\n  build_tools.addNpmPackage(&quot;TencentCloudChat&quot;, &quot;@tencentcloud/chat&quot;);\n  build_tools.main(buildArgs);\n}\n</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">3.在 pubspec.yaml 添加以下依赖</p>\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">\n  tencent_cloud_chat_sdk: ^8.5.6864+10</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">4.在 wechat 目录下添加对应的 npm 包，并构建成 miniprogram_npm 包，具体方法参照。</p>\n\n<p class=\"feishu-p\">5.在 main.dart 或任意位置使用 Flutter 代码初始化 IMSDK，具体参数见<a href=\"https://cloud.tencent.com/document/product/269/75293\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">官方文档</a>。</p>\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">class MyApp extends StatelessWidget {\n  MyApp({super.key}) {\n    TencentImSDKPlugin.v2TIMManager.initSDK(\n        sdkAppID: 0); // 在这里初始化 IMSDK，后续的使用与正常的腾讯云 IMSDK Flutter 版本无任何差异。\n  }\n}</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">6.后续的使用与 <a href=\"https://cloud.tencent.com/document/product/269/75293\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">IMSDK Flutter 版本</a>无任何差异。</p>\n\n<p class=\"feishu-p\">如果你不想自行构建 npm，可以直接下载这个模板工程，已经集成好 IMSDK。</p>\n\n\n<p class=\"feishu-p\">注意，在上线前你需要按照腾讯云的要求配置好<a href=\"https://cloud.tencent.com/document/product/269/75285\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">业务域名</a>。0 字</p>\n\n\n", "headings": [{"id": "heading-imsdk-1", "title": "6.13 在微信小程序中使用 Tencent IMSDK", "level": 2}], "wordCount": 1592, "readTime": 5, "file": "微信小程序平台特性_在微信小程序中使用 Tencent IMSDK_DUehwuNAOiwYnzkESl4cApJ3nWc.html"}, {"id": "wegame_features", "chapterId": "chap_wegame_features", "chapterTitle": "八、微信小游戏平台特性", "title": "微信小游戏平台特性概述", "icon": "🎮", "date": "2024年4月21日", "html": "\n<h2 id=\"heading-wegame_features-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-wegame_features-1\" class=\"heading-anchor\">#</a>七、微信小游戏平台特性</h2>\n\n\n", "headings": [{"id": "heading-wegame_features-1", "title": "七、微信小游戏平台特性", "level": 2}], "wordCount": 16, "readTime": 1, "file": "12_微信小游戏平台特性_M2kpwyJx6i6NNckjO2pcxPepn0g.html"}, {"id": "wegame_api", "chapterId": "chap_wegame_features", "chapterTitle": "八、微信小游戏平台特性", "title": "微信小游戏 API 封装库 (mpflutter_wegame_api)", "icon": "🕹️", "date": "2024年4月21日", "html": "\n<h2 id=\"heading-wegame_api-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-wegame_api-1\" class=\"heading-anchor\">#</a>7.1 微信小游戏 API 封装库 (mpflutter_wegame_api)</h2>\n\n\n<p class=\"feishu-p\">微信小游戏提供了一系统的 API，可用于获取以下能力：</p>\n\n<ul class=\"feishu-ul\">\n<li>基础信息</li>\n<li>网络</li>\n<li>本地文件读写</li>\n<li>蓝牙</li>\n<li>支付</li>\n<li>......</li>\n</ul>\n\n<p class=\"feishu-p\">你可以通过微信官方文档了解</p>\n\n\n<p class=\"feishu-p\"><a href=\"https://developers.weixin.qq.com/minigame/dev/api/\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://developers.weixin.qq.com/minigame/dev/api/</a></p>\n\n\n\n<h4 id=\"heading-wegame_api-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-wegame_api-2\" class=\"heading-anchor\">#</a>封装库</h4>\n\n\n<p class=\"feishu-p\">对于 MPFlutter 应用，如果每一个 API 的调用都需要开发者自行编写 Channel，那是非常麻烦的。</p>\n\n\n<p class=\"feishu-p\">我们特别提供了 <a href=\"https://pub.dev/packages/mpflutter_wegame_api\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">mpflutter_wegame_api</a> 库，这个库提供了 Dart 的调用封装，你不需要编写任何 JavaScript 代码就可以调用微信 API。</p>\n\n\n<p class=\"feishu-p\">添加以下依赖到 pubspec.yaml 就可以使用了：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">\n  mpflutter_wegame_api: {请自行替换成最新版本号}</code></pre>\n                </div>\n\n\n\n<h4 id=\"heading-wegame_api-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-wegame_api-3\" class=\"heading-anchor\">#</a>示例代码</h4>\n\n\n<p class=\"feishu-p\">对于同步返回方法，你可以直接获取结果。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wegame_api/mpflutter_wegame_api.dart&#x27;;\n\nfinal result = wx.getSystemInfoSync();\nprint(result.model);</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">对于异步返回方法以及带参数的方法，你需要使用 .. 的方法设置 Option 参数。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wegame_api/mpflutter_wegame_api.dart&#x27;;\n\nwx.getSystemInfoAsync(GetSystemInfoAsyncOption()\n      ..success = (result) {\n        final snackBar = SnackBar(\n          content: Text(&#x27;Device model = ${result.model}&#x27;),\n        );\n        ScaffoldMessenger.of(context).showSnackBar(snackBar);\n      });</code></pre>\n                </div>\n\n\n", "headings": [{"id": "heading-wegame_api-1", "title": "7.1 微信小游戏 API 封装库 (mpflutter_wegame_api)", "level": 2}, {"id": "heading-wegame_api-2", "title": "封装库", "level": 4}, {"id": "heading-wegame_api-3", "title": "示例代码", "level": 4}], "wordCount": 1622, "readTime": 5, "file": "微信小游戏平台特性_微信小游戏 API 封装库_TCIHwggmsiJ7JZkcJRNcHELEnfe.html"}, {"id": "license_support", "chapterId": "chap_license_support", "chapterTitle": "九、商用授权、创业计划与技术支持", "title": "商用授权与去除 UNLICENSE 角标", "icon": "💼", "date": "2024年10月1日", "html": "\n<h2 id=\"heading-license_support-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-license_support-1\" class=\"heading-anchor\">#</a>8.1 商用授权与去除 UNLICENSE 角标</h2>\n\n\n<p class=\"feishu-p\">目前 MPFlutter 2.0 已取消收费，你可以自由使用。</p>\n\n\n\n<h4 id=\"heading-license_support-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-license_support-2\" class=\"heading-anchor\">#</a>我可以去掉未授权（UNLICENSE）角标吗？</h4>\n\n\n<p class=\"feishu-p\">可以，你可以自由去掉，请通过以下方式去除，修改 scripts/build_wechat.dart。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">javascript</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-javascript\">import &#x27;package:mpflutter_build_tools/main.dart&#x27; as build_tools;\n\n  final buildArgs = [...arguments]..add(&#x27;--wechat&#x27;);\n  build_tools.licenseGrant = true;\n  build_tools.main(buildArgs);\n}</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">MPFlutter 2.0 版本并不是一个完全开源（代码开源、商用付费）的项目，如果你使用 MPFlutter 开发的小程序、小游戏需要用于商业目的，需要购买商用授权。</p>\n\n\n\n<h4 id=\"heading-license_support-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-license_support-3\" class=\"heading-anchor\">#</a>商业目的定义</h4>\n\n<ul class=\"feishu-ul\">\n<li>面向企业内部的应用，属于商业目的，需要购买授权。</li>\n<li>面向公众的应用，属于商业目的，需要购买授权。</li>\n<li>目标用户只包括开发者自己，无任何营利目的，不需要购买授权。</li>\n<li>目标用户是以教学演示、内部研究为目的的小程序、小游戏，不需要购买授权。</li>\n<li>小程序、小游戏关联实体是自然人，并且小程序、小游戏没有增加任何广告，未用于盈利目的，不需要购买授权，这种行为需要联系作者备案，会提供免费授权证书。</li>\n</ul>\n\n\n<h4 id=\"heading-license_support-4\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-license_support-4\" class=\"heading-anchor\">#</a>个人开发者创业支持计划</h4>\n\n\n<p class=\"feishu-p\">针对个人开发者创业需求，特制定该计划，如果同时满足以下条件，可以申请免费授权：</p>\n\n<ul class=\"feishu-ul\">\n<li>小程序、小游戏认证主体为个人；</li>\n<li>年度广告收入不超过人民币 1000 元（本计划允许放置广告）；</li>\n<li>在掘金、Bilibili、知乎等平台，发表与该小程序相关的文章并提及 MPFlutter，默认授权 MPFlutter 团队转载你的文章。</li>\n</ul>\n\n<p class=\"feishu-p\">详情请阅读 <a href=\"https://mpflutter.feishu.cn/wiki/SH4dwtMpPi0m14kMMCkcaIyWnuh\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">个人开发者创业支持计划</a></p>\n\n\n\n<h4 id=\"heading-license_support-5\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-license_support-5\" class=\"heading-anchor\">#</a>授权方式</h4>\n\n<ul class=\"feishu-ul\">\n<li>MPFlutter 的授权是针对单个 appId 授予的，每一个上线的小程序、小游戏都需要购买一次授权。</li>\n<li>授权是无期限的，单个 appId 购买授权后就可以一直使用。</li>\n<li>授权是不可转让的，只能服务于购买时指定的 appId。</li>\n</ul>\n\n\n<h4 id=\"heading-license_support-6\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-license_support-6\" class=\"heading-anchor\">#</a>价格</h4>\n\n\n<p class=\"feishu-p\">一个 appId 永久授权价格 ￥300.00</p>\n\n\n<p class=\"feishu-p\">授权包含以下服务：</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-license_support-1", "title": "8.1 商用授权与去除 UNLICENSE 角标", "level": 2}, {"id": "heading-license_support-2", "title": "我可以去掉未授权（UNLICENSE）角标吗？", "level": 4}, {"id": "heading-license_support-3", "title": "商业目的定义", "level": 4}, {"id": "heading-license_support-4", "title": "个人开发者创业支持计划", "level": 4}, {"id": "heading-license_support-5", "title": "授权方式", "level": 4}, {"id": "heading-license_support-6", "title": "价格", "level": 4}], "wordCount": 1238, "readTime": 4, "file": "13_商用授权购买_KEL9wIQ7ji4ChmkFnTfcIvJPnzb.html"}, {"id": "startup_program", "chapterId": "chap_license_support", "chapterTitle": "九、商用授权、创业计划与技术支持", "title": "个人开发者创业支持计划", "icon": "🤝", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-startup_program-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-startup_program-1\" class=\"heading-anchor\">#</a>8.2 个人开发者创业支持计划</h2>\n\n\n\n<h4 id=\"heading-startup_program-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-startup_program-2\" class=\"heading-anchor\">#</a>前提条件</h4>\n\n\n<p class=\"feishu-p\">针对个人开发者创业需求，特制定该计划，如果同时满足以下条件，可以申请免费授权：</p>\n\n<ul class=\"feishu-ul\">\n<li>小程序、小游戏认证主体为个人；</li>\n<li>年度广告收入不超过人民币 1000 元（本计划允许放置广告）；</li>\n<li>在掘金、Bilibili、知乎等平台，发表与该小程序相关的文章并提及 MPFlutter，默认授权 MPFlutter 团队转载你的文章。</li>\n</ul>\n\n\n<h4 id=\"heading-startup_program-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-startup_program-3\" class=\"heading-anchor\">#</a>授权申请方式</h4>\n\n\n<p class=\"feishu-p\">请通过微信添加 PonyCui@MPFlutter 咨询。</p>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/startup_support_qr.jpeg\" alt=\"image\" class=\"zoomable-img\" onclick=\"openLightbox('./images/startup_support_qr.jpeg', 'image')\" />\n                <div class=\"image-caption\">image</div>\n            </div>\n\n<p class=\"feishu-p\">创业计划授权期限为一年，可申请续期，续期时如果仍然满足前提条件，可继续免费申请。</p>\n\n\n<p class=\"feishu-p\">自 2024 年 1 月 1 日起已付费购买授权的，可申请退款。</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-startup_program-1", "title": "8.2 个人开发者创业支持计划", "level": 2}, {"id": "heading-startup_program-2", "title": "前提条件", "level": 4}, {"id": "heading-startup_program-3", "title": "授权申请方式", "level": 4}], "wordCount": 371, "readTime": 1, "file": "14_个人开发者创业支持计划_SH4dwtMpPi0m14kMMCkcaIyWnuh.html"}, {"id": "tech_support", "chapterId": "chap_license_support", "chapterTitle": "九、商用授权、创业计划与技术支持", "title": "技术支持与交流渠道", "icon": "💬", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-tech_support-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-tech_support-1\" class=\"heading-anchor\">#</a>8.3 技术支持与交流渠道</h2>\n\n\n\n<h4 id=\"heading-tech_support-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-tech_support-2\" class=\"heading-anchor\">#</a>BUG 反馈方式</h4>\n\n\n<p class=\"feishu-p\">请直接联系 PonyCui@MPFlutter 私信提 BUG，也可以直接在 <a href=\"https://github.com/mpflutter/mpflutter/issues\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">GitHub</a> 上提 Issue。</p>\n\n\n<p class=\"feishu-p\">提 BUG 要求，使用飞书文档创建 <a href=\"https://weypl4zsnv.feishu.cn/wiki/SaOSwFEtEiG7XkkmBftc67Jxnee\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">BUG 模板</a>  副本，填好问题答案再私信。</p>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/tech_support_qr.jpeg\" alt=\"image\" class=\"zoomable-img\" onclick=\"openLightbox('./images/tech_support_qr.jpeg', 'image')\" />\n                <div class=\"image-caption\">image</div>\n            </div>\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-tech_support-1", "title": "8.3 技术支持与交流渠道", "level": 2}, {"id": "heading-tech_support-2", "title": "BUG 反馈方式", "level": 4}], "wordCount": 190, "readTime": 1, "file": "15_技术支持_EXg0w88B7iCZkbkzGkscZtWlnZf.html"}, {"id": "bug_template", "chapterId": "chap_license_support", "chapterTitle": "九、商用授权、创业计划与技术支持", "title": "标准 BUG 反馈模板", "icon": "🐛", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-bug_template-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-bug_template-1\" class=\"heading-anchor\">#</a>8.4 标准 BUG 反馈模板</h2>\n\n\n<p class=\"feishu-p\">文档编写完成后，参考<<a href=\"https://www.feishu.cn/hc/zh-CN/articles/360049067493-%E5%B0%86%E6%96%87%E6%A1%A3%E5%88%86%E4%BA%AB%E7%BB%99%E4%BC%81%E4%B8%9A%E5%A4%96%E9%83%A8%E4%BA%BA%E5%91%98\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">方式三：将云文档设置为获得链接可见</a>>分享给 MPFlutter 成员。</p>\n\n\n<p class=\"feishu-p\">如果不希望使用链接分享，保密要求较高，你可以直接将内容和 zip 包以邮件形式发送到 <a href=\"mailto:service@mpflutter.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">service@mpflutter.com</a></p>\n\n\n\n<h4 id=\"heading-bug_template-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-bug_template-2\" class=\"heading-anchor\">#</a>保密要求</h4>\n\n\n<p class=\"feishu-p\">保密 BUG 将不会添加到公开 List 中</p>\n\n\n<p class=\"feishu-p\">是否保密？</p>\n\n\n\n<h4 id=\"heading-bug_template-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-bug_template-3\" class=\"heading-anchor\">#</a>开发环境（必填）</h4>\n\n\n<p class=\"feishu-p\">Flutter 版本号：</p>\n\n\n<p class=\"feishu-p\">MPFlutter 版本号：</p>\n\n\n<p class=\"feishu-p\">操作系统：</p>\n\n\n<p class=\"feishu-p\">IDE：</p>\n\n\n\n<h4 id=\"heading-bug_template-4\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-bug_template-4\" class=\"heading-anchor\">#</a>问题描述（必填）</h4>\n\n\n<p class=\"feishu-p\">请具体描述问题的复现方法，如果有错误堆栈及错误码也贴到这里</p>\n\n\n\n<h4 id=\"heading-bug_template-5\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-bug_template-5\" class=\"heading-anchor\">#</a>问题工程文件（可选）</h4>\n\n\n<p class=\"feishu-p\">请使用 zip 打包工程文件，上传到这里，请不要打包 build 和 .dart_tool 目录</p>\n\n\n<p class=\"feishu-p\">推荐内容由 AI 生成</p>\n\n\n", "headings": [{"id": "heading-bug_template-1", "title": "8.4 标准 BUG 反馈模板", "level": 2}, {"id": "heading-bug_template-2", "title": "保密要求", "level": 4}, {"id": "heading-bug_template-3", "title": "开发环境（必填）", "level": 4}, {"id": "heading-bug_template-4", "title": "问题描述（必填）", "level": 4}, {"id": "heading-bug_template-5", "title": "问题工程文件（可选）", "level": 4}], "wordCount": 362, "readTime": 1, "file": "技术支持_BUG 模板_SaOSwFEtEiG7XkkmBftc67Jxnee.html"}, {"id": "version_info", "chapterId": "chap_version_info", "chapterTitle": "十、版本信息与更新日志 (ChangeLog)", "title": "版本信息与更新日志 (2.0.0 ~ 2.8.0)", "icon": "📋", "date": "2025年3月25日", "html": "\n<h2 id=\"heading-version_info-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-version_info-1\" class=\"heading-anchor\">#</a>九、版本信息与更新日志 (ChangeLog)</h2>\n\n\n<h2 id=\"heading-version_info-2\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-version_info-2\" class=\"heading-anchor\">#</a>9.1 稳定版本与发布说明</h2>\n\n\n\n<h4 id=\"heading-version_info-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-3\" class=\"heading-anchor\">#</a>稳定版本</h4>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">dependencies:\n  flutter:\n    sdk: flutter\n  mpflutter_core: 2.8.0 # Flutter 3.27 及以下版本请使用 -&gt; 2.7.8\n  mpflutter_build_tools: 2.8.0\n  mpflutter_wechat_api: 2.2.4 # 这是微信小程序 API\n  mpflutter_wegame_api: 2.5.0 # 这是微信小游戏 API</code></pre>\n                </div>\n\n\n\n<h5 id=\"heading-version_info-4\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-version_info-4\" class=\"heading-anchor\">#</a>ChangeLog</h5>\n\n\n\n<p class=\"feishu-p\">####### 2.8.0(2025-03-25)</p>\n\n\n<p class=\"feishu-p\">注意：Flutter 3.29 版本需要在 main.dart 中设置字体为 Noto Sans SC 才能正确显示中文。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">material.MaterialApp(\n  theme: material.ThemeData(\n    fontFamily: &quot;Noto Sans SC&quot;,\n    fontFamilyFallback: const [&quot;Noto Sans SC&quot;],\n  )\n)</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">新增功能：</p>\n\n<ul class=\"feishu-ul\">\n<li>支持 Flutter 3.29 版本</li>\n</ul>\n\n\n<p class=\"feishu-p\">####### 2.7.15(2025-2-8)</p>\n\n\n<p class=\"feishu-p\">修复问题：</p>\n\n<ul class=\"feishu-ul\">\n<li>Flutter 3.27 无法加载图片的问题</li>\n</ul>\n\n\n<p class=\"feishu-p\">####### 2.7.12(2025-1-26)</p>\n\n\n<p class=\"feishu-p\">修复问题：</p>\n\n<ul class=\"feishu-ul\">\n<li>支持 Flutter 3.27</li>\n<li>支持 NPM Package 定义</li>\n</ul>\n\n\n<p class=\"feishu-p\">####### 2.7.11(2025-1-11)</p>\n\n\n<p class=\"feishu-p\">修复问题：</p>\n\n<ul class=\"feishu-ul\">\n<li>支持微信小程序在鸿蒙系统上运行</li>\n</ul>\n\n\n<p class=\"feishu-p\">####### 2.7.10(2024-12-31)</p>\n\n\n<p class=\"feishu-p\">修复问题：</p>\n\n<ul class=\"feishu-ul\">\n<li>修正 PlatformView 在多次 Route 跳转后可能不再显示的问题</li>\n<li>修正使用微信小程序插件后白屏的问题</li>\n</ul>\n\n\n<h5 id=\"heading-version_info-4\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-version_info-4\" class=\"heading-anchor\">#</a>完整历史版本记录 (2.0.0 ~ 2.8.0)</h5>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<div class=\"table-container\"><table class=\"feishu-table\">\n<thead><tr><th>版本</th><th>发布日期</th><th>核心更新说明</th><th>适用 Flutter SDK</th></tr></thead>\n<tbody>\n<tr><td><strong>2.8.0</strong></td><td>2025-03-25</td><td>支持 Flutter 3.29，中文字体配置 <code class=\"inline-code\">Noto Sans SC</code></td><td>Flutter 3.29+</td></tr>\n<tr><td><strong>2.7.15</strong></td><td>2025-02-08</td><td>修复 Flutter 3.27 无法加载图片问题</td><td>Flutter 3.27</td></tr>\n<tr><td><strong>2.7.12</strong></td><td>2025-01-26</td><td>支持 Flutter 3.27，支持 NPM Package 定义</td><td>Flutter 3.27</td></tr>\n<tr><td><strong>2.7.11</strong></td><td>2025-01-11</td><td><strong>重磅：全面支持华为鸿蒙系统（HarmonyOS NEXT）微信小程序运行</strong></td><td>Flutter 3.16 ~ 3.27</td></tr>\n<tr><td><strong>2.7.10</strong></td><td>2024-12-31</td><td>修复 PlatformView 多次 Route 跳转显示异常，修复小程序插件白屏</td><td>Flutter 3.16 ~ 3.24</td></tr>\n<tr><td><strong>2.7. ter 3.16</td></tr>\n<tr><td><strong>2.2.0</strong></td><td>2024-01-29</td><td>推出 mpflutter_wechat_api 微信专属 API 库</td><td>Flutter 3.16</td></tr>\n<tr><td><strong>2.1.2</strong></td><td>2024-01-20</td><td>适配系统深色模式（Dark Mode）动态切换监听</td><td>Flutter 3.16</td></tr>\n<tr><td><strong>2.1.0</strong></td><td>2024-01-14</td><td>全面支持 Dark Mode 暗色模式适配能力</td><td>Flutter 3.16</td></tr>\n<tr><td><strong>2.0.2</strong></td><td>2024-01-08</td><td>初始稳定性优化与性能调优</td><td>Flutter 3.16</td></tr>\n<tr><td><strong>2.0.0</strong></td><td>2024-01-07</td><td><strong>MPFlutter 2.0 正式版重磅发布</strong>：基于 Skia + WebGL 渲染引擎重构，开发体验无限接近 Flutter 原生应用</td><td>Flutter 3.16</td></tr>\n</tbody></table></div>\n\n\n\n\n", "headings": [{"id": "heading-version_info-1", "title": "九、版本信息与更新日志 (ChangeLog)", "level": 2}, {"id": "heading-version_info-2", "title": "9.1 稳定版本与发布说明", "level": 2}, {"id": "heading-version_info-3", "title": "稳定版本", "level": 4}], "wordCount": 3046, "readTime": 10, "file": "16_版本信息_LBtYwgw3Yi0BQzk6XTIcLOVrnZc.html"}, {"id": "articles_and_cases", "chapterId": "chap_articles_and_cases", "chapterTitle": "十一、深度技术博文与精选案例", "title": "Blog Articles 深度技术博文与精选案例概述", "icon": "📝", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-articles_and_cases-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-articles_and_cases-1\" class=\"heading-anchor\">#</a>十、深度技术博文与精选案例</h2>\n\n\n", "headings": [{"id": "heading-articles_and_cases-1", "title": "十、深度技术博文与精选案例", "level": 2}], "wordCount": 18, "readTime": 1, "file": "17_Blog Articles_Bev8wGeWFiy8yWkBNYocdbaJnqh.html"}, {"id": "article_how", "chapterId": "chap_articles_and_cases", "chapterTitle": "十一、深度技术博文与精选案例", "title": "在微信小程序里运行完整的 Flutter，怎么做到的？", "icon": "🔬", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-article_how-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-article_how-1\" class=\"heading-anchor\">#</a>10.1 在微信小程序里运行完整的 Flutter，怎么做到的？</h2>\n\n\n\n<h4 id=\"heading-article_how-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-2\" class=\"heading-anchor\">#</a>背景</h4>\n\n\n<p class=\"feishu-p\">小程序是一种全新的业务形态，特别是微信小程序，既结合了 Web 动态化特性，又拥有 Native 丰富的设备能力支持。</p>\n\n\n<p class=\"feishu-p\">在微信这个宿主上，小程序不仅有稳定的分发渠道，更拥有完善的生命周期、数据、AI 能力支持。</p>\n\n\n<p class=\"feishu-p\">在该微信上开发小程序，一般使用以下两种方法：</p>\n\n<ul class=\"feishu-ul\">\n<li>JavaScript + WXML + WCSS</li>\n<li>Taro + React + JavaScript</li>\n</ul>\n\n<p class=\"feishu-p\">本文要介绍的是使用 Flutter Framework 开发小程序的方法，以及该方法背后的技术原理。</p>\n\n\n\n<h4 id=\"heading-article_how-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-3\" class=\"heading-anchor\">#</a>技术挑战</h4>\n\n\n<p class=\"feishu-p\">尽管 Flutter 官方已经提供 Flutter Web 实现，Flutter Web 本身就是基于 dart2js 运行的，微信小程序可以运行 JavaScript，在原理上跑起 Flutter Web 是没有问题的。</p>\n\n\n<p class=\"feishu-p\">但仍然存在以下技术挑战：</p>\n\n<ul class=\"feishu-ul\">\n<li>微信小程序没有 W3C 标准的 JavaScript 对象，Flutter Web 不能直接运行。</li>\n<li>微信小程序也没有 DOM 实现，Flutter Web HTML Renderer 不能直接渲染。</li>\n<li>微信小程序对包大小的限制十分严格，主包不能超过 2M，而 Flutter Web 所编译的 main.dart.js 初始体积就有 1.3 M，必须有合理的分包机制才能上传。</li>\n</ul>\n\n<p class=\"feishu-p\">我们在 MPFlutter 1.x 版本中，针对上述问题已有一定的探索，1.x 版本的解决方法如下：</p>\n\n<ul class=\"feishu-ul\">\n<li>使用微信开源的 kbone 库，模拟 W3C 实现，并通过模拟的 DOM 对象渲染出符合 WXML 要求的视图树。</li>\n<li>通过 Shadow Element Tree 的方式，使用 JSON 在 Dart 与 JavaScript 上下文同步视图树。</li>\n<li>Fork Flutter Framework，并对其进行外科手术式的裁剪，使 main.dart.js 初始体积降低到 600K。</li>\n</ul>\n\n<p class=\"feishu-p\">MPFlutter 1.x 方案已经良好的运行了两年，也收到了开发者非常多的反馈，开发者常诟病于裁剪后的 Flutter Framework 不兼容 Flutter 生态上的插件，同时 material 库也无法使用，需要从头开始编写 UI。</p>\n\n\n<p class=\"feishu-p\">在 MPFlutter 2.0 版本，我们重新思考在小程序上运行 Flutter 的最佳方式，并在最终使用 CanvasKit Renderer 解决以上全部问题。</p>\n\n\n\n<h4 id=\"heading-article_how-4\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-4\" class=\"heading-anchor\">#</a>技术方案</h4>\n\n\n\n<h5 id=\"heading-article_how-5\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-article_how-5\" class=\"heading-anchor\">#</a>Summary0 字</h5>\n\n\n<hr class=\"feishu-hr\" n\n\n<h3 id=\"heading-showcase-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-showcase-2\" class=\"heading-anchor\">#</a>像素小画家</h3>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/case_pixel_painter.jpeg\" alt=\"像素小画家\" class=\"zoomable-img\" onclick=\"openLightbox('./images/case_pixel_painter.jpeg', '像素小画家')\" />\n                <div class=\"image-caption\">像素小画家</div>\n            </div>\n\n\n<p class=\"feishu-p\">一款好用的像素原教旨主义创作工具，基于 mpflutter2.0 构建，拥有优秀的性能，流畅的交互，更多功能持续更新中…</p>\n\n\n<h3 id=\"heading-showcase-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-showcase-3\" class=\"heading-anchor\">#</a>觅音之旅</h3>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/case_music_journey_qr.png\" alt=\"觅音之旅小程序码\" class=\"zoomable-img\" onclick=\"openLightbox('./images/case_music_journey_qr.png', '觅音之旅小程序码')\" />\n                <div class=\"image-caption\">觅音之旅小程序码</div>\n            </div>\n\n\n<p class=\"feishu-p\">觅音将简约与宁静相结合，帮助您从快节奏中脱离，为您提供一个没有干扰的平静时空，保持专注、冥想片刻、放松思绪。</p>\n\n<ul class=\"feishu-ul\">\n<li><strong>源码开源地址</strong>：<a href=\"https://github.com/swiftdo/sound\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://github.com/swiftdo/sound</a></li>\n</ul>\n\n\n<h3 id=\"heading-showcase-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-showcase-4\" class=\"heading-anchor\">#</a>MPFlutter Wonderous</h3>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/case_pixel_painter_qr.png\" alt=\"Wonderous 博物案例\" class=\"zoomable-img\" onclick=\"openLightbox('./images/case_pixel_painter_qr.png', 'Wonderous 博物案例')\" />\n                <div class=\"image-caption\">Wonderous 博物案例</div>\n            </div>\n\n\n<p class=\"feishu-p\">Wonderous 是一个博物展示类小程序，是 MPFlutter 官方示例小程序，原始应用由 gskinner 开发并开源。</p>\n\n<ul class=\"feishu-ul\">\n<li><strong>源码开源地址</strong>：<a href=\"https://github.com/mpflutter/flutter-wonderous-app/tree/mpflutter\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://github.com/mpflutter/flutter-wonderous-app/tree/mpflutter</a></li>\n</ul>\n\n\n<h3 id=\"heading-showcase-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-showcase-5\" class=\"heading-anchor\">#</a>小周五子棋（小游戏）</h3>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/case_music_journey.jpeg\" alt=\"小周五子棋游戏封面\" class=\"zoomable-img\" onclick=\"openLightbox('./images/case_music_journey.jpeg', '小周五子棋游戏封面')\" />\n                <div class=\"image-caption\">小周五子棋游戏封面</div>\n            </div>\n\n\n<p class=\"feishu-p\">《小周五子棋》是一款五子棋小游戏，可以好友对战、匹配对战、人机对战，也可以面对面双人推演。</p>\n\n\n", "headings": [{"id": "heading-showcase-1", "title": "10.3 MPFlutter 精彩生产案例", "level": 2}, {"id": "heading-showcase-2", "title": "像素小画家", "level": 3}, {"id": "heading-showcase-3", "title": "觅音之旅", "level": 3}, {"id": "heading-showcase-4", "title": "MPFlutter Wonderous", "level": 3}, {"id": "heading-showcase-5", "title": "小周五子棋（小游戏）", "level": 3}], "wordCount": 677, "readTime": 2, "file": "18_精彩案例_BGMNwe6dAiOr6Rkn2oycF9y5nab.html"}];
