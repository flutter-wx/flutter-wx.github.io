        // These two headings are present in the source document's outline even though
        // they currently contain no body blocks.
        const overview = ARTICLES_DATA.find(article => article.id === "overview");
        if (overview) {
            overview.html += `
<h3 id="heading-overview-5" class="doc-heading doc-heading-h3"><a href="#heading-overview-5" class="heading-anchor">#</a>完整的 API 生态配套</h3>
<h3 id="heading-overview-6" class="doc-heading doc-heading-h3"><a href="#heading-overview-6" class="heading-anchor">#</a>下一步</h3>
`;
            overview.headings.push(
                { id: "heading-overview-5", title: "完整的 API 生态配套", level: 3 },
                { id: "heading-overview-6", title: "下一步", level: 3 }
            );
        }

        let currentArticleId = "overview";
        const articlesMap = {};
        ARTICLES_DATA.forEach(a => { articlesMap[a.id] = a; });

        // Initialize Tree
        function renderSidebarTree() {
            const navTree = document.getElementById("sidebarNavTree");
            let html = "";
            CHAPTERS_DATA.forEach(chap => {
                html += `<div class="chapter-group" id="${chap.id}">
                    <div class="chapter-header" onclick="toggleChapter('${chap.id}')">
                        <div class="chapter-header-left">
                            <span>${chap.icon}</span>
                            <span>${chap.title}</span>
                        </div>
                        <svg class="chapter-caret" viewBox="0 0 1024 1024"><path d="M831.872 340.777L512 652.672 192.128 340.777a32 32 0 0 0-45.12 45.44l342.4 333.568a32 32 0 0 0 45.184 0l342.4-333.568a32 32 0 0 0-45.12-45.44z"></path></svg>
                    </div>
                    <div class="chapter-items">`;
                
                chap.items.forEach(item => {
                    const art = articlesMap[item.id];
                    html += `<div class="article-nav-item" id="nav-${item.id}" onclick="switchArticle('${item.id}')">
                        <span class="article-item-icon">${item.icon}</span>
                        <span class="article-item-title" title="${item.title}">${item.title}</span>
                    </div>`;
                });
                
                html += `</div></div>`;
            });
            navTree.innerHTML = html;
        }

        function toggleChapter(chapId) {
            const group = document.getElementById(chapId);
            if (group) {
                group.classList.toggle("collapsed");
            }
        }

        // Switch active article
        function switchArticle(aid, hash) {
            const art = articlesMap[aid];
            if (!art) return;

            currentArticleId = aid;
            window.location.hash = aid;

            // Highlight sidebar item
            document.querySelectorAll(".article-nav-item").forEach(el => el.classList.remove("active"));
            const activeNav = document.getElementById("nav-" + aid);
            if (activeNav) {
                activeNav.classList.add("active");
                // ensure parent chapter expanded
                const parentGroup = activeNav.closest(".chapter-group");
                if (parentGroup) parentGroup.classList.remove("collapsed");
            }

            // Update Breadcrumb
            document.getElementById("breadcrumbArea").innerHTML = `<span>/</span> <span>${art.chapterTitle}</span> <span>/</span> <strong>${art.title}</strong>`;

            // Calculate Prev & Next
            const curIdx = ARTICLES_DATA.findIndex(a => a.id === aid);
            const prevArt = curIdx > 0 ? ARTICLES_DATA[curIdx - 1] : null;
            const nextArt = curIdx < ARTICLES_DATA.length - 1 ? ARTICLES_DATA[curIdx + 1] : null;

            let prevNextHtml = `<div class="article-footer-nav">`;
            if (prevArt) {
                prevNextHtml += `<a href="#${prevArt.id}" class="nav-btn-box" onclick="switchArticle('${prevArt.id}')">
                    <span class="nav-btn-label">← 上一篇</span>
                    <span class="nav-btn-title">${prevArt.icon} ${prevArt.title}</span>
                </a>`;
            } else {
                prevNextHtml += `<div></div>`;
            }
            if (nextArt) {
                prevNextHtml += `<a href="#${nextArt.id}" class="nav-btn-box" style="text-align:right" onclick="switchArticle('${nextArt.id}')">
                    <span class="nav-btn-label">下一篇 →</span>
                    <span class="nav-btn-title">${nextArt.icon} ${nextArt.title}</span>
                </a>`;
            } else {
                prevNextHtml += `<div></div>`;
            }
            prevNextHtml += `</div>`;

            // Render main viewport
            const viewport = document.getElementById("articleViewport");
            viewport.innerHTML = `
                <div class="article-meta-header">
                    <div class="article-badge-row">
                        <span class="badge-chapter">${art.chapterTitle}</span>
                        <span class="badge-updated">最近更新: ${art.date}</span>
                    </div>
                    <h1 class="article-h1-title">${art.icon} ${art.title}</h1>
                    <div class="article-stats-bar">
                        <div class="stat-item">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            <span>阅读时间约 ${art.readTime} 分钟</span>
                        </div>
                        <div class="stat-item">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            <span>全文约 ${art.wordCount} 字</span>
                        </div>
                        <div class="stat-item">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                            <span>已支持离线阅读与代码复制</span>
                        </div>
                    </div>
                </div>
                <div class="article-body-content">
                    ${art.html}
                </div>
                ${prevNextHtml}
            `;

            // Render outline
            renderOutline(art.headings);

            // Scroll to top or specific anchor
            if (hash) {
                setTimeout(() => {
                    const target = document.getElementById(hash);
                    if (target) target.scrollIntoView({ behavior: "smooth" });
                }, 50);
            } else {
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        }

        // Render Right Outline (TOC)
        function renderOutline(headings) {
            const outlineList = document.getElementById("outlineList");
            if (!headings || headings.length === 0) {
                outlineList.innerHTML = `<li class="outline-item" style="color:var(--text-tertiary); font-size:12px; padding:8px;">暂无子章节</li>`;
                return;
            }
            let html = "";
            headings.forEach(h => {
                html += `<li class="outline-item level-${h.level}">
                    <a href="#${h.id}" class="outline-link" id="toc-${h.id}" onclick="scrollToHeading('${h.id}', event)">${h.title}</a>
                </li>`;
            });
            outlineList.innerHTML = html;
            setupScrollSpy();
        }

        function scrollToHeading(hid, e) {
            e.preventDefault();
            const el = document.getElementById(hid);
            if (el) {
                el.scrollIntoView({ behavior: "smooth", block: "start" });
                document.querySelectorAll(".outline-link").forEach(l => l.classList.remove("active"));
                const tocEl = document.getElementById("toc-" + hid);
                if (tocEl) tocEl.classList.add("active");
            }
        }

        // ScrollSpy
        let scrollSpyObserver = null;
        function setupScrollSpy() {
            if (scrollSpyObserver) scrollSpyObserver.disconnect();
            const headingEls = document.querySelectorAll(".doc-heading");
            if (!headingEls.length) return;

            scrollSpyObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        document.querySelectorAll(".outline-link").forEach(l => l.classList.remove("active"));
                        const activeToc = document.getElementById("toc-" + id);
                        if (activeToc) activeToc.classList.add("active");
                    }
                });
            }, { rootMargin: "-80px 0px -70% 0px" });

            headingEls.forEach(h => scrollSpyObserver.observe(h));
        }

        // Copy Code Block
        function copyCode(btn) {
            const codeBlock = btn.closest(".feishu-code-block");
            const codeEl = codeBlock.querySelector("code");
            if (!codeEl) return;
            const text = codeEl.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.innerHTML;
                btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00b07c" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> <span style="color:#00b07c">已复制</span>`;
                showToast("已成功复制到剪贴板 ✓");
                setTimeout(() => { btn.innerHTML = orig; }, 2000);
            }).catch(err => {
                showToast("复制失败，请手动选择复制");
            });
        }

        function showToast(msg) {
            const t = document.getElementById("toastMsg");
            t.querySelector("span").innerText = msg;
            t.classList.add("show");
            setTimeout(() => { t.classList.remove("show"); }, 2500);
        }

        // Lightbox
        function openLightbox(src, alt) {
            const modal = document.getElementById("lightboxModal");
            const img = document.getElementById("lightboxImg");
            img.src = src;
            img.alt = alt || "";
            modal.classList.add("open");
        }

        function closeLightbox() {
            document.getElementById("lightboxModal").classList.remove("open");
        }

        // Sidebar live filter
        function filterSidebar(query) {
            const q = query.trim().toLowerCase();
            document.querySelectorAll(".chapter-group").forEach(group => {
                let matchCount = 0;
                group.querySelectorAll(".article-nav-item").forEach(item => {
                    const title = item.innerText.toLowerCase();
                    if (!q || title.includes(q)) {
                        item.style.display = "flex";
                        matchCount++;
                    } else {
                        item.style.display = "none";
                    }
                });
                if (q && matchCount > 0) {
                    group.classList.remove("collapsed");
                    group.style.display = "block";
                } else if (q && matchCount === 0) {
                    group.style.display = "none";
                } else {
                    group.style.display = "block";
                }
            });
        }

        // Search Modal
        function openSearchModal() {
            const modal = document.getElementById("searchModal");
            modal.classList.add("open");
            const input = document.getElementById("modalSearchInput");
            input.value = "";
            input.focus();
            document.getElementById("searchResultsList").innerHTML = `<div class="search-empty-state">输入关键字即可实时全文检索 42 篇技术文章与代码段</div>`;
        }

        function closeSearchModal(e) {
            if (e && e.target !== document.getElementById("searchModal")) return;
            document.getElementById("searchModal").classList.remove("open");
        }

        function handleSearchQuery(query) {
            const q = query.trim().toLowerCase();
            const resultsContainer = document.getElementById("searchResultsList");
            if (!q) {
                resultsContainer.innerHTML = `<div class="search-empty-state">输入关键字即可实时全文检索 42 篇技术文章与代码段</div>`;
                return;
            }

            const hits = [];
            ARTICLES_DATA.forEach(art => {
                const plainTitle = art.title.toLowerCase();
                const plainHtml = art.html.replace(/<[^>]+>/g, " ");
                const lowerText = plainHtml.toLowerCase();

                let score = 0;
                if (plainTitle.includes(q)) score += 10;
                const matchPos = lowerText.indexOf(q);
                if (matchPos !== -1) {
                    score += 5;
                    const start = Math.max(0, matchPos - 40);
                    const end = Math.min(lowerText.length, matchPos + 80);
                    const snippetRaw = plainHtml.substring(start, end).trim();
                    const snippet = snippetRaw.replace(new RegExp(q, "gi"), match => `<mark>${match}</mark>`);
                    hits.push({ art, score, snippet });
                } else if (score > 0) {
                    hits.push({ art, score, snippet: art.title });
                }
            });

            hits.sort((a, b) => b.score - a.score);

            if (hits.length === 0) {
                resultsContainer.innerHTML = `<div class="search-empty-state">未找到包含 "<strong>${htmlEscape(query)}</strong>" 的文档</div>`;
                return;
            }

            let html = "";
            hits.slice(0, 15).forEach(h => {
                html += `<div class="search-result-item" onclick="selectSearchResult('${h.art.id}')">
                    <div class="search-result-chapter">${h.art.chapterTitle}</div>
                    <div class="search-result-title">${h.art.icon} ${h.art.title}</div>
                    <div class="search-result-snippet">...${h.snippet}...</div>
                </div>`;
            });
            resultsContainer.innerHTML = html;
        }

        function selectSearchResult(aid) {
            document.getElementById("searchModal").classList.remove("open");
            switchArticle(aid);
        }

        function htmlEscape(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Theme Toggle
        function toggleTheme() {
            const cur = document.documentElement.getAttribute("data-theme");
            const next = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("mpflutter_theme", next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            document.getElementById("themeIcon").innerText = theme === "dark" ? "☀️" : "🌓";
        }

        // Keyboard navigation
        document.addEventListener("keydown", (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === "k") {
                e.preventDefault();
                openSearchModal();
            }
            if (e.key === "Escape") {
                closeSearchModal();
                closeLightbox();
            }
        });

        // Bootstrap on load
        function initApp() {
            const savedTheme = localStorage.getItem("mpflutter_theme") || "light";
            document.documentElement.setAttribute("data-theme", savedTheme);
            updateThemeIcon(savedTheme);

            renderSidebarTree();

            // Hash router
            const hash = window.location.hash.replace("#", "");
            if (hash && articlesMap[hash]) {
                switchArticle(hash);
            } else {
                switchArticle("overview");
            }
        }

        if (document.readyState === "loading") {
            window.addEventListener("DOMContentLoaded", initApp);
        } else {
            initApp();
        }

        window.addEventListener("hashchange", () => {
            const hash = window.location.hash.replace("#", "");
            if (hash && articlesMap[hash] && hash !== currentArticleId) {
                switchArticle(hash);
            }
        });
    </script>
</body>
</html>
