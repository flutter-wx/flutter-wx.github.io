<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPFlutter 2.0 官方文档中心 (100% 本地离线镜像)</title>
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-sidebar: #f5f6f7;
            --bg-header: #ffffff;
            --border-color: #dee0e3;
            --border-subtle: #ebedf0;
            --text-primary: #1f2329;
            --text-secondary: #646a73;
            --text-tertiary: #8f959e;
            --brand-color: #3370ff;
            --brand-hover: #245bdb;
            --brand-bg: #e1eaff;
            --brand-light: #f0f4ff;
            --code-bg: #1e1e1e;
            --code-text: #e6e6e6;
            --code-header-bg: #2d2d2d;
            --code-border: #3c3c3c;
            --callout-info-bg: #eef4fe;
            --callout-info-border: #3370ff;
            --callout-warn-bg: #fff8eb;
            --callout-warn-border: #ff9800;
            --table-header-bg: #f5f6f7;
            --table-hover-bg: #f7f8fa;
            --card-bg: #ffffff;
            --card-border: #dee0e3;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --outline-hover: #f0f1f2;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        [data-theme="dark"] {
            --bg-body: #17181a;
            --bg-sidebar: #1f2023;
            --bg-header: #1f2023;
            --border-color: #2d2f33;
            --border-subtle: #25262a;
            --text-primary: #f0f1f2;
            --text-secondary: #9ea3ab;
            --text-tertiary: #6b7078;
            --brand-color: #4a89ff;
            --brand-hover: #699fff;
            --brand-bg: #1c2b4d;
            --brand-light: #1f2838;
            --code-bg: #141517;
            --code-text: #f0f1f2;
            --code-header-bg: #1e2024;
            --code-border: #2d2f33;
            --callout-info-bg: #182338;
            --callout-info-border: #4a89ff;
            --callout-warn-bg: #2d2112;
            --callout-warn-border: #e68a00;
            --table-header-bg: #232529;
            --table-hover-bg: #282a2f;
            --card-bg: #1f2023;
            --card-border: #2d2f33;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            --outline-hover: #282a2f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-primary);
            background-color: var(--bg-body);
            -webkit-font-smoothing: antialiased;
        }

        /* Header Bar */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 16px;
        }

        .header-logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #3370ff, #00d6b9);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 2px 6px rgba(51,112,255,0.3);
        }

        .header-badge {
            font-size: 11px;
            padding: 2px 8px;
            background: #e1fbf4;
            color: #008765;
            border-radius: 12px;
            font-weight: 500;
            border: 1px solid rgba(0,135,101,0.2);
        }

        [data-theme="dark"] .header-badge {
            background: #0f3329;
            color: #4ce2b8;
            border-color: #174d3f;
        }

        .header-breadcrumbs {
            margin-left: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-breadcrumbs span {
            color: var(--text-tertiary);
        }

        .header-breadcrumbs strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        .header-center {
            flex: 1;
            max-width: 460px;
            margin: 0 24px;
        }

        .header-search-btn {
            width: 100%;
            height: 36px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-tertiary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .header-search-btn:hover {
            border-color: var(--brand-color);
            color: var(--text-secondary);
            background: var(--bg-body);
        }

        .search-shortcut-badge {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-header {
            height: 34px;
            padding: 0 12px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-primary);
            font-weight: 500;
        }

        .btn-header:hover {
            background: var(--bg-sidebar);
            border-color: var(--brand-color);
            color: var(--brand-color);
        }

        .btn-header-primary {
            background: var(--brand-color);
            border-color: var(--brand-color);
            color: white;
        }

        .btn-header-primary:hover {
            background: var(--brand-hover);
            border-color: var(--brand-hover);
            color: white;
        }

        .offline-status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #008765;
            background: #e1fbf4;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        [data-theme="dark"] .offline-status-indicator {
            background: #0f3329;
            color: #4ce2b8;
        }

        .offline-dot {
            width: 8px;
            height: 8px;
            background: #00b07c;
            border-radius: 50%;
            box-shadow: 0 0 6px #00b07c;
        }

        /* App Container */
        .app-container {
            display: flex;
            margin-top: 56px;
            min-height: calc(100vh - 56px);
        }

        /* Left Sidebar */
        .app-sidebar {
            width: 300px;
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            height: calc(100vh - 56px);
            position: sticky;
            top: 56px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .sidebar-filter-box {
            padding: 14px 16px 10px;
            position: sticky;
            top: 0;
            background: var(--bg-sidebar);
            z-index: 10;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sidebar-filter-input {
            width: 100%;
            height: 32px;
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }

        .sidebar-filter-input:focus {
            border-color: var(--brand-color);
        }

        .sidebar-tree {
            padding: 10px 8px 30px;
            flex: 1;
        }

        .chapter-group {
            margin-bottom: 6px;
        }

        .chapter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: background 0.15s;
        }

        .chapter-header:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .chapter-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chapter-caret {
            width: 14px;
            height: 14px;
            transition: transform 0.2s;
            fill: currentColor;
        }

        .chapter-group.collapsed .chapter-caret {
            transform: rotate(-90deg);
        }

        .chapter-group.collapsed .chapter-items {
            display: none;
        }

        .chapter-items {
            padding-left: 12px;
            margin-top: 2px;
        }

        .article-nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 2px;
            transition: all 0.15s;
            position: relative;
        }

        .article-nav-item:hover {
            background: var(--outline-hover);
        }

        .article-nav-item.active {
            background: var(--brand-bg);
            color: var(--brand-color);
            font-weight: 600;
        }

        .article-nav-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 4px;
            bottom: 4px;
            width: 3px;
            background: var(--brand-color);
            border-radius: 2px;
        }

        .article-item-icon {
            font-size: 14px;
            flex-shrink: 0;
        }

        .article-item-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Content View */
        .app-main {
            flex: 1;
            min-width: 0;
            display: flex;
            justify-content: center;
            background: var(--bg-body);
        }

        .article-container {
            width: 100%;
            max-width: 880px;
            padding: 40px 48px 80px;
            min-height: calc(100vh - 56px);
        }

        /* Article Meta */
        .article-meta-header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .article-badge-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .badge-chapter {
            font-size: 12px;
            color: var(--brand-color);
            background: var(--brand-bg);
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: 500;
        }

        .badge-updated {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .article-h1-title {
            font-size: 30px;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .article-stats-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Typography & Feishu Style */
        .doc-heading {
            color: var(--text-primary);
            font-weight: 600;
            margin-top: 36px;
            margin-bottom: 14px;
            position: relative;
            scroll-margin-top: 80px;
        }

        .doc-heading-h2 {
            font-size: 22px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 8px;
        }

        .doc-heading-h3 {
            font-size: 18px;
        }

        .doc-heading-h4 {
            font-size: 15px;
        }

        .heading-anchor {
            opacity: 0;
            position: absolute;
            left: -20px;
            color: var(--text-tertiary);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .doc-heading:hover .heading-anchor {
            opacity: 1;
        }

        .feishu-p {
            margin-bottom: 16px;
            line-height: 1.8;
            color: var(--text-primary);
        }

        .feishu-link {
            color: var(--brand-color);
            text-decoration: none;
            border-bottom: 1px solid rgba(51,112,255,0.3);
            transition: border-color 0.2s;
        }

        .feishu-link:hover {
            border-bottom-color: var(--brand-color);
        }

        .inline-code {
            font-family: var(--font-mono);
            font-size: 13px;
            background: var(--bg-sidebar);
            color: #d13438;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        [data-theme="dark"] .inline-code {
            color: #f87171;
        }

        .feishu-hr {
            border: none;
            height: 1px;
            background: var(--border-color);
            margin: 32px 0;
        }

        /* Lists */
        .feishu-ul, .feishu-ol {
            padding-left: 24px;
            margin-bottom: 16px;
            line-height: 1.8;
        }

        .feishu-ul li, .feishu-ol li {
            margin-bottom: 6px;
        }

        /* Code Block */
        .feishu-code-block {
            background: var(--code-bg);
            border-radius: 8px;
            margin: 20px 0;
            overflow: hidden;
            border: 1px solid var(--code-border);
            box-shadow: var(--shadow-sm);
        }

        .code-block-bar {
            background: var(--code-header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            border-bottom: 1px solid var(--code-border);
        }

        .code-badge {
            font-size: 11px;
            font-family: var(--font-mono);
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .code-copy-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            color: #c0c0c0;
            padding: 3px 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .code-copy-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
            border-color: rgba(255,255,255,0.3);
        }

        .feishu-code-block pre {
            margin: 0;
            padding: 16px;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 13.5px;
            line-height: 1.65;
            color: var(--code-text);
        }

        /* Callout Box */
        .callout-card {
            border-radius: 8px;
            padding: 16px 20px;
            margin: 22px 0;
            border-left: 4px solid var(--callout-info-border);
            background: var(--callout-info-bg);
        }

        .callout-card.callout-important {
            border-left-color: #3370ff;
            background: var(--callout-info-bg);
        }

        .callout-card.callout-warning {
            border-left-color: #ff9800;
            background: var(--callout-warn-bg);
        }

        .callout-card.callout-tip {
            border-left-color: #00b07c;
            background: #e6f9f3;
        }

        [data-theme="dark"] .callout-card.callout-tip {
            background: #0d3023;
        }

        .callout-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .callout-icon {
            font-size: 16px;
        }

        .callout-content {
            font-size: 14px;
            line-height: 1.7;
        }

        .callout-content p {
            margin-bottom: 8px;
        }

        .callout-content p:last-child {
            margin-bottom: 0;
        }

        /* File Download Card */
        .feishu-file-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px 18px;
            margin: 20px 0;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .feishu-file-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--brand-color);
        }

        .file-card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .file-card-icon-wrap {
            flex-shrink: 0;
        }

        .file-card-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .file-card-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .file-size-badge {
            font-weight: 600;
            color: var(--brand-color);
        }

        .file-card-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-card {
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-card-download {
            background: var(--brand-color);
            color: white;
            border: 1px solid var(--brand-color);
        }

        .btn-card-download:hover {
            background: var(--brand-hover);
            border-color: var(--brand-hover);
        }

        .btn-card-browse {
            background: var(--bg-sidebar);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-card-browse:hover {
            background: var(--outline-hover);
            border-color: var(--brand-color);
            color: var(--brand-color);
        }

        /* Images */
        .article-image-box {
            margin: 24px 0;
            text-align: center;
        }

        .zoomable-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            cursor: zoom-in;
            transition: transform 0.2s;
        }

        .zoomable-img:hover {
            transform: scale(1.01);
        }

        .image-caption {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 8px;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            margin: 22px 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }

        .feishu-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            text-align: left;
        }

        .feishu-table th {
            background: var(--table-header-bg);
            color: var(--text-secondary);
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .feishu-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-primary);
        }

        .feishu-table tr:last-child td {
            border-bottom: none;
        }

        .feishu-table tr:hover td {
            background: var(--table-hover-bg);
        }

        /* Article Footer Pagination */
        .article-footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            gap: 16px;
        }

        .nav-btn-box {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            padding: 14px 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            transition: all 0.2s;
            max-width: 48%;
            flex: 1;
        }

        .nav-btn-box:hover {
            border-color: var(--brand-color);
            box-shadow: var(--shadow-sm);
        }

        .nav-btn-label {
            font-size: 11px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .nav-btn-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--brand-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Right Outline (TOC) */
        .app-outline {
            width: 240px;
            flex-shrink: 0;
            position: sticky;
            top: 56px;
            height: calc(100vh - 56px);
            overflow-y: auto;
            padding: 30px 16px;
            user-select: none;
        }

        .outline-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-left: 8px;
        }

        .outline-list {
            list-style: none;
        }

        .outline-item {
            margin-bottom: 2px;
        }

        .outline-link {
            display: block;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12.5px;
            color: var(--text-secondary);
            text-decoration: none;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s;
        }

        .outline-link:hover {
            color: var(--text-primary);
            background: var(--outline-hover);
        }

        .outline-link.active {
            color: var(--brand-color);
            font-weight: 600;

        const ARTICLES_DATA = [{"id":"overview","chapterId":"chap_overview","chapterTitle":"一、MPFlutter 2.0 简介","title":"MPFlutter 2.0 简介","icon":"🚅","date":"2025年1月26日","html":"<div class=\"callout-card callout-important\">\n    <div class=\"callout-content\">\n        <p>你正在阅读的是 MPFlutter 2.0 版本文档，1.0 已正式废弃，请勿阅读相关文档。</p>\n        <p>MPFlutter 已适配原生鸿蒙微信小程序，请移步『<a href=\"#version_info\" onclick=\"switchArticle('version_info')\">版本信息</a>』更新至最新版本，重新编译小程序上传。</p>\n    </div>\n</div>\n\n<h2 id=\"heading-overview-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-overview-1\" class=\"heading-anchor\">#</a>一、MPFlutter 2.0 简介</h2>\n\n<h3 id=\"heading-overview-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-overview-2\" class=\"heading-anchor\">#</a>什么是 MPFlutter</h3>\n<p class=\"feishu-p\">MPFlutter 是一款用于构建小程序的开发框架，基于 Flutter 构建，开发体验无限接近于 Flutter 原生应用。</p>\n<p class=\"feishu-p\">你可以基于 MPFlutter 开发以下平台的小程序、小游戏：</p>\n<ul class=\"feishu-ul\">\n    <li>微信小程序</li>\n    <li>微信小游戏</li>\n    <li>抖音小程序（WIP）</li>\n</ul>\n\n<h3 id=\"heading-overview-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-overview-3\" class=\"heading-anchor\">#</a>原生 Flutter 开发体验</h3>\n<p class=\"feishu-p\">MPFlutter 的目标是，在尽可能保留 Flutter 开发体验的同时，降低应用迁移到微信小程序的成本。</p>\n<p class=\"feishu-p\">我们已经实现以下能力：</p>\n<ul class=\"feishu-ul\">\n    <li><strong>无缝迁移</strong>\n        <ul style=\"margin-top:6px; margin-bottom:8px;\">\n            <li>无须裁剪 Flutter Framework，你可以使用 Material / Cupertino 这些官方组件搭建 UI。</li>\n            <li>自适应的构建脚本，构建小程序就像构建原生应用一般简单。</li>\n            <li>完整的分包支持，适应小程序分包大小限制，静态资源、代码都可以轻松分包。</li>\n        </ul>\n    </li>\n    <li><strong>实时预览能力</strong>\n        <ul style=\"margin-top:6px; margin-bottom:8px;\">\n            <li>快速预览，在 Desktop 上使用 Hot Reload / Hot Restart 快速预览界面及应用逻辑。</li>\n            <li>跨端联调，在 Desktop 预览的基础上，可连接到微信宿主，远程调用端上接口。</li>\n        </ul>\n    </li>\n    <li><strong>纯正的 Flutter</strong>\n        <ul style=\"margin-top:6px; margin-bottom:8px;\">\n            <li>支持 Flutter 3.13 以上版本，并且保证跟随官方升级而升级。</li>\n            <li>完全一致的 Flutter 插件体系，开发 MPFlutter 插件就像开发 Flutter 插件一样简单。</li>\n            <li>完全一致的 Pub 包管理系统，开发好的插件直接上传官方包管理平台即可使用。</li>\n        </ul>\n    </li>\n</ul>\n<p class=\"feishu-p\">总的来说，MPFlutter 就是尽可能地帮助你以低成本的方式构建微信小程序。</p>\n\n<h3 id=\"heading-overview-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-overview-4\" class=\"heading-anchor\">#</a>高性能的渲染体验</h3>\n<p class=\"feishu-p\">MPFlutter 2.0 使用 Skia + WebGL 渲染，对于 MPFlutter 1.0，性能提升是非常明显的。</p>\n<p class=\"feishu-p\">具体体验在以下场景：</p>\n<ul class=\"feishu-ul\">\n    <li><strong>频繁更新的界面</strong>\n        <ul style=\"margin-top:6px; margin-bottom:8px;\">\n            <li>不再通过 WXML &lt;-&gt; JS 双向传递数据，直接通过 JS 控制 WebGL 渲染，只要 Widget 层级合理，可以做到毫秒级驱动界面更新。</li>\n            <li>使用 WebGL 驱动渲染，可提升渲染缓存灵活性，你可以使用 RepaintBoundary 进一步提升界面帧率。</li>\n        </ul>\n    </li>\n    <li><strong>频繁的事件交互</strong>\n        <ul style=\"margin-top:6px; margin-bottom:8px;\">\n            <li>事件的接收不再单纯依赖宿主小程序的回传，MPFlutter 仅接收最基本的触摸、键盘事件，后续的事件分发全部交回 Flutter Framework 处理。</li>\n            <li>这意味着你可以在小程序中获取更多、更实时的事件。</li>\n        </ul>\n    </li>\n    <li><strong>小游戏方案</strong>\n        <ul style=\"margin-top:6px; margin-bottom:8px;\">\n            <li>得益于渲染性能的提升，MPFlutter 也提供在微信小程序（小游戏）中使用 Flame 开发游戏的可能。</li>\n        </ul>\n    </li>\n</ul>\n\n<h3 id=\"heading-overview-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-overview-5\" class=\"heading-anchor\">#</a>完整的 API 生态配套</h3>\n<p class=\"feishu-p\">在渲染能力以外，配套提供平台 API 封装，你不需要手动编写 Channel，MPFlutter 官方已为你完成对应封装，直接使用就可以。</p>\n\n<h3 id=\"heading-overview-6\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-overview-6\" class=\"heading-anchor\">#</a>下一步</h3>\n<p class=\"feishu-p\">从《<a href=\"#env_install\" onclick=\"switchArticle('env_install')\">环境安装与依赖配置</a>》开始体验 MPFlutter。</p>","headings":[{"id":"heading-overview-1","title":"一、MPFlutter 2.0 简介","level":2},{"id":"heading-overview-2","title":"什么是 MPFlutter","level":3},{"id":"heading-overview-3","title":"原生 Flutter 开发体验","level":3},{"id":"heading-overview-4","title":"高性能的渲染体验","level":3},{"id":"heading-overview-5","title":"完整的 API 生态配套","level":3},{"id":"heading-overview-6","title":"下一步","level":3}],"wordCount":1350,"readTime":4,"file":"01_MPFlutter 2.0_TayPw6pxKiZGdxkNe4bcmSnNnSg.html"},{"id":"getting_started","chapterId":"chap_getting_started","chapterTitle":"二、起步指南","title":"起步指南概述","icon":"🚀","date":"2024年3月12日","html":"\n<h2 id=\"heading-getting_started-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-getting_started-1\" class=\"heading-anchor\">#</a>二、起步指南</h2>\n\n\n","headings":[{"id":"heading-getting_started-1","title":"二、起步指南","level":2}],"wordCount":11,"readTime":1,"file":"02_起步指南_Wh0OwQF0oiUKrIkyLHrcgwMfn6d.html"},{"id":"env_install","chapterId":"chap_getting_started","chapterTitle":"二、起步指南","title":"环境安装与依赖配置","icon":"💻","date":"2024年3月10日","html":"<h2 id=\"heading-env_install-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-env_install-1\" class=\"heading-anchor\">#</a>2.1 环境安装与依赖配置</h2>\n<p class=\"feishu-p\">本指南不太适合完全零基础的 Flutter 开发者阅读。</p>\n<p class=\"feishu-p\">在正式体验 MPFlutter 前，强烈建议你先从基本的 Flutter 开始学习，先使用 Flutter 完成一个桌面应用或移动应用编写。</p>\n\n<h3 id=\"heading-env_install-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-2\" class=\"heading-anchor\">#</a>Flutter SDK</h3>\n<p class=\"feishu-p\">版本要求：&gt;= 3.13 &amp; &lt;= 3.16.7 或 &gt;= 3.22</p>\n<p class=\"feishu-p\">安装方法：<a href=\"https://flutter.cn/docs/get-started/install\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://flutter.cn/docs/get-started/install</a></p>\n\n<h3 id=\"heading-env_install-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-3\" class=\"heading-anchor\">#</a>操作系统</h3>\n<p class=\"feishu-p\">你可以使用 Windows / macOS / Linux 完成 MPFlutter 应用开发、调试。</p>\n<p class=\"feishu-p\">由于微信开发者工具未提供 Linux 版本，因此不建议你使用 Linux 作为主要开发机。</p>\n\n<h3 id=\"heading-env_install-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-4\" class=\"heading-anchor\">#</a>编辑工具</h3>\n<p class=\"feishu-p\">你可以使用 VSCode / Android Studio / IntelliJ IDEA 完成 MPFlutter 应用开发，需要在对应编辑器中安装 Flutter 插件。</p>\n<p class=\"feishu-p\">配置方法：<a href=\"https://flutter.cn/docs/get-started/editor\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://flutter.cn/docs/get-started/editor</a></p>\n\n<h3 id=\"heading-env_install-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-5\" class=\"heading-anchor\">#</a>微信开发者工具</h3>\n<p class=\"feishu-p\">我们需要使用「微信开发者工具」进行小程序预览、上传、发布操作。</p>\n<p class=\"feishu-p\">下载地址：<a href=\"https://developers.weixin.qq.com/miniprogram/dev/devtools/stable.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://developers.weixin.qq.com/miniprogram/dev/devtools/stable.html</a></p>\n<p class=\"feishu-p\">强烈建议你在下载完成工具以后，体验一下基本的小程序开发知识，特别是预览、上传的操作，具体方法请阅读微信官方文档。</p>\n\n<h3 id=\"heading-env_install-6\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-6\" class=\"heading-anchor\">#</a>Brotli</h3>\n<p class=\"feishu-p\">Brotli 是一种用于数据压缩的开源算法，它能够提供高效的压缩比和快速的解压缩速度。Brotli 算法由 Google 开发，最初用于其 Chrome 浏览器中的数据压缩，后来成为了开放的标准。</p>\n<p class=\"feishu-p\">MPFlutter 使用 Brotli 压缩资源文件，你必须在电脑上安装 brotli 命令行程序，并添加它到 PATH 中。</p>\n\n<p class=\"feishu-p\">下面是在各个平台上安装 Brotli 的方法：</p>\n<ul class=\"feishu-ul\">\n    <li><strong>macOS</strong>：\n        <div class=\"feishu-code-block\" style=\"margin:8px 0;\">\n            <div class=\"code-block-bar\"><span class=\"code-badge\">bash</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">复制</button></div>\n            <pre><code class=\"language-bash\">brew install brotli</code></pre>\n        </div>\n    </li>\n    <li><strong>Ubuntu / Debian</strong>：\n        <div class=\"feishu-code-block\" style=\"margin:8px 0;\">\n            <div class=\"code-block-bar\"><span class=\"code-badge\">bash</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">复制</button></div>\n            <pre><code class=\"language-bash\">sudo apt-get install brotli</code></pre>\n        </div>\n    </li>\n    <li><strong>Windows</strong>：\n        <ul style=\"margin:6px 0 6px 18px;\">\n            <li>方法一：推荐使用包管理器安装：<code class=\"inline-code\">winget install Google.Brotli</code> 或 <code class=\"inline-code\">vcpkg install brotli</code> 或 <code class=\"inline-code\">choco install brotli</code></li>\n            <li>方法二：从 <a href=\"https://github.com/google/brotli/releases\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Google Brotli 官方 GitHub Releases</a> 下载对应 zip，解压并把 <code class=\"inline-code\">brotli.exe</code> 路径加入系统环境变量 <code class=\"inline-code\">PATH</code>。</li>\n        </ul>\n    </li>\n</ul>\n\n<p class=\"feishu-p\"><strong>验证安装</strong>：在终端中运行以下命令，若正常输出版本号即安装成功：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\"><span class=\"code-badge\">bash</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">复制</button></div>\n    <pre><code class=\"language-bash\">brotli --version</code></pre>\n</div>\n\n<h3 id=\"heading-env_install-7\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-7\" class=\"heading-anchor\">#</a>下一步</h3>\n<p class=\"feishu-p\">尝试参考《<a href=\"#first_app\" onclick=\"switchArticle('first_app')\">编写第一个 MPFlutter 微信小程序</a>》运行一个 Hello, World！</p>","headings":[{"id":"heading-env_install-1","title":"2.1 环境安装与依赖配置","level":2},{"id":"heading-env_install-2","title":"Flutter SDK","level":3},{"id":"heading-env_install-3","title":"操作系统","level":3},{"id":"heading-env_install-4","title":"编辑工具","level":3},{"id":"heading-env_install-5","title":"微信开发者工具","level":3},{"id":"heading-env_install-6","title":"Brotli","level":3},{"id":"heading-env_install-7","title":"下一步","level":3}],"wordCount":1850,"readTime":5,"file":"03_环境安装_HsMzwcGKNioPlAkh9pPc8NfznIf.html"},{"id":"first_app","chapterId":"chap_getting_started","chapterTitle":"二、起步指南","title":"编写第一个 MPFlutter 微信小程序","icon":"📱","date":"2024年3月10日","html":"<h2 id=\"heading-first_app-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-first_app-1\" class=\"heading-anchor\">#</a>2.2 编写第一个 MPFlutter 微信小程序</h2>\n\n<h3 id=\"heading-first_app-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_app-2\" class=\"heading-anchor\">#</a>从模板工程开始</h3>\n<p class=\"feishu-p\">直接下载以下任意一个 awesome_project 并解压：</p>\n\n<div class=\"feishu-file-card\">\n    <div class=\"file-card-left\">\n        <div class=\"file-card-icon-wrap\">\n            <svg class=\"file-zip-svg\" width=\"36\" height=\"36\" viewBox=\"0 0 32 32\" fill=\"none\">\n                <path d=\"M1.5 0h14.086a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V26.5a1.5 1.5 0 01-1.5 1.5h-19A1.5 1.5 0 010 26.5v-25A1.5 1.5 0 011.5 0z\" fill=\"#3370FF\"/>\n                <path d=\"M16.293.293l5.414 5.414A1 1 0 0121.91 6H17.5A1.5 1.5 0 0116 4.5V.09a1 1 0 01.293.203z\" fill=\"#245BDB\"/>\n                <rect x=\"7\" y=\"11\" width=\"18\" height=\"14\" rx=\"2\" fill=\"#FFFFFF\" fill-opacity=\"0.2\"/>\n                <text x=\"8\" y=\"21\" fill=\"#FFFFFF\" font-size=\"8\" font-weight=\"bold\" font-family=\"monospace\">ZIP</text>\n            </svg>\n        </div>\n        <div class=\"file-card-info\">\n            <div class=\"file-card-title\">awesome_project_275.zip</div>\n            <div class=\"file-card-subtitle\">Skia Font 版本，起始包体积 5 M，内置常用中文字体支持 • <span class=\"file-size-badge\">2.2 MB</span> • 100% 离线可用</div>\n        </div>\n    </div>\n    <div class=\"file-card-actions\">\n        <a href=\"./awesome_project_275.zip\" download class=\"btn-card btn-card-download\" title=\"下载本地 ZIP 包\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"/></svg>\n            下载 ZIP\n        </a>\n    </div>\n</div>\n\n<div class=\"feishu-file-card\">\n    <div class=\"file-card-left\">\n        <div class=\"file-card-icon-wrap\">\n            <svg class=\"file-zip-svg\" width=\"36\" height=\"36\" viewBox=\"0 0 32 32\" fill=\"none\">\n                <path d=\"M1.5 0h14.086a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V26.5a1.5 1.5 0 01-1.5 1.5h-19A1.5 1.5 0 010 26.5v-25A1.5 1.5 0 011.5 0z\" fill=\"#3370FF\"/>\n                <path d=\"M16.293.293l5.414 5.414A1 1 0 0121.91 6H17.5A1.5 1.5 0 0116 4.5V.09a1 1 0 01.293.203z\" fill=\"#245BDB\"/>\n                <rect x=\"7\" y=\"11\" width=\"18\" height=\"14\" rx=\"2\" fill=\"#FFFFFF\" fill-opacity=\"0.2\"/>\n                <text x=\"8\" y=\"21\" fill=\"#FFFFFF\" font-size=\"8\" font-weight=\"bold\" font-family=\"monospace\">ZIP</text>\n            </svg>\n        </div>\n        <div class=\"file-card-info\">\n            <div class=\"file-card-title\">awesome_project_minitex_275.zip</div>\n            <div class=\"file-card-subtitle\">MiniTex 版本，起始包体积仅 1.5 M，免字体网络加载 • <span class=\"file-size-badge\">2.2 MB</span> • 100% 离线可用</div>\n        </div>\n    </div>\n    <div class=\"file-card-actions\">\n        <a href=\"./awesome_project_minitex_275.zip\" download class=\"btn-card btn-card-download\" title=\"下载本地 ZIP 包\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"/></svg>\n            下载 ZIP\n        </a>\n    </div>\n</div>\n\n<p class=\"feishu-p\">解压后，可见这是一个标准的 Flutter 工程。</p>\n<p class=\"feishu-p\">这个工程存在以下文件，是 MPFlutter 专有的：</p>\n\n<table class=\"feishu-table\">\n    <thead>\n        <tr><th>目录</th><th>类型</th><th>说明</th></tr>\n    </thead>\n    <tbody>\n        <tr>\n            <td><strong>fonts</strong></td>\n            <td>文件夹</td>\n            <td>存放内置于小程序包的字体文件</td>\n        </tr>\n        <tr>\n            <td><strong>wechat</strong></td>\n            <td>文件夹</td>\n            <td>\n                存放微信小程序工程文件\n                <ul style=\"margin:4px 0 0 18px; padding:0;\">\n                    <li>可修改 wechat/project.config.json 中的工程配置</li>\n                    <li>可添加额外的小程序逻辑、资源到该工程</li>\n                </ul>\n            </td>\n        </tr>\n        <tr>\n            <td><strong>scripts</strong></td>\n            <td>文件夹</td>\n            <td>存放构建脚本</td>\n        </tr>\n    </tbody>\n</table>\n\n<p class=\"feishu-p\">另外，<code class=\"inline-code\">lib/main.dart</code> 也和普通的 Flutter 工程不一样，具体是：</p>\n<ul class=\"feishu-ul\">\n    <li><code class=\"inline-code\">runApp</code> 换成 <code class=\"inline-code\">runMPApp</code></li>\n    <li><code class=\"inline-code\">navigatorObservers</code> 必须包含 <code class=\"inline-code\">MPNavigatorObserver</code></li>\n</ul>\n<p class=\"feishu-p\">除此以外，Flutter 所允许编写的任何代码、依赖库都可以在 MPFlutter 中使用。</p>\n\n<h3 id=\"heading-first_app-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_app-3\" class=\"heading-anchor\">#</a>Flutter SDK 版本支持情况</h3>\n<p class=\"feishu-p\">Flutter SDK &gt;3.16.7 and &lt;3.22.0 以及 &gt; 3.29 是不被支持的。</p>\n<p class=\"feishu-p\">当你使用 3.22+ SDK 时，请确保 pubspec.yaml 中的 environment.sdk 设置正确：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\">environment:\n  sdk: \"&gt;=3.4.0 &lt;4.0.0\"</code></pre>\n</div>\n\n<p class=\"feishu-p\">当你使用 3.16.7- SDK，也需要确保该值如下方所示：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\">environment:\n  sdk: \"&gt;=3.2.0 &lt;4.0.0\"</code></pre>\n</div>\n<p class=\"feishu-p\">不正确的设置会导致构建失败。</p>\n\n<h3 id=\"heading-first_app-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_app-4\" class=\"heading-anchor\">#</a>FVM</h3>\n<p class=\"feishu-p\">从 2.6.0 版本开始，MPFlutter 支持使用 fvm 构建，请在解压后的工程目录下使用 fvm use 命令完成初始化。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">bash</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-bash\">fvm use 3.16.7</code></pre>\n</div>\n<p class=\"feishu-p\">其它用法请参考 fvm 文档。如果遇到 cli.waitFor 错误，使用以下命令构建应用：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">bash</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-bash\">fvm dart scripts/build_wechat.dart</code></pre>\n</div>\n\n<h3 id=\"heading-first_app-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_app-5\" class=\"heading-anchor\">#</a>构建应用</h3>\n<p class=\"feishu-p\">在命令行下，执行以下命令构建微信小程序：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">bash</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-bash\">flutter packages upgrade # 首次安装依赖，建议使用该命令。\nflutter packages get\ndart scripts/build_wechat.dart</code></pre>\n</div>\n<p class=\"feishu-p\">如果没有错误发生，那么在 <code class=\"inline-code\">build/wechat</code> 目录下就是最终产物。</p>\n<div class=\"callout-card callout-tip\">\n    <div class=\"callout-content\">\n        <p><strong>注意</strong>：所有的 <code class=\"inline-code\">[INFO]</code> 日志都不代表错误，如无任何异常，请直接忽略。</p>\n    </div>\n</div>\n\n<h3 id=\"heading-first_app-6\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_app-6\" class=\"heading-anchor\">#</a>导入到微信开发者工具使用</h3>\n<ol class=\"feishu-ol\">\n    <li>打开【微信开发者工具】；</li>\n    <li>在工程选择页面，选择【导入】；</li>\n    <li>选择刚刚构建出来的 <code class=\"inline-code\" style=\"color:#d93025;font-weight:600;background:rgba(217,48,37,0.08);padding:2px 6px;border-radius:4px;\">build/wechat</code> <strong>&lt;-- 划重点，是 build 目录下的 wechat</strong>；</li>\n    <li>将 appId 换成你自己的测试 appId；</li>\n    <li>然后就可以在微信开发者工具预览 MPFlutter 应用啦；</li>\n    <li>同样的，你可以使用【扫码预览】功能，在 iPhone 或者 Android 手机上体验应用。</li>\n</ol>\n\n<div class=\"article-image-box\">\n    <img src=\"./images/wechat_preview_btn.png\" alt=\"微信开发者工具顶部工具栏【预览】按钮\" class=\"zoomable-img\" onclick=\"openLightbox('./images/wechat_preview_btn.png', '微信开发者工具顶部工具栏【预览】按钮')\" />\n    <div class=\"image-caption\">微信开发者工具顶部工具栏【预览】按钮位置（展示顶部工具栏区域）</div>\n</div>\n\n<div class=\"callout-card callout-warning\">\n    <div class=\"callout-content\">\n        <p><strong>⚠️ 注意</strong>：请不要使用【真机调试】功能，使用【扫码预览】。</p>\n    </div>\n</div>\n\n<div class=\"callout-card callout-tip\">\n    <div class=\"callout-content\">\n        <p>💡 <strong>提示</strong>：如果小程序运行白屏，请检查《<a href=\"#env_install\" onclick=\"switchArticle('env_install')\">环境安装与依赖配置</a>》中的每一项是否均已正常安装。</p>\n        <p>💡 <strong>提示</strong>：Nightly 版本可能已有遇到问题的修复方案，请关注《<a href=\"#version_info\" onclick=\"switchArticle('version_info')\">版本信息与更新日志</a>》。</p>\n    </div>\n</div>\n\n<h3 id=\"heading-first_app-7\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_app-7\" class=\"heading-anchor\">#</a>下一步</h3>\n<p class=\"feishu-p\">你可以通过《<a href=\"#learn_more\" onclick=\"switchArticle('learn_more')\">了解更多：核心底层架构原理</a>》文档理解 MPFlutter 的原理。</p>","headings":[{"id":"heading-first_app-1","title":"2.2 编写第一个 MPFlutter 微信小程序","level":2},{"id":"heading-first_app-2","title":"从模板工程开始","level":3},{"id":"heading-first_app-3","title":"Flutter SDK 版本支持情况","level":3},{"id":"heading-first_app-4","title":"FVM","level":3},{"id":"heading-first_app-5","title":"构建应用","level":3},{"id":"heading-first_app-6","title":"导入到微信开发者工具使用","level":3},{"id":"heading-first_app-7","title":"下一步","level":3}],"wordCount":3100,"readTime":9,"file":"04_编写第一个 MPFlutter 微信小程序_I45wwTI9XiH0AXkvQUEc2jZ8nFP.html"},{"id":"first_game","chapterId":"chap_getting_started","chapterTitle":"二、起步指南","title":"编写第一个 MPFlutter 微信小游戏","icon":"🎮","date":"2024年4月21日","html":"<div class=\"callout-card callout-warning\">\n    <div class=\"callout-content\">\n        <p>收到反馈：Flutter 3.16.8 存在白屏及包体积增大问题，请使用 3.16.7 以下版本。</p>\n    </div>\n</div>\n\n<h2 id=\"heading-first_game-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-first_game-1\" class=\"heading-anchor\">#</a>2.3 编写第一个 MPFlutter 微信小游戏</h2>\n\n<h3 id=\"heading-first_game-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_game-2\" class=\"heading-anchor\">#</a>从模板工程开始</h3>\n<p class=\"feishu-p\">直接下载以下 awesome_game_template 并解压：</p>\n<p class=\"feishu-p\">解压后，可见这是一个标准的 Flutter 游戏工程，使用 Flame 框架开发。</p>\n<p class=\"feishu-p\">这个工程存在以下文件，是 MPFlutter 专有的：</p>\n\n<table class=\"feishu-table\">\n    <thead>\n        <tr><th>目录</th><th>类型</th><th>说明</th></tr>\n    </thead>\n    <tbody>\n        <tr>\n            <td><strong>fonts</strong></td>\n            <td>文件夹</td>\n            <td>存放内置于小游戏包的字体文件</td>\n        </tr>\n        <tr>\n            <td><strong>wegame</strong></td>\n            <td>文件夹</td>\n            <td>\n                存放微信小游戏工程文件\n                <ul style=\"margin:4px 0 0 18px; padding:0;\">\n                    <li><a href=\"https://developers.weixin.qq.com/minigame/dev/reference/configuration/app.html\" target=\"_blank\" rel=\"noopener\">可修改 wegame/game.json 中的游戏配置</a></li>\n                    <li>可修改 wegame/project.config.json 中的工程配置</li>\n                    <li>可添加额外的小游戏逻辑、资源到该工程</li>\n                </ul>\n            </td>\n        </tr>\n        <tr>\n            <td><strong>scripts</strong></td>\n            <td>文件夹</td>\n            <td>存放构建脚本</td>\n        </tr>\n    </tbody>\n</table>\n\n<p class=\"feishu-p\">另外，<code class=\"inline-code\">lib/main.dart</code> 也和普通的 Flutter 工程不一样，具体是：</p>\n<ul class=\"feishu-ul\">\n    <li><code class=\"inline-code\">runApp</code> 换成 <code class=\"inline-code\">runMPApp</code></li>\n</ul>\n<p class=\"feishu-p\">除此以外，Flutter 所允许编写的任何代码、依赖库都可以在 MPFlutter 中使用。</p>\n\n<h3 id=\"heading-first_game-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_game-3\" class=\"heading-anchor\">#</a>Flutter SDK 版本支持情况</h3>\n<p class=\"feishu-p\">Flutter SDK &gt;3.16.7 and &lt;3.22.0 以及 &gt; 3.27 是不被支持的。</p>\n<p class=\"feishu-p\">当你使用 3.22+ SDK 时，请确保 pubspec.yaml 中的 environment.sdk 设置正确：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\">environment:\n  sdk: \"&gt;=3.4.0 &lt;4.0.0\"</code></pre>\n</div>\n\n<p class=\"feishu-p\">当你使用 3.16.7- SDK，也需要确保该值如下方所示：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\">environment:\n  sdk: \"&gt;=3.2.0 &lt;4.0.0\"</code></pre>\n</div>\n<p class=\"feishu-p\">不正确的设置会导致构建失败。</p>\n\n<h3 id=\"heading-first_game-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_game-4\" class=\"heading-anchor\">#</a>构建应用</h3>\n<p class=\"feishu-p\">在命令行下，执行以下命令构建微信小游戏：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">bash</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-bash\">flutter packages upgrade # 首次安装依赖，建议使用该命令。\nflutter packages get\ndart scripts/build_wegame.dart</code></pre>\n</div>\n<p class=\"feishu-p\">如果没有错误发生，那么在 <code class=\"inline-code\">build/wegame</code> 目录下就是最终产物。</p>\n<div class=\"callout-card callout-tip\">\n    <div class=\"callout-content\">\n        <p><strong>注意</strong>：所有的 <code class=\"inline-code\">[INFO]</code> 日志都不代表错误，如无任何异常，请直接忽略。</p>\n    </div>\n</div>\n\n<h3 id=\"heading-first_game-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_game-5\" class=\"heading-anchor\">#</a>导入到微信开发者工具使用</h3>\n<ol class=\"feishu-ol\">\n    <li>打开【微信开发者工具】&gt; 【小游戏】；</li>\n    <li>在工程选择页面，选择【导入】；</li>\n    <li>选择刚刚构建出来的 <code class=\"inline-code\" style=\"color:#d93025;font-weight:600;background:rgba(217,48,37,0.08);padding:2px 6px;border-radius:4px;\">build/wegame</code> <strong>&lt;-- 划重点，是 build 目录下的 wegame</strong>；</li>\n    <li>将 appId 换成你自己的测试 appId；</li>\n    <li>然后就可以在微信开发者工具预览 MPFlutter 小游戏啦；</li>\n    <li>同样的，你可以使用【扫码预览】功能，在 iPhone 或者 Android 手机上体验小游戏。</li>\n</ol>\n\n<div class=\"article-image-box\">\n    <img src=\"./images/wechat_preview_btn.png\" alt=\"微信开发者工具顶部工具栏【预览】按钮\" class=\"zoomable-img\" onclick=\"openLightbox('./images/wechat_preview_btn.png', '微信开发者工具顶部工具栏【预览】按钮')\" />\n    <div class=\"image-caption\">微信开发者工具顶部工具栏【预览】按钮位置</div>\n</div>\n\n<div class=\"callout-card callout-warning\">\n    <div class=\"callout-content\">\n        <p><strong>⚠️ 注意</strong>：请不要使用【真机调试】功能，使用【扫码预览】。</p>\n    </div>\n</div>\n\n<div class=\"callout-card callout-tip\">\n    <div class=\"callout-content\">\n        <p>💡 <strong>提示</strong>：如果小游戏运行白屏，请检查《<a href=\"#env_install\" onclick=\"switchArticle('env_install')\">环境安装与依赖配置</a>》中的每一项是否均已正常安装。</p>\n        <p>💡 <strong>提示</strong>：Nightly 版本可能已有遇到问题的修复方案，请关注《<a href=\"#version_info\" onclick=\"switchArticle('version_info')\">版本信息与更新日志</a>》。</p>\n    </div>\n</div>\n\n<h3 id=\"heading-first_game-6\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_game-6\" class=\"heading-anchor\">#</a>下一步</h3>\n<p class=\"feishu-p\">你可以通过《<a href=\"#learn_more\" onclick=\"switchArticle('learn_more')\">了解更多：核心底层架构原理</a>》文档理解 MPFlutter 的原理。</p>","headings":[{"id":"heading-first_game-1","title":"2.3 编写第一个 MPFlutter 微信小游戏","level":2},{"id":"heading-first_game-2","title":"从模板工程开始","level":3},{"id":"heading-first_game-3","title":"Flutter SDK 版本支持情况","level":3},{"id":"heading-first_game-4","title":"构建应用","level":3},{"id":"heading-first_game-5","title":"导入到微信开发者工具使用","level":3},{"id":"heading-first_game-6","title":"下一步","level":3}],"wordCount":1550,"readTime":5,"file":"05_编写第一个 MPFlutter 微信小游戏_EbsBwMhzmiVNSXk0dlJcjtxSnwh.html"},{"id":"learn_more","chapterId":"chap_getting_started","chapterTitle":"二、起步指南","title":"了解更多：核心底层架构原理","icon":"💡","date":"2024年3月10日","html":"<h2 id=\"heading-learn_more-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-learn_more-1\" class=\"heading-anchor\">#</a>2.4 深入了解：核心底层架构原理</h2>\n<h3 id=\"heading-learn_more-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-learn_more-2\" class=\"heading-anchor\">#</a>原理</h3>\n<p class=\"feishu-p\">为什么 MPFlutter 可以运行在微信小程序上？MPFlutter 在背后做了什么工作？</p>\n<p class=\"feishu-p\"><strong>在回答这个问题前，我们先看看 Flutter 官方是如何在 Web 上运行 Flutter 应用的：</strong></p>\n<div class=\"article-image-box\">\n    <img src=\"./images/architecture_flutter_wechat.jpg\" alt=\"MPFlutter 运行原理与架构图\" class=\"zoomable-img\" onclick=\"openLightbox('./images/architecture_flutter_wechat.jpg', 'MPFlutter 运行原理与架构图')\" />\n    <div class=\"image-caption\">MPFlutter 运行原理与架构图</div>\n</div>\n<p class=\"feishu-p\">这里有几个要点：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">Dart 代码是无法直接运行在浏览器的，必须编译成 JavaScript，Dart 提供了 dart2js 编译器。</li>\n    <li class=\"feishu-li\">浏览器是没有 Skia API 提供的，因此需要找到合适的 Renderer 用于最终渲染，存在两种 Renderer。</li>\n    <li class=\"feishu-li\">HTML Renderer，它直接将 RenderTree 翻译成普通的 DOM 对象，添加到 body 上，由浏览器自行合成界面。</li>\n    <li class=\"feishu-li\">CanvasKit Renderer，它借助 WebAssembly 技术，使得 Skia 可以运行在浏览器上，并结合 WebGL 渲染界面。</li>\n</ul>\n<p class=\"feishu-p\">不同的渲染方案各有优点：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">HTML Renderer 兼容性更好，也不需要关注字体加载问题，但是在移动端性能表现堪忧。</li>\n    <li class=\"feishu-li\">CanvasKit Renderer 性能最优，兼容性在现阶段已不是问题，但需要关注字体加载、包体积等问题。</li>\n</ul>\n<p class=\"feishu-p\">从 Flutter 的渲染一致性角度来看，CanvasKit Renderer 是更贴近 Flutter 的理念的。</p>\n<p class=\"feishu-p\"><strong>MPFlutter 2.0 选择了 CanvasKit Renderer 方案：</strong></p>\n<p class=\"feishu-p\">MPFlutter 2.0 完全复用 Flutter For Web 的基建，我们提供了以下适配策略：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">裁剪并编译一个符合微信小程序包大小要求的 Skia WebAssembly 库；</li>\n    <li class=\"feishu-li\">适当地调整 Skia CanvasKit 加载脚本，使它能运行在微信小程序上；</li>\n    <li class=\"feishu-li\">添加智能分包策略，使 main.dart.js 以及资源文件可以在构建阶段智能地分配到不同分包中；</li>\n    <li class=\"feishu-li\">在微信小程序中，补全 Flutter For Web 所需要的 Web API；</li>\n    <li class=\"feishu-li\">在微信小程序中，补充必要的触摸、键盘事件回传。</li>\n</ul>\n<h3 id=\"heading-learn_more-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-learn_more-3\" class=\"heading-anchor\">#</a>方案优点</h3>\n<p class=\"feishu-p\">MPFlutter 在帧率表现上优于传统的小程序开发模式。</p>\n<p class=\"feishu-p\">传统的小程序开发模式其数据交换可见下图：</p>\n<div class=\"article-image-box\">\n    <img src=\"./images/traditional_miniprogram_data_flow.jpg\" alt=\"传统微信小程序开发模式数据交换流程\" class=\"zoomable-img\" onclick=\"openLightbox('./images/traditional_miniprogram_data_flow.jpg', '传统微信小程序开发模式数据交换流程')\" />\n    <div class=\"image-caption\">传统微信小程序开发模式数据交换流程</div>\n</div>\n<p class=\"feishu-p\">MPFlutter 数据交换可见下图：</p>\n<div class=\"article-image-box\">\n    <img src=\"./images/mpflutter_data_flow.jpg\" alt=\"MPFlutter 方案数据交换流程（单次获取 WebGL 上下文，后续更新闭环在 JS Context）\" class=\"zoomable-img\" onclick=\"openLightbox('./images/mpflutter_data_flow.jpg', 'MPFlutter 方案数据交换流程（单次获取 WebGL 上下文，后续更新闭环在 JS Context）')\" />\n    <div class=\"image-caption\">MPFlutter 方案数据交换流程（单次获取 WebGL 上下文，后续更新闭环在 JS Context）</div>\n</div>\n<p class=\"feishu-p\">可见 MPFlutter 方案仅在页面创建时，使用 WXML 一性次地获取 WebGL 上下文，后续的界面更新都闭环在 JS Context 中。</p>\n<p class=\"feishu-p\">而传统方案则需要不断使用 setData 传输数据至 WebView 层，通过 DOM 刷新的方式更新界面。</p>\n<p class=\"feishu-p\">在强交互、需要持续使用 Data 刷新界面的场景下，MPFlutter 的表现明显是更优秀的。</p>\n<h3 id=\"heading-learn_more-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-learn_more-4\" class=\"heading-anchor\">#</a>方案缺点</h3>\n<p class=\"feishu-p\">当然，MPFlutter 也存在以下缺点：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">包体积大，相比传统方案，MPFlutter 的初始包体积是 5M。</li>\n    <li class=\"feishu-li\">Skia 2M</li>\n    <li class=\"feishu-li\">main.dart.js 1.8M</li>\n    <li class=\"feishu-li\">内置字体 1.2M</li>\n    <li class=\"feishu-li\">运行内存占用更高</li>\n    <li class=\"feishu-li\">WebAssembly 的初始化需要提前申请更多内存</li>\n    <li class=\"feishu-li\">Skia 对于图片编解码也需要额外申请内存</li>\n    <li class=\"feishu-li\">字体需要另行加载（原因： 《<a href=\"#fonts\" onclick=\"switchArticle('fonts')\">字体使用</a>》 ）</li>\n    <li class=\"feishu-li\">微信小程序提供的视图组件需要使用 Platform View 方式实现</li>\n</ul>\n<h3 id=\"heading-learn_more-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-learn_more-5\" class=\"heading-anchor\">#</a>小结</h3>\n<p class=\"feishu-p\">MPFlutter 2.0 方案是一种全新的开发模式，它大大的提高了微信小程序的性能上限，并使得 Flutter 技术可无缝迁移到微信小程序。</p>\n","headings":[{"id":"heading-learn_more-1","title":"2.4 深入了解：核心底层架构原理","level":2},{"id":"heading-learn_more-2","title":"原理","level":3},{"id":"heading-learn_more-3","title":"方案优点","level":3},{"id":"heading-learn_more-4","title":"方案缺点","level":3},{"id":"heading-learn_more-5","title":"小结","level":3}],"wordCount":163,"readTime":5,"file":"06_了解更多_HlZYwSKQMiQyGlknBlicxI99nkd.html"},{"id":"build_guide","chapterId":"chap_build_guide","chapterTitle":"三、构建指南","title":"构建指南概述","icon":"🛠️","date":"2024年3月10日","html":"\n<h2 id=\"heading-build_guide-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-build_guide-1\" class=\"heading-anchor\">#</a>三、构建指南</h2>\n\n\n","headings":[{"id":"heading-build_guide-1","title":"三、构建指南","level":2}],"wordCount":11,"readTime":1,"file":"07_构建指南_Ux6QwUyceioRcNkZxI0cgaQhnKf.html"},{"id":"dart2js","chapterId":"chap_build_guide","chapterTitle":"三、构建指南","title":"Dart2JS 的构建","icon":"⚡","date":"2024年3月10日","html":"<h2 id=\"heading-dart2js-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-dart2js-1\" class=\"heading-anchor\">#</a>3.1 Dart2JS 构建深入</h2>\n<h3 id=\"heading-dart2js-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-dart2js-2\" class=\"heading-anchor\">#</a>运行原理</h3>\n<p class=\"feishu-p\">Flutter 程序之所以可以运行在微信小程序上，是因为 Dart 官方提供了 dart2js 编译器，它可以在 JavaScript 中完整地模拟出 DartVM。</p>\n<p class=\"feishu-p\">MPFlutter 同样也是借助 flutter build web 命令构建最终 JS 产物。</p>\n<h3 id=\"heading-dart2js-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-dart2js-3\" class=\"heading-anchor\">#</a>构建方法</h3>\n<h3 id=\"heading-dart2js-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-dart2js-4\" class=\"heading-anchor\">#</a>常规构建</h3>\n<p class=\"feishu-p\">常规构建适用于预览、上传、发布，使用以下命令执行常规构建：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">bash</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-bash\">dart scripts/build_wechat.dart</code></pre>\n</div>\n<p class=\"feishu-p\">常规构建会按照以下步骤执行：</p>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">使用 flutter build web 构建 web 产物</li>\n    <li class=\"feishu-li\">复制工程根目录下的 wechat 到 build/wechat 目录下</li>\n    <li class=\"feishu-li\">使用 mpflutter_build_tools 工具复制 web 产物到 build/wechat 目录下</li>\n    <li class=\"feishu-li\">微调 wechat 下的 JavaScript 以保证可以在小程序环境下执行</li>\n    <li class=\"feishu-li\">添加分包信息</li>\n</ol>\n<h3 id=\"heading-dart2js-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-dart2js-5\" class=\"heading-anchor\">#</a>调试构建</h3>\n<p class=\"feishu-p\">调试构建适用于在微信开发者工具中查找运行时问题，使用以下命令构建：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">bash</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-bash\">dart scripts/build_wechat.dart --debug</code></pre>\n</div>\n<p class=\"feishu-p\">通过该模式构建的产物，可以在微信开发者工具 &gt; 调试 &gt; Source 选项卡中看到 dart 源码，并基于 dart 源码进行断点调试。</p>\n<p class=\"feishu-p\">该模式打包的产物，会超出小程序包大小限制，不能在真机调试和预览。</p>\n<h3 id=\"heading-dart2js-6\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-dart2js-6\" class=\"heading-anchor\">#</a>性能数据构建</h3>\n<blockquote class=\"feishu-blockquote\">\n<p class=\"feishu-p\">目前这种方式还未完善，暂时不要使用。</p>\n<p class=\"feishu-p\">调试构建适用于在预览场景下获取性能数据，它将附带性能信息窗口在应用界面，使用以下命令构建：</p>\n</blockquote>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">bash</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-bash\">dart scripts/build_wechat.dart --debug</code></pre>\n</div>\n<h3 id=\"heading-dart2js-7\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-dart2js-7\" class=\"heading-anchor\">#</a>环境判断</h3>\n<p class=\"feishu-p\">由于 MPFlutter 也使用 flutter build web 构建应用，Platform 以及 kIsWeb 是无法判断当前是否为 MPFlutter 应用的。</p>\n<p class=\"feishu-p\">你可以使用 <code class=\"inline-code\">kIsMPFlutter</code> 可以判断当前是否为 MPFlutter 应用。</p>\n","headings":[{"id":"heading-dart2js-1","title":"3.1 Dart2JS 构建深入","level":2},{"id":"heading-dart2js-2","title":"运行原理","level":3},{"id":"heading-dart2js-3","title":"构建方法","level":3},{"id":"heading-dart2js-4","title":"常规构建","level":3},{"id":"heading-dart2js-5","title":"调试构建","level":3},{"id":"heading-dart2js-6","title":"性能数据构建","level":3},{"id":"heading-dart2js-7","title":"环境判断","level":3}],"wordCount":105,"readTime":4,"file":"构建指南_Dart2JS 的构建_Uv0pwdknKixEJIk6ykccbeFEn2c.html"},{"id":"resources","chapterId":"chap_build_guide","chapterTitle":"三、构建指南","title":"资源文件的构建和使用","icon":"📦","date":"2024年3月10日","html":"\n<h2 id=\"heading-resources-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-resources-1\" class=\"heading-anchor\">#</a>3.2 资源文件的构建和使用</h2>\n\n\n<p class=\"feishu-p\">Flutter 应用程序包含代码和 assets（也为资源），资源是被打包到小程序安装包中的。</p>\n\n\n<p class=\"feishu-p\">由于微信小程序包整体大小限制在 20M 内，建议你尽可能通过 HTTP 加载资源使用。</p>\n\n\n\n<h3 id=\"heading-resources-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-resources-2\" class=\"heading-anchor\">#</a>支持文件类型</h3>\n\n\n<p class=\"feishu-p\">在 MPFlutter 中，你可以使用以下类型的资源文件：</p>\n\n\n\n<h5 id=\"heading-resources-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-resources-3\" class=\"heading-anchor\">#</a>静态数据：</h5>\n\n\n<p class=\"feishu-p\">JSON / Text / 二进制数据文件</p>\n\n\n\n<h5 id=\"heading-resources-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-resources-3\" class=\"heading-anchor\">#</a>图片：</h5>\n\n<ul class=\"feishu-ul\">\n<li>JPEG / PNG</li>\n<li>SVG （需要添加 flutter_svg 依赖库）</li>\n<li>不支持 WebP / GIF / BMP</li>\n</ul>\n\n\n<h5 id=\"heading-resources-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-resources-3\" class=\"heading-anchor\">#</a>字体：</h5>\n\n<ul class=\"feishu-ul\">\n<li>TTF</li>\n</ul>\n\n\n<h3 id=\"heading-resources-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-resources-3\" class=\"heading-anchor\">#</a>资源引入和使用</h3>\n\n\n<p class=\"feishu-p\">直接参数 Flutter 官方文档在 pubspec.yaml 指定，使用 rootBundle 或者 AssetImage 加载就可以。</p>\n\n\n<p class=\"feishu-p\"><a href=\"https://flutter.cn/docs/ui/assets/assets-and-images\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://flutter.cn/docs/ui/assets/assets-and-images</a></p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n","headings":[{"id":"heading-resources-1","title":"3.2 资源文件的构建和使用","level":2},{"id":"heading-resources-2","title":"支持文件类型","level":3},{"id":"heading-resources-3","title":"资源引入和使用","level":3}],"wordCount":416,"readTime":1,"file":"构建指南_资源文件的构建和使用_X88PwdjiBiAnTPkhdbZcCSS1n4e.html"},{"id":"fonts","chapterId":"chap_build_guide","chapterTitle":"三、构建指南","title":"字体使用与优化配置","icon":"🔤","date":"2024年3月10日","html":"\n<h2 id=\"heading-fonts-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-fonts-1\" class=\"heading-anchor\">#</a>3.3 字体使用与优化配置</h2>\n\n\n\n<h3 id=\"heading-fonts-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-fonts-2\" class=\"heading-anchor\">#</a>应用包内置字体</h3>\n\n\n<p class=\"feishu-p\">MPFlutter 默认使用 <a href=\"https://fonts.google.com/noto/specimen/Noto+Sans/about\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Google NotoSans</a> 和 <a href=\"https://fonts.google.com/specimen/Roboto/about\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Roboto</a> 字体渲染文本，这两种字体均为<a href=\"https://fonts.google.com/noto/specimen/Noto+Sans/about\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">可商用字体</a>。</p>\n\n\n<p class=\"feishu-p\">在 《<a href=\"https://weypl4zsnv.feishu.cn/wiki/I45wwTI9XiH0AXkvQUEc2jZ8nFP\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">编写第一个 MPFlutter 微信小程序</a>》 文档中下载的 awesome_project，在 fonts 目录下就存在对应的 ttf 文件。</p>\n\n\n<p class=\"feishu-p\">特别提醒你，fonts/NotoSansSC-Regular.ttf 简体中文字体文件是经过裁剪的，它收录了常用的 9000+ 简体汉字。如果你需要使用完整版本的 NotoSansSc，请直接删除这个文件，参考本文档「自定义字体」处理。</p>\n\n\n\n<h3 id=\"heading-fonts-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-fonts-3\" class=\"heading-anchor\">#</a>为什么要指定字体文件？</h3>\n\n\n<p class=\"feishu-p\">MPFlutter 是基于 Flutter For Web + CanvasKit Renderer 渲染的，实质上是通过 Skia + WebGL 渲染界面。</p>\n\n\n<p class=\"feishu-p\">在浏览器上、在微信小程序上，都是无法直接从宿主中获取到系统字体文件的。</p>\n\n\n<p class=\"feishu-p\">无字体文件也就无法渲染文本。</p>\n\n\n\n<h5 id=\"heading-fonts-4\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-fonts-4\" class=\"heading-anchor\">#</a>解决方案：</h5>\n\n\n<p class=\"feishu-p\">Flutter For Web 支持加载本地或远端的 ttf / otf 字体文件，默认是从 <a href=\"http://fonts.gstatic.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">fonts.gstatic.com</a> 的 API 中加载的。</p>\n\n\n<p class=\"feishu-p\">每次都从 <a href=\"http://fonts.gstatic.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">fonts.gstatic.com</a> 加载字体，会影响应用启动速度，所以我们直接把简体中文、英文 ttf 内置到应用包中。</p>\n\n\n\n<h3 id=\"heading-fonts-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-fonts-4\" class=\"heading-anchor\">#</a>自定义字体</h3>\n\n\n<p class=\"feishu-p\">当内置字体无法满足需要时，可以使用参考《<a href=\"https://flutter.cn/docs/cookbook/design/fonts\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://flutter.cn/docs/cookbook/design/fonts</a>》文档添加字体。</p>\n\n\n<p class=\"feishu-p\">对于使用 HTTP 加载字体，先使用 HTTP 或 Dio 下载 Uint8List 再在 Dart 中使用 loadFontFromList 加载。</p>\n\n\n<p class=\"feishu-p\">特别注意：</p>\n\n<ul class=\"feishu-ul\">\n<li>微信有<a href=\"https://developers.weixin.qq.com/miniprogram/dev/framework/ability/domain.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">业务域名</a>限制，如果你需要从 <a href=\"http://fonts.gstatic.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">fonts.gstatic.com</a> 加载字体，请务必在微信开发者后台添加它。</li>\n<li>非英文字体，文件大小可能超出分包限制，导致应用无法上传，建议优先使用 HTTP 加载字体。</li>\n<li>大部分字体存在商用版权限制，在使用前务必留意，MPFlutter 不对你使用内置以及自定义字体造成的任何法律问题承担责任。</li>\n</ul>\n\n\n<h3 id=\"heading-fonts-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-fonts-5\" class=\"heading-anchor\">#</a>使用 MiniTex 进行文本渲染</h3>\n\n\n<p class=\"feishu-p\">你可以使用 MiniTex 文本渲染器替代 Skia 内置的文本渲染能力，使用 MiniTex 不需要在应用包内置字体，也不需要从 HTTP 服务器加载字体，并支持多国语言、Emoji。</p>\n\n\n<p class=\"feishu-p\">要了解更多 MiniTex 的信息，请点击这里《<a href=\"https://mpflutter.feishu.cn/wiki/JT9kwRkWIiekEMkWxg9cIAITnbd\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">MiniTex 文本渲染器</a>》。</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n","headings":[{"id":"heading-fonts-1","title":"3.3 字体使用与优化配置","level":2},{"id":"heading-fonts-2","title":"应用包内置字体","level":3},{"id":"heading-fonts-3","title":"为什么要指定字体文件？","level":3},{"id":"heading-fonts-4","title":"自定义字体","level":3},{"id":"heading-fonts-5","title":"使用 MiniTex 进行文本渲染","level":3}],"wordCount":1103,"readTime":3,"file":"构建指南_字体使用_U1QPw2Am7ii0bwkNbp1cuufgnah.html"},{"id":"subpackaging","chapterId":"chap_build_guide","chapterTitle":"三、构建指南","title":"小程序智能分包","icon":"📂","date":"2024年3月10日","html":"<h2 id=\"heading-subpackaging-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-subpackaging-1\" class=\"heading-anchor\">#</a>3.4 小程序分包指南</h2>\n<p class=\"feishu-p\">MPFlutter 支持智能分包，帮助你轻松应对微信小程序、抖音小程序的包体积限制。</p>\n<h3 id=\"heading-subpackaging-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-subpackaging-2\" class=\"heading-anchor\">#</a>为什么需要分包？</h3>\n<blockquote class=\"feishu-blockquote\">\n<p class=\"feishu-p\">微信小程序官方文档：https://developers.weixin.qq.com/miniprogram/dev/framework/subpackages.html</p>\n<p class=\"feishu-p\">主要原因是微信小程序官方要求，对于主包要求不超过 2M，主包 + 所有分包整体不得超过 20M。</p>\n<p class=\"feishu-p\">这种要求，是合理的，如果包体积不作任何限制，用户首次加载小程序体验会很差。</p>\n<p class=\"feishu-p\">最初微信小程序的要求是整个应用包不得超过 2M，然而随着小程序的复杂度提升，2M 肯定是不够的，所以官方提供了分包加载支持。</p>\n<p class=\"feishu-p\">分包是 MPFlutter 必须的，一个单纯的 Hello, World 程序，main.dart.js 代码就已经占去 1.7M，再加上字体、图片等资源文件，绝对是超过 2M 的。</p>\n<p class=\"feishu-p\">从 2.4.0 版本开始，main.dart.js 可保持在 700K 内，如果分包大小仍然超出限制，仍然需要按照下述方法执行。</p>\n</blockquote>\n<h3 id=\"heading-subpackaging-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-subpackaging-3\" class=\"heading-anchor\">#</a>代码分包的方法</h3>\n<p class=\"feishu-p\">针对 main.dart.js 体积过大的问题，Flutter For Web 官方已有提供 defered load 方案。</p>\n<p class=\"feishu-p\">以下是一个例子，用于将 box.dart 拆到分包中。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:flutter/material.dart&#x27;;\nimport &#x27;box.dart&#x27; deferred as box;\n\nclass SomeWidget extends StatefulWidget {\n  const SomeWidget({super.key});\n\n  @override\n  State&lt;SomeWidget&gt; createState() =&gt; _SomeWidgetState();\n}\n\nclass _SomeWidgetState extends State&lt;SomeWidget&gt; {\n  late Future&lt;void&gt; _libraryFuture;\n\n  @override\n  void initState() {\n    _libraryFuture = box.loadLibrary();\n    super.initState();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return FutureBuilder&lt;void&gt;(\n      future: _libraryFuture,\n      builder: (context, snapshot) {\n        if (snapshot.connectionState == ConnectionState.done) {\n          if (snapshot.hasError) {\n            return Text(&#x27;Error: ${snapshot.error}&#x27;);\n          }\n          return box.DeferredBox();\n        }\n        return const CircularProgressIndicator();\n      },\n    );\n  }\n}</code></pre>\n</div>\n<p class=\"feishu-p\">对于 main.dart.js 的整体分包，我们甚至会更激进地在 main.dart 中针对所有的页面和库分包。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter/mpflutter.dart&#x27;;\n// 注意：material 分包需要显式 show 所有使用到的元素。\nimport &#x27;package:flutter/material.dart&#x27; deferred as material\n    show MaterialApp, ThemeData, AppBarTheme, Colors, TargetPlatform, Locale;\n// import &#x27;package:full_screen_back_gesture/full_screen_back_gesture.dart&#x27;;\nimport &#x27;package:mpflutter_gallery/home.dart&#x27;;\nimport &#x27;package:mpflutter_gallery/auto_test/auto_test_page.dart&#x27;\n    deferred as auto_test_page;\nimport &#x27;package:mpflutter_gallery/ui/flutter_animations/page/animation01/AnimationOnePage.dart&#x27;\n    deferred as animation_one_page;\nimport &#x27;package:mpflutter_gallery/ui/ui_infinite_listview.dart&#x27;\n    deferred as ui_infinite_listview;\nimport &#x27;package:mpflutter_gallery/ui/ui_waterfall_view.dart&#x27;\n    deferred as ui_waterfall_view;\nimport &#x27;package:mpflutter_gallery/ui/ui_flchart.dart&#x27; deferred as ui_flchart;\nimport &#x27;package:mpflutter_gallery/ui/form_app/main.dart&#x27;\n    deferred as ui_form_app;\n\nvoid main() async {\n  await material.loadLibrary();\n  await auto_test_page.loadLibrary();\n  await animation_one_page.loadLibrary();\n  await ui_infinite_listview.loadLibrary();\n  await ui_waterfall_view.loadLibrary();\n  await ui_flchart.loadLibrary();\n  await ui_form_app.loadLibrary();\n  runMPApp(material.MaterialApp(\n    // ......\n    routes: {\n      &#x27;/&#x27;: (context) =&gt; const HomePage(),\n      &#x27;/auto_test&#x27;: (context) =&gt; auto_test_page.AutoTestPage(),\n      &#x27;/ui_infinite_listview&#x27;: (context) =&gt;\n          ui_infinite_listview.UIInfiniteListViewPage(),\n      &#x27;/ui_waterfall_view&#x27;: (context) =&gt;\n          ui_waterfall_view.UIWaterfallViewPage(),\n      &#x27;/animation_one_page&#x27;: (context) =&gt; animation_one_page.AnimationOnePage(),\n      &#x27;/flchart_page&#x27;: (context) =&gt; ui_flchart.UIFLChartPage(),\n      &#x27;/form_app/home&#x27;: (context) =&gt; ui_form_app.HomePage(),\n      &#x27;/form_app/signin_http&#x27;: (context) =&gt; ui_form_app.SignInHttpDemo(),\n      &#x27;/form_app/autofill&#x27;: (context) =&gt; ui_form_app.AutofillDemo(),\n      &#x27;/form_app/form_widgets&#x27;: (context) =&gt; ui_form_app.FormWidgetsDemo(),\n      &#x27;/form_app/validation&#x27;: (context) =&gt; ui_form_app.FormValidationDemo(),\n    },\n  ));\n}</code></pre>\n</div>\n<p class=\"feishu-p\">在使用 <code class=\"inline-code\">deferred as</code> 定义完成后，使用 <code class=\"inline-code\">dart scripts/build_wechat.dart</code> 构建的 JS 代码，就会智能地被分配到分包中，并且在需要引入的时候，分包会被自动加载。</p>\n<h3 id=\"heading-subpackaging-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-subpackaging-4\" class=\"heading-anchor\">#</a>小游戏的分包加载方法</h3>\n<p class=\"feishu-p\">对于小游戏，需要在 loadLibrary 之前，先调用一次 runMPApp，在 runMPApp 中你可以添加一个占位图或者闪屏图。</p>\n<p class=\"feishu-p\">如果没有这个占位图，会导致 iOS 上的小游戏渲染异常。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">void main() async {\n    runMPApp(Container()); // 放占位图\n    await material.loadLibrary();\n    await a.loadLibrary();\n    await b.loadLibrary();\n    await c.loadLibrary();\n    runMPApp(YourApp()); // 加载完成分包后，才运行真正的 App\n}</code></pre>\n</div>\n<h3 id=\"heading-subpackaging-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-subpackaging-5\" class=\"heading-anchor\">#</a>资源分包的方法</h3>\n<p class=\"feishu-p\">资源文件单个分包如果超过 2M，build_tools 会自动将其切分为另一个分包，并在需要使用的时候加载。</p>\n<p class=\"feishu-p\">如果资源文件可以从远端加载，仍然建议你放在远端而不是应用包中。</p>\n","headings":[{"id":"heading-subpackaging-1","title":"3.4 小程序分包指南","level":2},{"id":"heading-subpackaging-2","title":"为什么需要分包？","level":3},{"id":"heading-subpackaging-3","title":"代码分包的方法","level":3},{"id":"heading-subpackaging-4","title":"小游戏的分包加载方法","level":3},{"id":"heading-subpackaging-5","title":"资源分包的方法","level":3}],"wordCount":301,"readTime":5,"file":"构建指南_分包_SOyMwWah7iWNiWkRmtncOZepnzh.html"},{"id":"extensions","chapterId":"chap_extensions","chapterTitle":"四、扩展指南与 Package 生态","title":"扩展指南概述","icon":"🧩","date":"2024年3月10日","html":"\n<h2 id=\"heading-extensions-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-extensions-1\" class=\"heading-anchor\">#</a>四、扩展指南与 Package 生态</h2>\n\n\n","headings":[{"id":"heading-extensions-1","title":"四、扩展指南与 Package 生态","level":2}],"wordCount":23,"readTime":1,"file":"08_扩展指南_ZoBmwKjNLijOIVkmG4HcRqqjn4b.html"},{"id":"use_packages","chapterId":"chap_extensions","chapterTitle":"四、扩展指南与 Package 生态","title":"在 MPFlutter 里使用 Packages","icon":"🔌","date":"2024年3月10日","html":"<h2 id=\"heading-use_packages-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-use_packages-1\" class=\"heading-anchor\">#</a>4.1 在 MPFlutter 里使用 Packages</h2>\n<p class=\"feishu-p\">MPFlutter 支持开发者使用 Flutter 生态中已有的 Packages。</p>\n<h3 id=\"heading-use_packages-2\" c
