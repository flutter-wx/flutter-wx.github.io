lass=\"doc-heading doc-heading-h3\"><a href=\"#heading-use_packages-2\" class=\"heading-anchor\">#</a>可用的 Package</h3>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">完全不依赖 Platform Channel 的 Package，可以直接引入使用。\n例如以下 Package：</li>\n    <li class=\"feishu-li\">Dio</li>\n    <li class=\"feishu-li\">GetX</li>\n    <li class=\"feishu-li\">Provider</li>\n    <li class=\"feishu-li\">json_serializable</li>\n    <li class=\"feishu-li\">fl_chart</li>\n    <li class=\"feishu-li\">......</li>\n    <li class=\"feishu-li\">依赖 Flutter For Web 的 Package，需要 MPFlutter 官方完成对应的小程序 API -&gt; JS 适配才可以使用。\n以下 Package 已由 MPFlutter 官方完成适配，你可以直接引入使用：</li>\n    <li class=\"feishu-li\">http</li>\n    <li class=\"feishu-li\">shared_preferences</li>\n</ul>\n<h3 id=\"heading-use_packages-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-use_packages-3\" class=\"heading-anchor\">#</a>不可用的 Package</h3>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">依赖 Platform Channel  的 Package，并且高度依赖设备实现。</li>\n</ul>\n<p class=\"feishu-p\">例如：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">geolocator</li>\n    <li class=\"feishu-li\">url_launcher</li>\n    <li class=\"feishu-li\">image_picker</li>\n    <li class=\"feishu-li\">cached_network_image</li>\n    <li class=\"feishu-li\">path_provider</li>\n    <li class=\"feishu-li\">依赖 PlatformView 实现的 Package，也是不可用的。</li>\n</ul>\n<p class=\"feishu-p\">例如：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">google_maps_flutter</li>\n    <li class=\"feishu-li\">flutter_video_view</li>\n    <li class=\"feishu-li\">webview_flutter</li>\n</ul>\n<p class=\"feishu-p\">针对这些需求，MPFlutter 官方后续会推出方案，支持对应的功能。</p>\n<p class=\"feishu-p\">你也可以通过阅读微信小程序文档，了解对应的 API 是否可覆盖你的场景。</p>\n<p class=\"feishu-p\">你可以通过《《<a href=\"#wechat_api\" onclick=\"switchArticle('wechat_api')\">微信小程序 API 封装库</a>》 》文档，学习如何使用 mpflutter_wechat_api 库，便利地使用 Dart 调用微信小程序 API。</p>\n<h3 id=\"heading-use_packages-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-use_packages-4\" class=\"heading-anchor\">#</a>忽略不可用的 Package</h3>\n<p class=\"feishu-p\">不可用的 Package 可能导致小程序无法启动，最常见的表现是冷启动白屏，即使你不在 dart 中调用这些不兼容包，也可能导致白屏。</p>\n<p class=\"feishu-p\">解决方案如下：</p>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">在 <code class=\"inline-code\">pubspec.yaml</code> 中移除未确定兼容的 Package 解决问题。</li>\n    <li class=\"feishu-li\">另外也可以通过声明某些 Package 为不兼容，解决问题。</li>\n</ol>\n<p class=\"feishu-p\">不兼容的 Package 一般可以在 <code class=\"inline-code\">.dart_tool/dartpad/web_plugin_registrant.dart</code> 中找到。</p>\n<p class=\"feishu-p\">在 scripts/build_wechat.dart 中，使用以下代码声明就可以实现在 MPFlutter 下不打包指定 Package。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">code</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-text\">build_tools.addNonCompatiblesPackage(&#x27;pkgname&#x27;);</code></pre>\n</div>\n","headings":[{"id":"heading-use_packages-1","title":"4.1 在 MPFlutter 里使用 Packages","level":2},{"id":"heading-use_packages-2","title":"可用的 Package","level":3},{"id":"heading-use_packages-3","title":"不可用的 Package","level":3},{"id":"heading-use_packages-4","title":"忽略不可用的 Package","level":3}],"wordCount":115,"readTime":2,"file":"扩展指南_在 MPFlutter 里使用 Packages_HWPvwnLici0TsYkJoeqc4afTnac.html"},{"id":"develop_package","chapterId":"chap_extensions","chapterTitle":"四、扩展指南与 Package 生态","title":"自主开发 Package","icon":"🛠️","date":"2024年3月10日","html":"\n<h2 id=\"heading-develop_package-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-develop_package-1\" class=\"heading-anchor\">#</a>4.2 自主开发 Package</h2>\n\n\n\n<h3 id=\"heading-develop_package-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-develop_package-2\" class=\"heading-anchor\">#</a>开发</h3>\n\n\n<p class=\"feishu-p\">请参考 Flutter 官方文档学习 Package 的开发：</p>\n\n\n<p class=\"feishu-p\"><a href=\"https://flutter.cn/docs/packages-and-plugins/developing-packages#web\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://flutter.cn/docs/packages-and-plugins/developing-packages#web</a></p>\n\n\n<p class=\"feishu-p\">MPFlutter Package 可直接复用 Flutter For Web Package，使用 dart:js 与 JavaScript API 进行跨语言交互。</p>\n\n\n<p class=\"feishu-p\">如果需要开发特定的微信小程序平台插件，请参考 《<a href=\"https://mpflutter.feishu.cn/wiki/Oc9Kw42X5i8naHkNeo8c6JKGnPc\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">自制微信小程序 Package</a>》。</p>\n\n\n\n<h3 id=\"heading-develop_package-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-develop_package-3\" class=\"heading-anchor\">#</a>发布</h3>\n\n\n<p class=\"feishu-p\">同样的，请参考 Flutter 官方文档，发布 Package 到 pub.dev，然后你就可以与公域开发者分享你的扩展包了。</p>\n\n\n","headings":[{"id":"heading-develop_package-1","title":"4.2 自主开发 Package","level":2},{"id":"heading-develop_package-2","title":"开发","level":3},{"id":"heading-develop_package-3","title":"发布","level":3}],"wordCount":337,"readTime":1,"file":"扩展指南_自主开发 Package_K4SYw4XNfim6Kgk446tcH1KGnUe.html"},{"id":"advanced","chapterId":"chap_advanced","chapterTitle":"五、进阶指南","title":"进阶指南规划与深度架构","icon":"🚀","date":"2024年1月12日","html":"\n<h2 id=\"heading-advanced-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-advanced-1\" class=\"heading-anchor\">#</a>五、进阶指南</h2>\n\n\n\n\n<div class=\"callout-card callout-note\"><div class=\"callout-header\"><span class=\"callout-icon\">📝</span><span class=\"callout-title\">说明</span></div><div class=\"callout-content\">\n<p class=\"feishu-p\"><strong>进阶开发与架构指南</strong></p>\n\n<p class=\"feishu-p\">本章节面向需要进行深度定制、高性能架构优化、复杂原生混合工程集成的开发者。</p>\n\n\n</div></div>\n\n\n\n<h3 id=\"heading-advanced-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-advanced-2\" class=\"heading-anchor\">#</a>1. 架构优化方向</h3>\n<ul class=\"feishu-ul\">\n<li><strong>渲染树精简</strong>：充分利用 <code class=\"inline-code\">RepaintBoundary</code> 减少 WebGL 脏区域重绘，降低小程序 CPU / GPU 负载。</li>\n<li><strong>内存优化</strong>：在小程序单页面栈切换时，主动释放未引用的 ImageProvider 缓存与网络资源。</li>\n<li><strong>自定义 WebGL 渲染管线</strong>：通过扩展 mpflutter_core，支持接入自研 WebGL 滤镜或着色器。</li>\n</ul>\n\n\n<h3 id=\"heading-advanced-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-advanced-3\" class=\"heading-anchor\">#</a>2. 原生混合开发</h3>\n<ul class=\"feishu-ul\">\n<li><strong>同层渲染集成</strong>：使用 Platform View Overlay 与原生组件（如 live-pusher, camera, map, video）无缝融合。</li>\n<li><strong>多页面栈与分包分流</strong>：将大型应用的主业务与次要业务划分为不同分包，主包控制在 2MB 以内。</li>\n</ul>\n\n\n<h3 id=\"heading-advanced-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-advanced-4\" class=\"heading-anchor\">#</a>3. 持续集成与发布自动化</h3>\n<ul class=\"feishu-ul\">\n<li>通过命令行集成 <code class=\"inline-code\">dart2js</code> 与构建脚本，无缝对接 GitLab CI / GitHub Actions 自动构建与微信小程序预览码生成。</li>\n</ul>\n\n\n\n","headings":[{"id":"heading-advanced-1","title":"五、进阶指南","level":2},{"id":"heading-advanced-2","title":"1. 架构优化方向","level":3},{"id":"heading-advanced-3","title":"2. 原生混合开发","level":3},{"id":"heading-advanced-4","title":"3. 持续集成与发布自动化","level":3}],"wordCount":484,"readTime":1,"file":"09_进阶指南_XOQiwrvBKiCXshkvJxkc4ByhnQd.html"},{"id":"minitex","chapterId":"chap_minitex","chapterTitle":"六、MiniTex 免加载字体文本渲染器","title":"MiniTex 概述与使用","icon":"🔤","date":"2024年6月14日","html":"<h2 id=\"heading-minitex-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-minitex-1\" class=\"heading-anchor\">#</a>5.1 MiniTex 概述与使用</h2>\n<p class=\"feishu-p\">MiniTex 是一个文本渲染器，同时具备文本排版能力，借助 MiniTex，Flutter Web CanvasKit 应用可以在不加载字体文件的情况下，依然可以渲染多国语言。</p>\n<p class=\"feishu-p\">具体原理，可阅读《《<a href=\"#minitex_deep\" onclick=\"switchArticle('minitex_deep')\">免加载字体的文本渲染器 —— MiniTex</a>》》。</p>\n<h3 id=\"heading-minitex-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-minitex-2\" class=\"heading-anchor\">#</a>使用方法</h3>\n<h4 id=\"heading-minitex-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-minitex-3\" class=\"heading-anchor\">#</a>MPFlutter</h4>\n<p class=\"feishu-p\">MPFlutter 2.3.0 版本已内置 MiniTex，你只需要在《《<a href=\"#first_app\" onclick=\"switchArticle('first_app')\">编写第一个 MPFlutter 应用</a>》》下载 MiniTex 版本的 awesome_project 就可以开始体验。</p>\n<p class=\"feishu-p\">如果不希望从模板工程开始，可以升级相关依赖到 2.3.0 版本，然后：</p>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">在 <code class=\"inline-code\">main.dart</code> 中配置 <code class=\"inline-code\">fontFamily</code>。</li>\n</ol>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">// main.dart\nclass MyApp extends StatelessWidget {\n  const MyApp({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return MaterialApp(\n      title: &#x27;Flutter Demo&#x27;,\n      theme: ThemeData(\n        // 设置 ThemeData 的 fontFamily 和 fontFamilyFallback 为以下值。\n        fontFamily: &quot;MiniTex&quot;,\n        fontFamilyFallback: [&quot;MiniTex&quot;],\n      ),\n      // ...\n    );\n  }\n}</code></pre>\n</div>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">在 <code class=\"inline-code\">pubspec.yaml</code> 中删除字体依赖。</li>\n</ol>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\"># pubspec.yaml\nname: awesome_project\ndescription: A new Flutter project.\npublish_to: &#x27;none&#x27;\n\nversion: 1.0.0+1\n\nenvironment:\n  sdk: &#x27;&gt;=3.1.5 &lt;4.0.0&#x27;\n\ndependencies:\n  flutter:\n    sdk: flutter\n  mpflutter_core: ^2.4.0\n  mpflutter_build_tools: ^2.4.1\n  mpflutter_wechat_api: ^2.2.0\n  mpflutter_wechat_mapview: ^0.0.3\n\nflutter:\n  uses-material-design: true\n  # 使用 MiniTex，不再需要加载任何字体，注释后，字体不会打包到小程序包中。\n  # fonts:\n  #   - family: Roboto\n  #     fonts:\n  #       - asset: fonts/Roboto-Regular.ttf\n  #       - asset: fonts/Roboto-Bold.ttf\n  #   - family: Noto Sans SC\n  #     fonts:\n  #       - asset: fonts/NotoSansSC-Regular.ttf\n</code></pre>\n</div>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">在 <code class=\"inline-code\">scripts/build_wechat.dart</code> 中配置构建选项</li>\n</ol>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_build_tools/main.dart&#x27; as build_tools;\n\nvoid main(List&lt;String&gt; arguments) async {\n  final buildArgs = [...arguments]..add(&#x27;--wechat&#x27;);\n  build_tools.useMiniTex = true; // 声明使用 MiniTex。\n  build_tools.useNoFontCanvasKit = true; // 声明使用无字体能力的 CanvasKit，可以进一步瘦包。\n  build_tools.main(buildArgs);\n}</code></pre>\n</div>\n<h4 id=\"heading-minitex-4\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-minitex-4\" class=\"heading-anchor\">#</a>Web</h4>\n<p class=\"feishu-p\">MiniTex 也支持在 Web 中使用，你可以直接从模板工程开始。</p>\n<p class=\"feishu-p\"> （请使用 240227 更新版本）</p>\n<div class=\"file-card\" style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(0,0,0,0.03);border:1px solid rgba(0,0,0,0.08);border-radius:8px;margin:12px 0;\">\n    <div class=\"file-icon\" style=\"font-size:24px;\">📦</div>\n    <div class=\"file-info\">\n        <div class=\"file-name\" style=\"font-weight:600;color:var(--text-color, #222);\">minitex_flutter_web_test.zip</div>\n        <div class=\"file-size\" style=\"font-size:12px;color:var(--text-secondary, #666);\">413.3 KB（工程配套附件模板）</div>\n    </div>\n</div>\n<p class=\"feishu-p\"> </p>\n<div class=\"file-card\" style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(0,0,0,0.03);border:1px solid rgba(0,0,0,0.08);border-radius:8px;margin:12px 0;\">\n    <div class=\"file-icon\" style=\"font-size:24px;\">📦</div>\n    <div class=\"file-info\">\n        <div class=\"file-name\" style=\"font-weight:600;color:var(--text-color, #222);\">minitex_flutter_web_test_240227.zip</div>\n        <div class=\"file-size\" style=\"font-size:12px;color:var(--text-secondary, #666);\">475.7 KB（工程配套附件模板）</div>\n    </div>\n</div>\n<p class=\"feishu-p\">当然，你也可以将 MiniTex 添加到已有的工程中。</p>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">复制模板工程中的 <code class=\"inline-code\">web/minitex.min.js</code> 到你的工程对应目录下。</li>\n    <li class=\"feishu-li\">minitex.min.js 会随时更新，请在这个地址下载最新版本 https://github.com/mpflutter/minitex/blob/master/minitex.min.js </li>\n    <li class=\"feishu-li\">复制模板工程中的 <code class=\"inline-code\">web/index.html</code> 到你的工程对应目录下。</li>\n    <li class=\"feishu-li\">参考 MPFlutter 的方法，配置 <code class=\"inline-code\">main.dart</code> 和 <code class=\"inline-code\">pubspec.yaml</code>。</li>\n</ol>\n<h3 id=\"heading-minitex-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-minitex-5\" class=\"heading-anchor\">#</a>代码开源</h3>\n<p class=\"feishu-p\">MiniTex 已托管到 GitHub，你可以在遵守 License 的情况下使用和分发，MiniTex 在单独使用时，无需授权也无需付费。</p>\n<p class=\"feishu-p\">https://github.com/mpflutter/minitex</p>\n<p class=\"feishu-p\">使用中遇到任何问题，请直接在 GitHub 上提交 Issue。</p>\n","headings":[{"id":"heading-minitex-1","title":"5.1 MiniTex 概述与使用","level":2},{"id":"heading-minitex-2","title":"使用方法","level":3},{"id":"heading-minitex-3","title":"MPFlutter","level":4},{"id":"heading-minitex-4","title":"Web","level":4},{"id":"heading-minitex-5","title":"代码开源","level":3}],"wordCount":229,"readTime":4,"file":"10_MiniTex 文本渲染器_JT9kwRkWIiekEMkWxg9cIAITnbd.html"},{"id":"minitex_deep","chapterId":"chap_minitex","chapterTitle":"六、MiniTex 免加载字体文本渲染器","title":"免加载字体的 Flutter 文本渲染器 —— MiniTex","icon":"📖","date":"2024年6月14日","html":"<h2 id=\"heading-minitex_deep-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-minitex_deep-1\" class=\"heading-anchor\">#</a>5.2 MiniTex 技术原理与架构解析</h2>\n<div class=\"callout-card callout-tip\">\n    <div class=\"callout-content\">\n        <p></p>\n    </div>\n</div>\n<p class=\"feishu-p\">MiniTex 是一个文本渲染器，同时具备文本排版能力，借助 MiniTex，Flutter Web CanvasKit 应用可以在不加载字体文件的情况下，依然可以渲染多国语言。</p>\n<p class=\"feishu-p\">MiniTex 支持在 MPFlutter 和 Flutter Web 中使用，开源，免费。</p>\n<p class=\"feishu-p\">本文主要介绍 MiniTex 的实现原理以及使用方法。</p>\n<h3 id=\"heading-minitex_deep-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-minitex_deep-2\" class=\"heading-anchor\">#</a>一、背景</h3>\n<p class=\"feishu-p\">Flutter Web 存在 CanvasKit 渲染器，该渲染器使用 Skia WebAssembly 驱动，在该模式下渲染文本需要通过加载 ttf 字体文件实现，这种方式对于 Latin 系语言相对友好，但对于汉语、日语等方块字语言则不太友好。</p>\n<p class=\"feishu-p\">原因在于：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">方块字语言字符集较大，故未经裁剪的简体中文字体文件一般都超过 5M；</li>\n    <li class=\"feishu-li\">字体版权不容易处理，可商用字体选择范围少，一般是使用 Noto 系列字体；</li>\n    <li class=\"feishu-li\">Emoji 文本无法渲染，或渲染效果无法对齐原生。</li>\n</ul>\n<p class=\"feishu-p\">MPFlutter 也同样遇到上述问题，我们是通过裁剪 Noto Sans SC 并内置在应用包中，以驱动中文文本渲染的，这也导致 MPFlutter 初始包大小超过 5M。</p>\n<p class=\"feishu-p\">我们需要另辟蹊径解决这些问题。</p>\n<h3 id=\"heading-minitex_deep-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-minitex_deep-3\" class=\"heading-anchor\">#</a>二、技术目标</h3>\n<p class=\"feishu-p\">使用 JavaScript + Web Canvas 2D 编写一个在功能上对齐 Skia 文本渲染能力的库。</p>\n<p class=\"feishu-p\">该库需要是：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">跨平台的，至少是微信小程序、Web 都可用的；</li>\n    <li class=\"feishu-li\">在接口上对齐 Skia，以保证 Flutter / Dart 的调用是一致的；</li>\n    <li class=\"feishu-li\">不能依赖外部的 TTF 字体文件，且需要保证文本换行、描边、阴影、装饰等功能与 Skia 实现一致。</li>\n</ul>\n<h3 id=\"heading-minitex_deep-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-minitex_deep-4\" class=\"heading-anchor\">#</a>三、原理分析</h3>\n<p class=\"feishu-p\">Skia 是一个开源的 2D 渲染库，主要由矢量绘制、文本绘制、位图绘制功能组合而成。</p>\n<p class=\"feishu-p\">通过阅读 Flutter 和 Skia 源码，我们梳理出相关的渲染流程，如下图：</p>\n<div class=\"article-image-box\">\n    <img src=\"./images/minitex_flow_skia.jpg\" alt=\"Skia 文本渲染流程与核心环节\" class=\"zoomable-img\" onclick=\"openLightbox('./images/minitex_flow_skia.jpg', 'Skia 文本渲染流程与核心环节')\" />\n    <div class=\"image-caption\">Skia 文本渲染流程与核心环节</div>\n</div>\n<p class=\"feishu-p\">流程并不复杂，实际复杂的部分在于 Layout 和 Draw。</p>\n<p class=\"feishu-p\">复杂的 Layout 处理逻辑可以服务于多变的国际化语言需求，例如 RTL、堆叠文本、分词、断句等能力。</p>\n<p class=\"feishu-p\">复杂的 Draw 逻辑主要是性能考虑以及多样化的 Decoration 需求。</p>\n<p class=\"feishu-p\">我们从上述流程也可以得知，如果没有加载合适的字体，Skia 是无法进行 Layout 和 Draw 的。</p>\n<p class=\"feishu-p\">故，MiniTex 的做法是直接将 Layout 和 Draw 使用 JavaScript 重写。</p>\n<h3 id=\"heading-minitex_deep-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-minitex_deep-5\" class=\"heading-anchor\">#</a>四、MiniTex 的技术方案</h3>\n<h4 id=\"heading-minitex_deep-6\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-minitex_deep-6\" class=\"heading-anchor\">#</a>Hook</h4>\n<p class=\"feishu-p\">Skia CanvasKit 的产物有两部分，wasm 和 JavaScript，我们可以很轻松地 Hook JavaScript 接口，为了将 MiniTex 的实现注入到 CanvasKit，可以这样做：</p>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">替换 SkParagraphBuilder.MakeFromFontCollection 方法，在符合条件的情况下返回 MiniTex 实现的 SkParagraph；</li>\n    <li class=\"feishu-li\">替换 SkCanvas.drawParagraph 方法，当遇到 MiniTex 的 SkParagraph 实例时，使用 Web Canvas 2D 绘制文本；</li>\n    <li class=\"feishu-li\">将绘制好文本的 Web Canvas 2D，使用 getImageData 获得位图对象，由 Skia 进行常规的位图绘制。</li>\n</ol>\n<h4 id=\"heading-minitex_deep-7\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-minitex_deep-7\" class=\"heading-anchor\">#</a>ParagraphBuilder</h4>\n<p class=\"feishu-p\">ParagraphBuilder 的实现非常简单，它接受来自 Client 的 TextStyle 和 Text，并组合成多个 Span。</p>\n<p class=\"feishu-p\">在 build 的时候，将 spans 和 paragraphStyle 设值给 SkParagraph 即可。</p>\n<p class=\"feishu-p\">特别要注意的是，Client 的 TextStyle 是可以多层嵌套的，故 Builder 提供的是 pushStyle 和 pop 方法。</p>\n<div class=\"article-image-box\">\n    <img src=\"./images/minitex_render_pipeline.jpg\" alt=\"MiniTex ParagraphBuilder 渲染管线\" class=\"zoomable-img\" onclick=\"openLightbox('./images/minitex_render_pipeline.jpg', 'MiniTex ParagraphBuilder 渲染管线')\" />\n    <div class=\"image-caption\">MiniTex ParagraphBuilder 渲染管线</div>\n</div>\n<h4 id=\"heading-minitex_deep-8\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-minitex_deep-8\" class=\"heading-anchor\">#</a>Paragraph</h4>\n<p class=\"feishu-p\">Paragraph 是一个实体（数据模型）类，它只负责向具体的 Impl 发送指令，并返回对应的结果。</p>\n<p class=\"feishu-p\">具体来说，Paragraph 负责连接 TextLayout，请求 TextLayout 根据当前 maxWidth 计算每个字符的 Bounds。</p>\n<p class=\"feishu-p\">Flutter 会根据 Paragraph 返回的 minWidth / minHeight / maxWidth / maxHeight 信息计算 Text / RichText 在 UI 中的相对布局。</p>\n<h4 id=\"heading-minitex_deep-9\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-minitex_deep-9\" class=\"heading-anchor\">#</a>TextLayout</h4>\n<p class=\"feishu-p\">在本方案中，我们没有使用 Harfbuzz 或者 ICU 库进行字符测量和排版。</p>\n<p class=\"feishu-p\">我们使用的是 Web Canvas 提供的 measureText API，该 API 可以返回指定字体（默认是系统字体）的指定字符串宽度信息，高版本的 Chrome 甚至可以返回逐字宽度和逐字高度。</p>\n<p class=\"feishu-p\">一个完整的字符测量结果如下图所示：</p>\n<div class=\"article-image-box\">\n    <img src=\"./images/minitex_text_measure.jpg\" alt=\"Web Canvas 字符测量四要素（Top/Bottom/Ascent/Descent）\" class=\"zoomable-img\" onclick=\"openLightbox('./images/minitex_text_measure.jpg', 'Web Canvas 字符测量四要素（Top/Bottom/Ascent/Descent）')\" />\n    <div class=\"image-caption\">Web Canvas 字符测量四要素（Top/Bottom/Ascent/Descent）</div>\n</div>\n<p class=\"feishu-p\">只要我们可以获得每一字符的四要素，就可以计算出一段文本的排版结果。</p>\n<p class=\"feishu-p\">然而，并非所有浏览器都会返回四要素，此时，我们可以通过 <code class=\"inline-code\">measureText(&#x27;M&#x27;)</code> 的 <code class=\"inline-code\">width</code> 值，近似计算得到其余值。</p>\n<p class=\"feishu-p\">一个棘手的问题是，多行文本的排版处理。由于 Web Canvas measureText API 仅返回单行文本的宽高，不返回多行文本的任何信息，也就是它不负责换行的计算，我们需要自行实现换行策略。</p>\n<p class=\"feishu-p\">我们是这样处理换行的：</p>\n<div class=\"article-image-box\">\n    <img src=\"./images/minitex_layout_box.jpg\" alt=\"MiniTex 多行文本排版与换行测量算法\" class=\"zoomable-img\" onclick=\"openLightbox('./images/minitex_layout_box.jpg', 'MiniTex 多行文本排版与换行测量算法')\" />\n    <div class=\"image-caption\">MiniTex 多行文本排版与换行测量算法</div>\n</div>\n<p class=\"feishu-p\">当然，在实际过程中，需要处理的情况会更多，例如 maxLines、标点符号、英文单词分拆等，具体处理逻辑就不在这里详述了。</p>\n<h4 id=\"heading-minitex_deep-10\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-minitex_deep-10\" class=\"heading-anchor\">#</a>TextRenderer</h4>\n<p class=\"feishu-p\">最后，我们需要将 Paragraph 绘制到离屏 Canvas 上，我们仍然使用 Web Canvas 2D，使用 <code class=\"inline-code\">fillText</code> 方法。</p>\n<p class=\"feishu-p\">绘制过程就是将上述 Layout 的过程重复一遍，将逐个 Span 对应的 Glyph 使用指定的 <code class=\"inline-code\">fillStyle</code> 绘制到画布上，并不复杂，感兴趣的同学可以从 MiniTex 的源码中了解，包括 Decoration 的绘制也是一样的。</p>\n<p class=\"feishu-p\">在文本绘制完成后，只需要 getImageData，接着使用 <code class=\"inline-code\">CanvasKit.MakeImage</code> 创建一个 <code class=\"inline-code\">SkImage</code> 就可以绘制到 Flutter 界面了。</p>\n<p class=\"feishu-p\">这里有一个小问题，<code class=\"inline-code\">measureText</code> 会返回浮点类型的 x,y,w,h，如果直接使用浮点数 <code class=\"inline-code\">fillText</code>，在 Flutter 界面中会看到一大堆锯齿文本，解决方法是在 <code class=\"inline-code\">fillText</code> 前，通过 <code class=\"inline-code\">Math.ceil</code> 转换为整数。</p>\n<h3 id=\"heading-minitex_deep-11\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-minitex_deep-11\" class=\"heading-anchor\">#</a>五、MiniTex 现状</h3>\n<p class=\"feishu-p\">目前 MiniTex 已完全跑通流程，并支持大部分 TextStyle，尚有 letterSpacing / lineSpacing 等特性待后续实现。</p>\n<p class=\"feishu-p\">已在 GitHub 开源 https://github.com/mpflutter/minitex</p>\n<p class=\"feishu-p\">已集成到 MPFlutter 2.3.0 版本，并支持 Flutter Web 使用，欢迎体验。</p>\n<p class=\"feishu-p\">在使用 MiniTex 后，MPFlutter 初始包大小是 3.5M，文本渲染相关功能正常，收益显著。</p>\n<h3 id=\"heading-minitex_deep-12\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-minitex_deep-12\" class=\"heading-anchor\">#</a>六、体验方法</h3>\n<h4 id=\"heading-minitex_deep-13\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-minitex_deep-13\" class=\"heading-anchor\">#</a>MPFlutter</h4>\n<p class=\"feishu-p\">MPFlutter 2.3.0 版本已内置 MiniTex，你只需要在《《<a href=\"#first_app\" onclick=\"switchArticle('first_app')\">编写第一个 MPFlutter 应用</a>》》下载 MiniTex 版本的 awesome_project 就可以开始体验。</p>\n<p class=\"feishu-p\">如果不希望从模板工程开始，可以升级相关依赖到 2.3.0 版本，然后：</p>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">在 <code class=\"inline-code\">main.dart</code> 中配置 <code class=\"inline-code\">fontFamily</code>。</li>\n</ol>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">// main.dart\nclass MyApp extends StatelessWidget {\n  const MyApp({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return MaterialApp(\n      title: &#x27;Flutter Demo&#x27;,\n      theme: ThemeData(\n        // 设置 ThemeData 的 fontFamily 和 fontFamilyFallback 为以下值。\n        fontFamily: &quot;MiniTex&quot;,\n        fontFamilyFallback: [&quot;MiniTex&quot;],\n      ),\n      // ...\n    );\n  }\n}</code></pre>\n</div>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">在 <code class=\"inline-code\">pubspec.yaml</code> 中删除字体依赖。</li>\n</ol>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\"># pubspec.yaml\nname: awesome_project\ndescription: A new Flutter project.\npublish_to: &#x27;none&#x27;\n\nversion: 1.0.0+1\n\nenvironment:\n  sdk: &#x27;&gt;=3.1.5 &lt;4.0.0&#x27;\n\ndependencies:\n  flutter:\n    sdk: flutter\n  mpflutter_core: ^2.3.0\n  mpflutter_build_tools: ^2.3.0\n  mpflutter_wechat_api: ^2.2.0\n  mpflutter_wechat_mapview: ^0.0.3\n\nflutter:\n  uses-material-design: true\n  # 使用 MiniTex，不再需要加载任何字体，注释后，字体不会打包到小程序包中。\n  # fonts:\n  #   - family: Roboto\n  #     fonts:\n  #       - asset: fonts/Roboto-Regular.ttf\n  #       - asset: fonts/Roboto-Bold.ttf\n  #   - family: Noto Sans SC\n  #     fonts:\n  #       - asset: fonts/NotoSansSC-Regular.ttf\n</code></pre>\n</div>\n<h4 id=\"heading-minitex_deep-14\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-minitex_deep-14\" class=\"heading-anchor\">#</a>Web</h4>\n<p class=\"feishu-p\">MiniTex 也支持在 Web 中使用，你可以直接从模板工程开始。</p>\n<p class=\"feishu-p\"> </p>\n<div class=\"file-card\" style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(0,0,0,0.03);border:1px solid rgba(0,0,0,0.08);border-radius:8px;margin:12px 0;\">\n    <div class=\"file-icon\" style=\"font-size:24px;\">📦</div>\n    <div class=\"file-info\">\n        <div class=\"file-name\" style=\"font-weight:600;color:var(--text-color, #222);\">minitex_flutter_web_test.zip</div>\n        <div class=\"file-size\" style=\"font-size:12px;color:var(--text-secondary, #666);\">413.3 KB（工程配套附件模板）</div>\n    </div>\n</div>\n<p class=\"feishu-p\">当然，你也可以将 MiniTex 添加到已有的工程中。</p>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">复制模板工程中的 <code class=\"inline-code\">web/minitex.min.js</code> 到你的工程对应目录下。</li>\n    <li class=\"feishu-li\">minitex.min.js 会随时更新，请在这个地址下载最新版本 https://github.com/mpflutter/minitex/blob/master/minitex.min.js </li>\n    <li class=\"feishu-li\">复制模板工程中的 <code class=\"inline-code\">web/index.html</code> 到你的工程对应目录下。</li>\n    <li class=\"feishu-li\">参考 MPFlutter 的方法，配置 <code class=\"inline-code\">main.dart</code> 和 <code class=\"inline-code\">pubspec.yaml</code>。</li>\n</ol>\n","headings":[{"id":"heading-minitex_deep-1","title":"5.2 MiniTex 技术原理与架构解析","level":2},{"id":"heading-minitex_deep-2","title":"一、背景","level":3},{"id":"heading-minitex_deep-3","title":"二、技术目标","level":3},{"id":"heading-minitex_deep-4","title":"三、原理分析","level":3},{"id":"heading-minitex_deep-5","title":"四、MiniTex 的技术方案","level":3},{"id":"heading-minitex_deep-6","title":"Hook","level":4},{"id":"heading-minitex_deep-7","title":"ParagraphBuilder","level":4},{"id":"heading-minitex_deep-8","title":"Paragraph","level":4},{"id":"heading-minitex_deep-9","title":"TextLayout","level":4},{"id":"heading-minitex_deep-10","title":"TextRenderer","level":4},{"id":"heading-minitex_deep-11","title":"五、MiniTex 现状","level":3},{"id":"heading-minitex_deep-12","title":"六、体验方法","level":3},{"id":"heading-minitex_deep-13","title":"MPFlutter","level":4},{"id":"heading-minitex_deep-14","title":"Web","level":4}],"wordCount":494,"readTime":2,"file":"Blog Articles_免加载字体的 Flutter 文本渲染器 —— MiniTex_B62mwAlrzilcoukX16qcupsNndf.html"},{"id":"wechat_features","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"微信小程序平台特性概述","icon":"📱","date":"2024年7月9日","html":"\n<h2 id=\"heading-wechat_features-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-wechat_features-1\" class=\"heading-anchor\">#</a>六、微信小程序平台特性</h2>\n\n\n","headings":[{"id":"heading-wechat_features-1","title":"六、微信小程序平台特性","level":2}],"wordCount":16,"readTime":1,"file":"11_微信小程序平台特性_FASdwpqeKi2ej8kpALOcsECbnuM.html"},{"id":"domain","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"业务域名配置与限制","icon":"🌐","date":"2024年3月10日","html":"\n<h2 id=\"heading-domain-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-domain-1\" class=\"heading-anchor\">#</a>6.1 业务域名配置与限制</h2>\n\n\n<p class=\"feishu-p\">MPFlutter 与一般的 Flutter 应用在网络请求上有一定区别，你需要在微信小程序开发者后台添加业务域名，才能使用 http 或者 dio 访问对应 HTTP 服务的数据。</p>\n\n\n<p class=\"feishu-p\">这个限制来自于微信官方，具体操作方法请阅读文档。</p>\n\n\n<p class=\"feishu-p\"><a href=\"https://developers.weixin.qq.com/miniprogram/dev/framework/ability/network.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://developers.weixin.qq.com/miniprogram/dev/framework/ability/network.html</a></p>\n\n\n\n<h4 id=\"heading-domain-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-domain-2\" class=\"heading-anchor\">#</a>哪些域名需要添加？</h4>\n\n\n\n<h5 id=\"heading-domain-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-domain-3\" class=\"heading-anchor\">#</a>常规的 HTTP 请求</h5>\n\n\n<p class=\"feishu-p\">只要你使用到了 http 或者 dio，无论是发起 GET 还是 POST 请求，都需要添加域名到开发者后台。</p>\n\n\n\n<h5 id=\"heading-domain-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-domain-3\" class=\"heading-anchor\">#</a>图片 URL</h5>\n\n\n<p class=\"feishu-p\">无论是使用 Flutter 的 Image 组件，还是第三方提供的 flutter_svg 库，只要对应的 Image 组件有访问互联网上的图片，对应 URL 的域名就需要添加到开发者后台。</p>\n\n\n\n<h5 id=\"heading-domain-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-domain-3\" class=\"heading-anchor\">#</a>字体</h5>\n\n\n<p class=\"feishu-p\">如果你使用到了 Google 字体服务，你需要添加 <a href=\"http://fonts.gstatic.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">fonts.gstatic.com</a> 到开发者后台。</p>\n\n\n<p class=\"feishu-p\">由于一个域名只能被添加到 100 个小程序中，如果不能正常添加 Google 的域名，那么你需要自行搭建字体下载服务，全局代理至 <a href=\"http://fonts.gstatic.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">fonts.gstatic.com</a> 。</p>\n\n\n<p class=\"feishu-p\">未来 MPFlutter 官方可能提供 SaaS 形式的字体渐进式加载服务，请关注。</p>\n\n\n\n<h4 id=\"heading-domain-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-domain-3\" class=\"heading-anchor\">#</a>调试状态下跳过域名检查</h4>\n\n\n<p class=\"feishu-p\">你可以微信开发者工具 > 项目 > 详情 > 勾选不校验合法域名，这样可以在 PC 预览的情况下，可以免域名校验。</p>\n\n\n<p class=\"feishu-p\">在真机预览的场景，点击右上角【More】按钮，打开【开发调试】就可以免域名校验。</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n","headings":[{"id":"heading-domain-1","title":"6.1 业务域名配置与限制","level":2},{"id":"heading-domain-2","title":"哪些域名需要添加？","level":4},{"id":"heading-domain-3","title":"调试状态下跳过域名检查","level":4}],"wordCount":733,"readTime":2,"file":"微信小程序平台特性_业务域名_ORrawSYFBiGaZfk3OAXcriNrnOb.html"},{"id":"wechat_api","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"微信小程序 API 封装库 (mpflutter_wechat_api)","icon":"⚙️","date":"2024年3月10日","html":"<h2 id=\"heading-wechat_api-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-wechat_api-1\" class=\"heading-anchor\">#</a>6.2 微信小程序 API 封装库 (mpflutter_wechat_api)</h2>\n<p class=\"feishu-p\">微信小程序提供了一系统的 API，可用于获取以下能力：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">基础信息</li>\n    <li class=\"feishu-li\">网络</li>\n    <li class=\"feishu-li\">本地文件读写</li>\n    <li class=\"feishu-li\">蓝牙</li>\n    <li class=\"feishu-li\">支付</li>\n    <li class=\"feishu-li\">......</li>\n</ul>\n<p class=\"feishu-p\">你可以通过微信官方文档了解</p>\n<p class=\"feishu-p\">https://developers.weixin.qq.com/miniprogram/dev/api/</p>\n<h3 id=\"heading-wechat_api-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-wechat_api-2\" class=\"heading-anchor\">#</a>封装库</h3>\n<p class=\"feishu-p\">对于 MPFlutter 应用，如果每一个 API 的调用都需要开发者自行编写 Channel，那是非常麻烦的。</p>\n<p class=\"feishu-p\">我们特别提供了 mpflutter_wechat_api 库，这个库提供了 Dart 的调用封装，你不需要编写任何 JavaScript 代码就可以调用微信 API。</p>\n<p class=\"feishu-p\">添加以下依赖到 pubspec.yaml 就可以使用了：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\">dependencies:\n  mpflutter_wechat_api: {请自行替换成最新版本号}</code></pre>\n</div>\n<h3 id=\"heading-wechat_api-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-wechat_api-3\" class=\"heading-anchor\">#</a>示例代码</h3>\n<p class=\"feishu-p\">对于同步返回方法，你可以直接获取结果。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wechat_api/mpflutter_wechat_api.dart&#x27;;\n\nfinal result = wx.getSystemInfoSync();\nprint(result.model);</code></pre>\n</div>\n<p class=\"feishu-p\">对于异步返回方法以及带参数的方法，你需要使用 .. 的方法设置 Option 参数。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wechat_api/mpflutter_wechat_api.dart&#x27;;\n\nwx.getSystemInfoAsync(GetSystemInfoAsyncOption()\n      ..success = (result) {\n        final snackBar = SnackBar(\n          content: Text(&#x27;Device model = ${result.model}&#x27;),\n        );\n        ScaffoldMessenger.of(context).showSnackBar(snackBar);\n      });</code></pre>\n</div>\n<p class=\"feishu-p\">Option 的类总是与方法配对提供的，例如 <code class=\"inline-code\">getSystemInfoAsync</code> 对应的就是 <code class=\"inline-code\">GetSystemInfoAsyncOption</code>。</p>\n","headings":[{"id":"heading-wechat_api-1","title":"6.2 微信小程序 API 封装库 (mpflutter_wechat_api)","level":2},{"id":"heading-wechat_api-2","title":"封装库","level":3},{"id":"heading-wechat_api-3","title":"示例代码","level":3}],"wordCount":84,"readTime":5,"file":"微信小程序平台特性_微信小程序 API 封装库_KAs6wdMfRiQ1Y0kGB5CcxzMgntc.html"},{"id":"platform_view","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"Platform View 原生视图组件","icon":"🖼️","date":"2024年7月9日","html":"\n<h2 id=\"heading-platform_view-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-platform_view-1\" class=\"heading-anchor\">#</a>6.3 Platform View 原生视图组件</h2>\n\n\n<p class=\"feishu-p\">MPFlutter CanvasKit 只负责 Flutter Widgets 渲染，对于特定平台的组件则需要使用 PlatformView 渲染。</p>\n\n\n<p class=\"feishu-p\">PlatformView 的实现，实际上就是在 Canvas 的最上方覆盖一个原生视图，并且该视图跟随 Shadow Widget 移动。</p>\n\n\n<p class=\"feishu-p\">PlatformView 有以下能力限制：</p>\n\n<ul class=\"feishu-ul\">\n<li>层级最高，无法在 PlatformView 上叠加任何视图。</li>\n<li>跟随移动不及时，Shadow Widget 的移动与 PlatformView 不完全同步，因此建议你不要在 ScrollView 中使用。</li>\n<li>不建议在 ListView 的每一个 ListItem 中添加 PlatformView，过多的 PlatformView 会影响性能，请使用其它替代方式使用。</li>\n</ul>\n\n<p class=\"feishu-p\">官方已支持的 PlatformView：</p>\n\n<ul class=\"feishu-ul\">\n<li><a href=\"https://mpflutter.feishu.cn/wiki/QIlpwxyb1iiCqlkMSDvcY219nNc\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">MapView</a></li>\n<li><a href=\"https://mpflutter.feishu.cn/wiki/SVt5wK7GEiKgvDk3WOCcE20Bnge\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">VideoView</a></li>\n<li><a href=\"https://mpflutter.feishu.cn/wiki/Kk5YwA07ziP7ezklvcMcrMh6nye\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">WebView</a></li>\n<li><a href=\"https://mpflutter.feishu.cn/wiki/T4ITw9uUKiWCb7kD0knc7FNenme\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Button</a></li>\n<li><a href=\"https://mpflutter.feishu.cn/wiki/YWIMwKyzriS685k0PuxceYTjnke\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Image</a></li>\n<li><a href=\"https://mpflutter.feishu.cn/wiki/EwzjwLJUyiwu4GkNXB5cCCJxnMb\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Editable</a></li>\n</ul>\n\n<p class=\"feishu-p\">官方未支持的：</p>\n\n<ul class=\"feishu-ul\">\n<li>Camara</li>\n<li>Ad</li>\n</ul>\n\n<hr class=\"feishu-hr\" />\n\n\n","headings":[{"id":"heading-platform_view-1","title":"6.3 Platform View 原生视图组件","level":2}],"wordCount":485,"readTime":1,"file":"微信小程序平台特性_Platform View_SBAGwVMiVig6aok7EYYcsYKZnoM.html"},{"id":"platform_view_overlay","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"Platform View Overlay 全屏覆盖方案","icon":"📑","date":"2024年7月9日","html":"<h2 id=\"heading-platform_view_overlay-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-platform_view_overlay-1\" class=\"heading-anchor\">#</a>6.4 Platform View Overlay 全屏覆盖方案</h2>\n<blockquote class=\"feishu-blockquote\">\n<p class=\"feishu-p\">该特性要求使用 2.7.0+ 版本</p>\n<p class=\"feishu-p\">Platform View 默认是不支持在其上方添加任何 Flutter Widget 的，因为 Platform View 的层级最高。</p>\n<p class=\"feishu-p\">但是，这会导致地图应用难以使用 MPFlutter 开发。</p>\n<p class=\"feishu-p\">为此，官方特别提供 Overlay 方案，原理是通过将 Scaffold 的背景变成透明，将 Platform View 置于画布最下方实现的。</p>\n</blockquote>\n<h3 id=\"heading-platform_view_overlay-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-platform_view_overlay-2\" class=\"heading-anchor\">#</a>用法</h3>\n<p class=\"feishu-p\">请参考以下代码开发。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:flutter/material.dart&#x27;;\nimport &#x27;package:mpflutter_core/mpflutter_core.dart&#x27;;\nimport &#x27;package:mpflutter_wechat_api/mpflutter_wechat_api.dart&#x27;;\nimport &#x27;package:mpflutter_wechat_mapview/mpflutter_wechat_mapview.dart&#x27;;\n\nclass WXMapView extends StatefulWidget {\n  const WXMapView({super.key});\n\n  @override\n  State&lt;WXMapView&gt; createState() =&gt; _WXMapViewState();\n}\n\nclass _WXMapViewState extends State&lt;WXMapView&gt; {\n  final controller = MPFlutter_Wechat_MapViewController();\n  String selectedAddress = &quot;&quot;;\n\n  @override\n  Widget build(BuildContext context) {\n    return MPFlutterPlatformOverlaySupport( // 使用 MPFlutterPlatformOverlaySupport 包裹 Scaffold\n      child: Scaffold(\n        backgroundColor: Colors.transparent, // Scaffold 的背景必须是透明的\n        appBar: AppBar(\n          title: const Text(&#x27;WXMapView&#x27;),\n        ),\n        body: Stack( // 使用 Stack 布局地图和 Overlay Widgets\n          children: [\n            Positioned.fill(\n              child: MPFlutter_Wechat_MapView(\n                controller: controller,\n                longitude: 113.347698,\n                latitude: 23.100022,\n                showLocation: true,\n                markers: const [\n                  {\n                    &quot;id&quot;: &quot;HeJi&quot;,\n                    &quot;title&quot;: &quot;赫基大厦&quot;,\n                    &quot;longitude&quot;: 113.347698,\n                    &quot;latitude&quot;: 23.100022,\n                  },\n                  {\n                    &quot;id&quot;: &quot;WeChat&quot;,\n                    &quot;title&quot;: &quot;微信总部&quot;,\n                    &quot;longitude&quot;: 113.324560,\n                    &quot;latitude&quot;: 23.100100,\n                  }\n                ],\n                onMarkerTap: (detail) {\n                  setState(() {\n                    selectedAddress = detail[&quot;markerId&quot;];\n                  });\n                },\n              ),\n            ),\n            Positioned(\n              left: 20,\n              right: 20,\n              bottom: 20,\n              height: 300,\n              child: MPFlutterPlatformOverlay( // 在需要悬浮的界面上使用 MPFlutterPlatformOverlay 包裹\n                child: ClipRRect(\n                  borderRadius: BorderRadius.circular(24),\n                  child: Container(\n                    color: Colors.white,\n                    child: ListView(\n                      children: [\n                        ListTile(\n                          title: Text(&#x27;当前选中的地点是: $selectedAddress&#x27;),\n                        ),\n                        const Divider(),\n                        ListTile(\n                          title: const Text(&#x27;To &gt; 微信总部&#x27;),\n                          onTap: () {\n                            final mapContext = controller.getMapContext();\n                            if (mapContext != null) {\n                              mapContext.moveToLocation(\n                                MoveToLocationOption()\n                                  ..latitude = 23.100100\n                                  ..longitude = 113.324560,\n                              );\n                            }\n                          },\n                        ),\n                        const Divider(),\n                        ListTile(\n                          title: const Text(&#x27;Include Points&#x27;),\n                          onTap: () {\n                            final mapContext = controller.getMapContext();\n                            if (mapContext != null) {\n                              mapContext.includePoints(\n                                IncludePointsOption()\n                                  ..points = [\n                                    MapPostion()\n                                      ..latitude = 23.100100\n                                      ..longitude = 113.324560,\n                                    MapPostion()\n                                      ..latitude = 23.100022\n                                      ..longitude = 113.347698,\n                                  ]\n                                  ..fail = (result) {\n                                    print(result.errMsg);\n                                  },\n                              );\n                            }\n                          },\n                        ),\n                        const Divider(),\n                        ListTile(\n                          title: const Text(&#x27;To &gt; Image&#x27;),\n                          onTap: () {\n                            Navigator.of(context).pushNamed(&#x27;/ext/wx_image&#x27;);\n                          },\n                        ),\n                      ],\n                    ),\n                  ),\n                ),\n              ),\n            )\n          ],\n        ),\n      ),\n    );\n  }\n\n}\n</code></pre>\n</div>\n","headings":[{"id":"heading-platform_view_overlay-1","title":"6.4 Platform View Overlay 全屏覆盖方案","level":2},{"id":"heading-platform_view_overlay-2","title":"用法","level":3}],"wordCount":289,"readTime":7,"file":"微信小程序平台特性_Platform View Overlay_DUPFwi89nixeQ7k4D28cmboWnog.html"},{"id":"share","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"分享到会话、朋友圈与单页模式","icon":"🔗","date":"2024年3月10日","html":"<h2 id=\"heading-share-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-share-1\" class=\"heading-anchor\">#</a>6.5 分享到会话、朋友圈与单页模式</h2>\n<h3 id=\"heading-share-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-share-2\" class=\"heading-anchor\">#</a>分享到会话</h3>\n<p class=\"feishu-p\">我们是根据微信官方提供的 onShareAppMessage 回调实现的，如有疑问请先阅读官方文档。</p>\n<h4 id=\"heading-share-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-share-3\" class=\"heading-anchor\">#</a>方法一、直接使用 MPFlutterWechatAppDelegate 类</h4>\n<p class=\"feishu-p\">MPFlutterWechatAppDelegate 类用于封装来自微信小程序的生命周期事件，你可以在这里得到小程序切后台、切前台、从分享卡片进入等回调。</p>\n<p class=\"feishu-p\">onShareAppMessage 封装在这个类中，你可以直接在 onShareAppMessage 中返回符合微信官方要求的字段，并且在  onLaunch / onEnter 中响应用户路由。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">class MyAppDelegate {\n  late MPFlutterWechatAppDelegate appDelegate;\n\n  MyAppDelegate() {\n    appDelegate = MPFlutterWechatAppDelegate(\n      onShareAppMessage: (detail) {\n        print(&quot;当用户点击分享给朋友时，回调，应组装对应的 Map 信息，用于展示和回跳。&quot;);\n        return onShareAppMessage(detail);\n      },\n      // 如果你需要异步返回 shareAppMessage 结果，请使用这个回调。\n      // 你最多只有 3 秒时间处理异步请求。\n      // onShareAppMessageAsync: (detail, callback) async {\n      //   await Future.delayed(const Duration(milliseconds: 1500));\n      //   callback({\n      //     &quot;title&quot;: &quot;delay&quot;,\n      //     &quot;path&quot;: &quot;pages/index/index&quot;,\n      //   });\n      // },\n      onLaunch: (query) async {\n        print(&quot;应用冷启动时，会收到回调，应根据 query 决定是否要跳转页面。&quot;);\n        await Future.delayed(Duration(seconds: 1)); // 加个延时，保障 navigator 已初始化。\n        onLaunchOrEnter(query);\n      },\n      onEnter: (query) {\n        print(&quot;应用热启动（例如用户从分享卡片进入小程序）时，会收到回调，应根据 query 决定是否要跳转页面。&quot;);\n        onLaunchOrEnter(query);\n      },\n    );\n  }\n\n  Map onShareAppMessage(mpjs.JSObject detail) {\n    final currentRoute = MPNavigatorObserver.currentRoute;\n    if (currentRoute != null) {\n      final routeName = currentRoute.settings.name;\n      return {\n        &quot;title&quot;: (() {\n          if (routeName == &quot;/map_demo&quot;) {\n            return &quot;Map Demo&quot;;\n          } else {\n            return &quot;Awesome Project&quot;;\n          }\n        })(),\n        &quot;path&quot;:\n            &quot;pages/index/index?routeName=${routeName}&quot;, // 这个 query 会在 onLaunch 和 onEnter 中带回来。\n      };\n    } else {\n      return {};\n    }\n  }\n\n  void onLaunchOrEnter(Map query) {\n    final navigator = MPNavigatorObserver.currentRoute?.navigator;\n    if (navigator != null) {\n      final routeName = query[&quot;routeName&quot;];\n      if (routeName == &quot;/map_demo&quot;) {\n        navigator.pushNamed(&quot;/map_demo&quot;);\n      }\n    }\n  }\n}</code></pre>\n</div>\n<h4 id=\"heading-share-4\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-share-4\" class=\"heading-anchor\">#</a>方法二、结合 MPFlutterWechatAppShareManager 类</h4>\n<p class=\"feishu-p\">使用方法一比较灵活，也比较繁琐，特提供 MPFlutterWechatAppShareManager 类。</p>\n<p class=\"feishu-p\">该类主要提供两个能力：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">设置当前页面（Scaffold）的分享信息</li>\n    <li class=\"feishu-li\">响应 onShareAppMessage 回调，自动拼装分享信息</li>\n</ul>\n<p class=\"feishu-p\">使用方法：</p>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">在需要设置分享信息的页面，使用 <code class=\"inline-code\">MPFlutterWechatAppShareManager.setAppShareInfo</code> 设置。</li>\n</ol>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:flutter/material.dart&#x27;;\nimport &#x27;package:mpflutter_core/mpflutter_core.dart&#x27;;\nimport &#x27;package:mpflutter_wechat_mapview/mpflutter_wechat_mapview.dart&#x27;;\n\nclass WXMapView extends StatefulWidget {\n  const WXMapView({super.key});\n\n  @override\n  State&lt;WXMapView&gt; createState() =&gt; _WXMapViewState();\n}\n\nclass _WXMapViewState extends State&lt;WXMapView&gt; {\n  final controller = MPFlutter_Wechat_MapViewController();\n  String selectedAddress = &quot;&quot;;\n\n  @override\n  void didChangeDependencies() {\n    super.didChangeDependencies();\n    MPFlutterWechatAppShareManager.setAppShareInfo(\n      context: context,\n      title: &quot;Map Demo&quot;,\n      query: {&quot;routeName&quot;: &quot;/map_demo&quot;},\n    );\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      // ......\n    );\n  }\n}\n</code></pre>\n</div>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">在 onShareAppMessage 回调，使用 <code class=\"inline-code\">MPFlutterWechatAppShareManager.onShareAppMessage</code> 返回信息。</li>\n</ol>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">class MyAppDelegate {\n  late MPFlutterWechatAppDelegate appDelegate;\n\n  MyAppDelegate() {\n    appDelegate = MPFlutterWechatAppDelegate(\n      onShareAppMessage: (detail) {\n        print(&quot;当用户点击分享给朋友时，回调，应组装对应的 Map 信息，用于展示和回跳。&quot;);\n        return onShareAppMessage(detail);\n      },\n      onLaunch: (query) async {\n        print(&quot;应用冷启动时，会收到回调，应根据 query 决定是否要跳转页面。&quot;);\n        await Future.delayed(Duration(seconds: 1)); // 加个延时，保障 navigator 已初始化。\n        onLaunchOrEnter(query);\n      },\n      onEnter: (query) {\n        print(&quot;应用热启动（例如用户从分享卡片进入小程序）时，会收到回调，应根据 query 决定是否要跳转页面。&quot;);\n        onLaunchOrEnter(query);\n      },\n    );\n  }\n\n  Map onShareAppMessage(mpjs.JSObject detail) {\n    return MPFlutterWechatAppShareManager.onShareAppMessage(detail);\n  }\n\n  void onLaunchOrEnter(Map query) {\n    final navigator = MPNavigatorObserver.currentRoute?.navigator;\n    if (navigator != null) {\n      final routeName = query[&quot;routeName&quot;];\n      if (routeName == &quot;/map_demo&quot;) {\n        navigator.pushNamed(&quot;/map_demo&quot;);\n      }\n    }\n  }\n}</code></pre>\n</div>\n<p class=\"feishu-p\">你也可以将方法一、方法二，结合使用。</p>\n<h3 id=\"heading-share-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-share-5\" class=\"heading-anchor\">#</a>分享到朋友圈</h3>\n<blockquote class=\"feishu-blockquote\">\n<p class=\"feishu-p\">已支持，要求 MPFlutter 2.1.0 版本。</p>\n<p class=\"feishu-p\">使用 MPFlutterWechatAppDelegate 其中的 onShareTimeline 可以实现分享朋友圈能力。</p>\n<p class=\"feishu-p\">朋友圈点击进入的小程序是单页模式，请参考 《单页模式适配》开发。</p>\n</blockquote>\n<h4 id=\"heading-share-6\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-share-6\" class=\"heading-anchor\">#</a>单页模式适配</h4>\n<p class=\"feishu-p\">在 app.json 添加 singlePage 配置，这样可以保证页面布局在单页模式下正常。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">json</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-json\">&quot;singlePage&quot;: {\n    &quot;navigationBarFit&quot;: &quot;squeezed&quot;\n},</code></pre>\n</div>\n<p class=\"feishu-p\">在 MPFlutterWechatAppDelegate 的 onLaunch 中响应 1154（单页模式）场景值，然后路由到对应页面，并隐藏 AppBar。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">code</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-text\">void _onLaunchEnter(query, options) {\n    final isSinglePage = options[&quot;scene&quot;] == 1154;\n    if (isSinglePage) {\n      AppParams.isSinglePage = true; // 在这里设置了一个全局变量，所有的子页面通过该变量决定是否需要显示 AppBar。\n      if (query.isNotEmpty) {\n        if (query[&quot;routeName&quot;] == &quot;/ui_infinite_listview&quot;) {\n          Navigator.of(context).pushReplacementNamed(&quot;/ui_infinite_listview&quot;);\n        }\n      }\n    } else {\n      if (query.isNotEmpty) {\n        if (query[&quot;routeName&quot;] == &quot;/ui_infinite_listview&quot;) {\n          Navigator.of(context).pushNamed(&quot;/ui_infinite_listview&quot;);\n        }\n      }\n    }\n}</code></pre>\n</div>\n<h3 id=\"heading-share-7\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-share-7\" class=\"heading-anchor\">#</a>收藏</h3>\n<blockquote class=\"feishu-blockquote\">\n<p class=\"feishu-p\">已支持，要求 MPFlutter 2.1.0 版本。</p>\n<p class=\"feishu-p\">使用 MPFlutterWechatAppDelegate 其中的 onAddToFavorites 可以实现收藏能力。</p>\n</blockquote>\n<h3 id=\"heading-share-8\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-share-8\" class=\"heading-anchor\">#</a>禁止分享、收藏</h3>\n<blockquote class=\"feishu-blockquote\">\n<p class=\"feishu-p\">已支持，要求 MPFlutter 2.1.0 版本。</p>\n<p class=\"feishu-p\">部分应用不希望被用户转发分享，可以通过在 <code class=\"inline-code\">scripts/build_wechat.dart</code> 添加构建配置实现。</p>\n</blockquote>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_build_tools/main.dart&#x27; as build_tools;\n\nvoid main(List&lt;String&gt; arguments) async {\n  final buildArgs = [...arguments]..add(&#x27;--wechat&#x27;);\n  build_tools.disableFeature(&quot;wechat_share_app_message&quot;); // 禁止分享到会话\n  build_tools.disableFeature(&quot;wechat_share_timeline&quot;); // 禁止分享到朋友圈\n  build_tools.disableFeature(&quot;wechat_add_to_favorites&quot;); // 禁止收藏\n  build_tools.main(buildArgs);\n}\n</code></pre>\n</div>\n","headings":[{"id":"heading-share-1","title":"6.5 分享到会话、朋友圈与单页模式","level":2},{"id":"heading-share-2","title":"分享到会话","level":3},{"id":"heading-share-3","title":"方法一、直接使用 MPFlutterWechatAppDelegate 类","level":4},{"id":"heading-share-4","title":"方法二、结合 MPFlutterWechatAppShareManager 类","level":4},{"id":"heading-share-5","title":"分享到朋友圈","level":3},{"id":"heading-share-6","title":"单页模式适配","level":4},{"id":"heading-share-7","title":"收藏","level":3},{"id":"heading-share-8","title":"禁止分享、收藏","level":3}],"wordCount":478,"readTime":6,"file":"微信小程序平台特性_分享到会话、朋友圈_KDWRwdmnQiuqkokcWKmc3ig2nKg.html"},{"id":"custom_wechat_pkg","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"自制微信小程序 Package 指南","icon":"📦","date":"2024年3月10日","html":"<h2 id=\"heading-custom_wechat_pkg-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-custom_wechat_pkg-1\" class=\"heading-anchor\">#</a>6.6 自制微信小程序 Package 指南</h2>\n<p class=\"feishu-p\">如果本文档提供的 mpflutter_wechat_api 和 Platform View 不能满足你的需要，你可以通过自制 Package 实现个性化能力。</p>\n<p class=\"feishu-p\">一个 MPFlutter Plugin 和普通的 Flutter Plugin 没有本质上的区别，它们都可以上传到 pub.dev。</p>\n<p class=\"feishu-p\">Package Name 必须以  mpflutter_wechat_ 开头，否则相关 JS 和 WXML 产物不会被打包到小程序中。</p>\n<h3 id=\"heading-custom_wechat_pkg-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-custom_wechat_pkg-2\" class=\"heading-anchor\">#</a>Simple Plugin</h3>\n<p class=\"feishu-p\">这是一种可通过 Dart 调用 JavaScript 的插件，它不包含任何界面逻辑。</p>\n<p class=\"feishu-p\">从以下模板工程开始开发：</p>\n<div class=\"file-card\" style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(0,0,0,0.03);border:1px solid rgba(0,0,0,0.08);border-radius:8px;margin:12px 0;\">\n    <div class=\"file-icon\" style=\"font-size:24px;\">📦</div>\n    <div class=\"file-info\">\n        <div class=\"file-name\" style=\"font-weight:600;color:var(--text-color, #222);\">awesome_mpflutter_package.zip</div>\n        <div class=\"file-size\" style=\"font-size:12px;color:var(--text-secondary, #666);\">13.8 KB（工程配套附件模板）</div>\n    </div>\n</div>\n<h4 id=\"heading-custom_wechat_pkg-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-custom_wechat_pkg-3\" class=\"heading-anchor\">#</a>源码解读</h4>\n<p class=\"feishu-p\"><strong>mpflutter_wechat_awesome_package.dart</strong></p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_core/mpjs/mpjs.dart&#x27; as mpjs;\n\nclass MPFlutter_Wechat_AwesomePackage {\n  MPFlutter_Wechat_AwesomePackage();\n\n  void sayHello() {\n    final newObjectFromJavaScript = mpjs.JSObject(\n      &quot;MPFlutter_Wechat_AwesomePackage&quot;,\n    );\n    final returnValue = newObjectFromJavaScript.callMethod(\n      &quot;sayHello&quot;,\n      [&quot;Pony&quot;], // 也可以传入 Function 到 JS 环境用于回调，例如 [(String arg1) { print(arg1); }]\n    );\n    print(&#x27;value from javascripot&#x27; + returnValue);\n  }\n}\n</code></pre>\n</div>\n<p class=\"feishu-p\">mpjs 是由 MPFlutter 提供的 JavaScript FFI 封装，使用 mpjs 可以很方便地访问 JS 上下文。</p>\n<p class=\"feishu-p\">在这里：</p>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">通过 new mpjs.JSObject 创建一个来自于 JavaScript 环境的对象</li>\n    <li class=\"feishu-li\">调用该对象的 sayHello 方法，参数为 Pony。</li>\n    <li class=\"feishu-li\">获取 sayHello 的返回值，并打印。</li>\n</ol>\n<p class=\"feishu-p\"><strong>wechat/main.js</strong></p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">class MPFlutter_Wechat_AwesomePackage {\n  sayHello(to) {\n    if (to) {\n      console.log(`Hello, ${to}!`);\n    } else {\n      console.log(&quot;Hello, world!&quot;);\n    }\n    return &quot;你好&quot;;\n  }\n}\n\nwx.MPFlutter_Wechat_AwesomePackage = MPFlutter_Wechat_AwesomePackage;\n</code></pre>\n</div>\n<p class=\"feishu-p\">在这个 js 文件中，我们具体定义了这个 JavaScript 的实现，并使其挂载到 wx 对象中。</p>\n<p class=\"feishu-p\">这样，我们就完成一个 Simple Plugin 了。</p>\n<h4 id=\"heading-custom_wechat_pkg-4\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-custom_wechat_pkg-4\" class=\"heading-anchor\">#</a>在工程中使用</h4>\n<p class=\"feishu-p\">首先，你需要在 pubspec.yaml 中引入这个 Plugin。</p>\n<p class=\"feishu-p\">然后，在需要调用的地方直接调用 Dart 代码就可以了。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wechat_awesome_package/mpflutter_wechat_awesome_package.dart&#x27;;\n\nMPFlutter_Wechat_AwesomePackage().sayHello();</code></pre>\n</div>\n<h4 id=\"heading-custom_wechat_pkg-5\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-custom_wechat_pkg-5\" class=\"heading-anchor\">#</a>后续</h4>\n<p class=\"feishu-p\">修改 <code class=\"inline-code\">pubspec.yaml</code> 中的 <code class=\"inline-code\">name</code> 以及 <code class=\"inline-code\">lib/mpflutter_wechat_awesome_package.dart</code> 为自己的 package name。</p>\n<p class=\"feishu-p\">wechat 目录，wechat 目录下的 main.js 和 main.wxml ，文件夹名和文件名不能被修改。</p>\n<h4 id=\"heading-custom_wechat_pkg-6\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-custom_wechat_pkg-6\" class=\"heading-anchor\">#</a>发布</h4>\n<p class=\"feishu-p\">如果需要发布到公域，使用 <code class=\"inline-code\">flutter pub publish</code> 发布即可。</p>\n<h3 id=\"heading-custom_wechat_pkg-7\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-custom_wechat_pkg-7\" class=\"heading-anchor\">#</a>PlatformView Plugin</h3>\n<p class=\"feishu-p\">这是一种可用于显示微信小程序视图的 Flutter Plugin，它是使用 《<a href=\"#platform_view\" onclick=\"switchArticle('platform_view')\">Platform View</a>》  实现的。</p>\n<p class=\"feishu-p\">从以下模板工程开始开发：</p>\n<div class=\"file-card\" style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(0,0,0,0.03);border:1px solid rgba(0,0,0,0.08);border-radius:8px;margin:12px 0;\">\n    <div class=\"file-icon\" style=\"font-size:24px;\">📦</div>\n    <div class=\"file-info\">\n        <div class=\"file-name\" style=\"font-weight:600;color:var(--text-color, #222);\">awesome_mpflutter_platformview_package.zip</div>\n        <div class=\"file-size\" style=\"font-size:12px;color:var(--text-secondary, #666);\">14.7 KB（工程配套附件模板）</div>\n    </div>\n</div>\n<h4 id=\"heading-custom_wechat_pkg-8\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-custom_wechat_pkg-8\" class=\"heading-anchor\">#</a>源码解读</h4>\n<p class=\"feishu-p\"><strong>mpflutter_wechat_platformview_package.dart</strong></p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:flutter/material.dart&#x27;;\nimport &#x27;package:mpflutter_core/mpflutter_core.dart&#x27;;\nimport &#x27;package:mpflutter_core/mpjs/mpjs.dart&#x27; as mpjs;\n\nclass MPFlutter_Wechat_SimpleView extends StatelessWidget {\n  final String backgroundColor;\n  final Function(mpjs.JSObject)? onTap;\n\n  MPFlutter_Wechat_SimpleView({\n    this.backgroundColor = &quot;blue&quot;,\n    this.onTap,\n  });\n\n  @override\n  Widget build(BuildContext context) {\n    return MPFlutterPlatformView(\n      viewClazz: &quot;MPFlutter_Wechat_SimpleView&quot;,\n      viewProps: {\n        &quot;backgroundColor&quot;: backgroundColor,\n      },\n      eventCallback: (originEvent, detail) {\n        final event = originEvent.toLowerCase();\n        switch (event) {\n          case &quot;tap&quot;:\n            onTap?.call(detail);\n            break;\n          default:\n            break;\n        }\n      },\n    );\n  }\n}\n</code></pre>\n</div>\n<p class=\"feishu-p\">我们定义了一个 Widget，并在其中包裹了一个 <code class=\"inline-code\">MPFlutterPlatformView</code>，它的参数用途如下：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">viewClazz - 对应 wxml 中的 Block Name</li>\n    <li class=\"feishu-li\">viewProps - 在 wxml 中可以使用 item.props.abc 获取到其中的值</li>\n    <li class=\"feishu-li\">eventCallback - 接收来自 wxml 的回调</li>\n</ul>\n<p class=\"feishu-p\"><strong>main.wxml</strong></p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">html</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-html\">&lt;block wx:for=&quot;{{MPFlutter_Wechat_SimpleView_Block}}&quot; wx:key=&quot;pvid&quot;&gt;\n    &lt;view wx:if=&quot;{{!item.removed}}&quot; style=&quot;{{item.wrapper}}&quot;&gt;\n        &lt;view id=&quot;{{item.pvid}}&quot; style=&quot;{{item.style}};background-color:{{item.props.backgroundColor}};&quot; bindtap=&quot;onPVCB&quot;&gt;&lt;/view&gt;\n    &lt;/view&gt;\n&lt;/block&gt;</code></pre>\n</div>\n<p class=\"feishu-p\">这里是定义 viewClazz = MPFlutter_Wechat_SimpleView 的 wxml 实现。</p>\n<p class=\"feishu-p\">你应修改 block 中的 wx:for 为你的 <strong>viewClazz</strong>_Block，然后修改第 3 行中的 view 为你的目标微信小程序视图组件。</p>\n<p class=\"feishu-p\">第 3 行中的 view 其中的 id,style 需要保持原样，所有的 bindxxx 都定义为 onPVCB。</p>\n<h4 id=\"heading-custom_wechat_pkg-9\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-custom_wechat_pkg-9\" class=\"heading-anchor\">#</a>在工程中使用</h4>\n<p class=\"feishu-p\">在 pubspec.yaml 中引入这个 Plugin。</p>\n<p class=\"feishu-p\">然后，在需要调用的地方直接调用 Dart 代码就可以了。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">Widget build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(\n        title: const Text(&#x27;WXSimpleView&#x27;),\n      ),\n      body: Center(\n        child: SizedBox(\n          width: 200,\n          height: 200,\n          child: MPFlutter_Wechat_SimpleView(\n            backgroundColor: &quot;blue&quot;,\n            onTap: (detail) {\n              // handle tap event\n            },\n          ),\n        ),\n      ),\n    );\n}</code></pre>\n</div>\n","headings":[{"id":"heading-custom_wechat_pkg-1","title":"6.6 自制微信小程序 Package 指南","level":2},{"id":"heading-custom_wechat_pkg-2","title":"Simple Plugin","level":3},{"id":"heading-custom_wechat_pkg-3","title":"源码解读","level":4},{"id":"heading-custom_wechat_pkg-4","title":"在工程中使用","level":4},{"id":"heading-custom_wechat_pkg-5","title":"后续","level":4},{"id":"heading-custom_wechat_pkg-6","title":"发布","level":4},{"id":"heading-custom_wechat_pkg-7","title":"PlatformView Plugin","level":3},{"id":"heading-custom_wechat_pkg-8","title":"源码解读","level":4},{"id":"heading-custom_wechat_pkg-9","title":"在工程中使用","level":4}],"wordCount":387,"readTime":5,"file":"微信小程序平台特性_自制微信小程序 Package_Oc9Kw42X5i8naHkNeo8c6JKGnPc.html"},{"id":"audioplayers","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"audioplayers 音频播放适配","icon":"🎵","date":"2024年3月10日","html":"\n<h2 id=\"heading-audioplayers-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-audioplayers-1\" class=\"heading-anchor\">#</a>6.7 audioplayers 音频播放适配</h2>\n\n\n<p class=\"feishu-p\">MPFlutter 已完成对 audioplayers 库的适配工作，你可以在微信小程序、微信小游戏中使用 audioplayers 库进行音频播放操作。</p>\n\n\n<p class=\"feishu-p\">只需要在 pubspec.yaml 中添加以下依赖就可以：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">\n  audioplayers: ^5.2.0\n\n\n\n      url: https://github.com/mpflutter/audioplayers.git\n      ref: mpflutter-v5.2.1\n      path: packages/audioplayers_web</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">具体 audioplayers 用法请参考 <a href=\"https://github.com/bluefireteam/audioplayers\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://github.com/bluefireteam/audioplayers</a></p>\n\n\n\n<h4 id=\"heading-audioplayers-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-audioplayers-2\" class=\"heading-anchor\">#</a>InnerAudio</h4>\n\n\n<p class=\"feishu-p\">MPFlutter 针对 audioplayers 的实现是使用 WebAudio API 的，WebAudio API 已知可能造成内存泄漏，是微信小程序的问题。</p>\n\n\n<p class=\"feishu-p\">开源社区有基于 <a href=\"https://developers.weixin.qq.com/miniprogram/dev/api/media/audio/InnerAudioContext.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">InnerAudio</a> 的封装，建议优先使用。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">\n  audioplayers: ^5.2.0\n\n\n\n      url: https://github.com/swiftdo/audioplayers.git\n      ref: mpflutter-v5.2.1-inner\n      path: packages/audioplayers_web</code></pre>\n                </div>\n\n\n\n<h4 id=\"heading-audioplayers-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-audioplayers-3\" class=\"heading-anchor\">#</a>静音状态</h4>\n\n\n<p class=\"feishu-p\">默认情况，小程序的声音会遵循设备的静音设置，如果你需要在静音的情况下播放声音，可以调用以下微信 API。</p>\n\n\n<p class=\"feishu-p\"><a href=\"https://developers.weixin.qq.com/miniprogram/dev/api/media/audio/wx.setInnerAudioOption.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://developers.weixin.qq.com/miniprogram/dev/api/media/audio/wx.setInnerAudioOption.html</a></p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n","headings":[{"id":"heading-audioplayers-1","title":"6.7 audioplayers 音频播放适配","level":2},{"id":"heading-audioplayers-2","title":"InnerAudio","level":4},{"id":"heading-audioplayers-3","title":"静音状态","level":4}],"wordCount":1256,"readTime":4,"file":"微信小程序平台特性_audioplayers_GMMYwi7LLiiO27kG1Z1cw0SPnXg.html"},{"id":"splash","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"Splash 闪屏机制与配置","icon":"✨","date":"2024年3月10日","html":"\n<h2 id=\"heading-splash-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-splash-1\" class=\"heading-anchor\">#</a>6.8 Splash 闪屏机制与配置</h2>\n\n\n\n<h4 id=\"heading-splash-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-splash-2\" class=\"heading-anchor\">#</a>为什么需要闪屏</h4>\n\n\n<p class=\"feishu-p\">闪屏主要用于小程序冷启动时，避免用户看到白屏而存在的。</p>\n\n\n<p class=\"feishu-p\">为什么用户会看到白屏？</p>\n\n<ul class=\"feishu-ul\">\n<li>Canvas 以及 CanvasKit 的初始化，需要一定时间。</li>\n<li>Flutter Framework 启动过程中，需要初始化各种依赖。</li>\n<li>分包加载过程，需要从远端下载资源、代码。</li>\n</ul>\n\n\n<h4 id=\"heading-splash-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-splash-3\" class=\"heading-anchor\">#</a>闪屏的展示、隐藏逻辑</h4>\n\n\n<p class=\"feishu-p\">默认的闪屏会在冷启动时展示，在 runMPApp 后隐藏。</p>\n\n\n<p class=\"feishu-p\">你可以通过 MPFlutterSplashManager 进一步控制闪屏的展示、隐藏时机。</p>\n\n\n\n<h4 id=\"heading-splash-4\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-splash-4\" class=\"heading-anchor\">#</a>自定义闪屏内容</h4>\n\n\n<p class=\"feishu-p\">默认的闪屏是一个无限循环的 Loading 图标。</p>\n\n\n<p class=\"feishu-p\">你可以通过修改 wechat/pages/index/splash.wxml 中的代码，自定义闪屏内容。</p>\n\n\n<p class=\"feishu-p\">这需要一定的原生小程序开发知识。</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n","headings":[{"id":"heading-splash-1","title":"6.8 Splash 闪屏机制与配置","level":2},{"id":"heading-splash-2","title":"为什么需要闪屏","level":4},{"id":"heading-splash-3","title":"闪屏的展示、隐藏逻辑","level":4},{"id":"heading-splash-4","title":"自定义闪屏内容","level":4}],"wordCount":382,"readTime":1,"file":"微信小程序平台特性_Splash 闪屏_Rjlwwd3Puib14tkeToIcbUsRnwg.html"},{"id":"tap_request","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"Tap Request 用户手势限制问题","icon":"👆","date":"2024年3月10日","html":"<h2 id=\"heading-tap_request-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-tap_request-1\" class=\"heading-anchor\">#</a>6.9 Tap Request 用户手势限制问题</h2>\n<blockquote class=\"feishu-blockquote\">\n<p class=\"feishu-p\">要求 mpflutter_wechat_button 0.0.3 以上版本</p>\n<p class=\"feishu-p\">微信小程序出于安全考虑，对于部分 API 是要求用户 Tap 以后才允许触发的。</p>\n<p class=\"feishu-p\">例如 <code class=\"inline-code\">wx.requestSubscribeMessage</code> 这个 API，如果是非 Tap 触发则会报 <code class=\"inline-code\">fail can only be invoked by user TAP gesture</code> 错误。</p>\n</blockquote>\n<h4 id=\"heading-tap_request-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-tap_request-2\" class=\"heading-anchor\">#</a>解决方案</h4>\n<p class=\"feishu-p\">使用 Platform View Button 组件可以解决问题，需要在 onTap 回调中立刻调用对应 API。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wechat_button/mpflutter_wechat_button.dart&#x27;;\n\nMPFlutter_Wechat_Button(\n  onTap: (_) {\n    wx.requestSubscribeMessage(\n      RequestSubscribeMessageOption()\n        ..tmplIds = [&quot;123&quot;]\n        ..success = (result) {\n          print(&#x27;success&#x27;);\n        }\n        ..fail = (result) {\n          print(&#x27;fail&#x27;);\n          print(result.errCode);\n          print(result.errMsg);\n        },\n    );\n  },\n  child: MaterialButton(\n    onPressed: () {},\n    child: Text(&#x27;Wechat API Test&#x27;),\n  ),\n),</code></pre>\n</div>\n","headings":[{"id":"heading-tap_request-1","title":"6.9 Tap Request 用户手势限制问题","level":2},{"id":"heading-tap_request-2","title":"解决方案","level":4}],"wordCount":80,"readTime":3,"file":"微信小程序平台特性_Tap Request 问题_R0HbwZnz1ivmSkkmLdOcEWdan3i.html"},{"id":"dark_mode","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"Dark Mode 暗色模式适配","icon":"🌙","date":"2024年3月10日","html":"<h2 id=\"heading-dark_mode-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-dark_mode-1\" class=\"heading-anchor\">#</a>6.10 Dark Mode 暗色模式适配</h2>\n<blockquote class=\"feishu-blockquote\">\n<p class=\"feishu-p\">已支持，要求 MPFlutter 2.1.0 版本。</p>\n<p class=\"feishu-p\">请先阅读微信文档：https://developers.weixin.qq.com/miniprogram/dev/framework/ability/darkmode.html</p>\n<p class=\"feishu-p\">MPFlutter 通过 MPFlutterDarkmodeManager 类提供信息，可实现以下能力：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">检测当前用户屏幕是否为暗色模式</li>\n    <li class=\"feishu-li\">监听暗色、浅色模式变化</li>\n</ul>\n</blockquote>\n<h3 id=\"heading-dark_mode-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-dark_mode-2\" class=\"heading-anchor\">#</a>暗色模式主题</h3>\n<p class=\"feishu-p\">需要配合 Material DarkMode Theme 使用，参考代码如下：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">@override\n  Widget build(BuildContext context) {\n    return material.MaterialApp(\n      darkTheme: material.ThemeData(\n        useMaterial3: true,\n        appBarTheme: material.AppBarTheme(\n          color: material.Colors.black,\n          foregroundColor: material.Colors.grey,\n          elevation: 5.0,\n          centerTitle: false,\n        ),\n        platform: material.TargetPlatform.iOS,\n      ),\n      theme: material.ThemeData(\n        useMaterial3: true,\n        appBarTheme: material.AppBarTheme(\n          color: material.Colors.blue,\n          foregroundColor: material.Colors.white,\n          elevation: 5.0,\n          centerTitle: false,\n        ),\n        platform: material.TargetPlatform.iOS,\n      ),\n      themeMode: MPFlutterDarkmodeManager.isDarkmode()\n          ? material.ThemeMode.dark\n          : material.ThemeMode.light,\n);</code></pre>\n</div>\n<p class=\"feishu-p\">监听暗色、浅色变化：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-ba
