dge\">code</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-text\">MPFlutterDarkmodeManager.addThemeListener(() {\n  // Theme 变化，使用 setState 等方式要求 MaterialApp 刷新。\n});</code></pre>\n</div>\n<h3 id=\"heading-dark_mode-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-dark_mode-3\" class=\"heading-anchor\">#</a>微信小程序配置</h3>\n<p class=\"feishu-p\">你需要在 app.json 中设置 darkmode: true 才可以启用暗色主题，同时需要在 window 中去掉 backgroundTextStyle 和 navigationBarTextStyle 配置。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">json</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-json\">{\n  &quot;darkmode&quot;: true,\n}\n</code></pre>\n</div>\n","headings":[{"id":"heading-dark_mode-1","title":"6.10 Dark Mode 暗色模式适配","level":2},{"id":"heading-dark_mode-2","title":"暗色模式主题","level":3},{"id":"heading-dark_mode-3","title":"微信小程序配置","level":3}],"wordCount":108,"readTime":6,"file":"微信小程序平台特性_Dark Mode 适配_HR2RwgXLgi4Vwek9lyWc1q4Un2g.html"},{"id":"order_center","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"微信小程序订单中心页接入","icon":"🛒","date":"2024年3月10日","html":"<h2 id=\"heading-order_center-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-order_center-1\" class=\"heading-anchor\">#</a>6.11 微信小程序订单中心页接入</h2>\n<blockquote class=\"feishu-blockquote\">\n<p class=\"feishu-p\">该功能未发布，请使用 Nightly 版本。</p>\n<p class=\"feishu-p\">针对微信官方《关于小程序订单中心页设置的公告》要求，我们提供以下构建方案。</p>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">修改 <code class=\"inline-code\">scripts/build_wechat.dart</code>，添加以下构建选项：</li>\n</ol>\n</blockquote>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">code</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-text\">build_tools.addShadowPage(&#x27;order&#x27;);</code></pre>\n</div>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">然后在 <code class=\"inline-code\">MPFlutterWechatAppDelegate</code> 中，使用 <code class=\"inline-code\">launchOptions[&quot;path&quot;]</code> 获取页面路径，判断是否为 <code class=\"inline-code\">pages/index/order</code> 响应跳转。</li>\n</ol>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">code</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-text\">MPFlutterWechatAppDelegate(\n      onLaunch: (query, options) {\n            final path = options[&#x27;path&#x27;];\n            if (path == &quot;pages/index/order&quot;) {\n              // 订单中心页\n            }\n      },\n)\n    </code></pre>\n</div>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">添加 <code class=\"inline-code\">pages/index/order</code> 路径到微信小程序后台</li>\n</ol>\n","headings":[{"id":"heading-order_center-1","title":"6.11 微信小程序订单中心页接入","level":2}],"wordCount":44,"readTime":3,"file":"微信小程序平台特性_订单中心页_W0qnwZPPkiO5PTk7RbscZX9bn4e.html"},{"id":"socket","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"Socket 与 WebSocket 通信","icon":"🔄","date":"2024年6月26日","html":"<h2 id=\"heading-socket-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-socket-1\" class=\"heading-anchor\">#</a>6.12 Socket 与 WebSocket 通信</h2>\n<h3 id=\"heading-socket-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-socket-2\" class=\"heading-anchor\">#</a>Socket</h3>\n<p class=\"feishu-p\">使用 mpflutter_wechat_socket 库可以在微信小程序上与服务器使用 TCPSocket 通信，官方是基于微信提供的 API 进行封装的，请注意域名配置和端口号限制。</p>\n<p class=\"feishu-p\">相关文档：https://developers.weixin.qq.com/miniprogram/dev/api/network/tcp/wx.createTCPSocket.html</p>\n<h4 id=\"heading-socket-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-socket-3\" class=\"heading-anchor\">#</a>使用方法</h4>\n<p class=\"feishu-p\">添加依赖到 pubspec.yaml 中：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\">dependencies:\n  mpflutter_wechat_socket: ^0.0.1</code></pre>\n</div>\n<p class=\"feishu-p\">在需要通信的地方，编写以后代码：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wechat_socket/mpflutter_wechat_socket.dart&#x27;;\n\nMPFlutter_Wechat_Socket.connect(&#x27;127.0.0.1&#x27;, 1234).then((socket) {\n  print(&#x27;Connected to server&#x27;);\n\n  // 发送测试数据\n  socket.write(&#x27;Hello, server!&#x27;);\n\n  // 监听服务器返回的数据\n  socket.listen((data) {\n    print(&#x27;Received from server: $data&#x27;);\n  }, onDone: () {\n    print(&#x27;Server closed the connection&#x27;);\n    socket.destroy();\n  }, onError: (error) {\n    print(&#x27;Error: $error&#x27;);\n    socket.destroy();\n  });\n\n  // 关闭连接\n  Future.delayed(Duration(seconds: 5), () {\n    print(&#x27;Closing connection&#x27;);\n    socket.close();\n  });\n}).catchError((error) {\n  print(&#x27;Error connecting to server: $error&#x27;);\n});</code></pre>\n</div>\n<h3 id=\"heading-socket-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-socket-4\" class=\"heading-anchor\">#</a>WebSocket</h3>\n<p class=\"feishu-p\">web_socket_channel 是常用的 websocket client 库，MPFlutter 官方通过 Fork 的方式在 web_socket_channel 的基础上添加微信小程序支持。</p>\n<p class=\"feishu-p\">同样的，开发者也需要注意相关的域名和端口限制。</p>\n<p class=\"feishu-p\">相关文档：https://developers.weixin.qq.com/miniprogram/dev/api/network/websocket/wx.connectSocket.html</p>\n<h4 id=\"heading-socket-5\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-socket-5\" class=\"heading-anchor\">#</a>使用方法</h4>\n<p class=\"feishu-p\">添加依赖到 pubspec.yaml 中：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\">dependencies:\n  web_socket_channel: \n    git: \n      url: https://github.com/mpflutter/web_socket_channel.git\n      ref: mpflutter-2.4.2</code></pre>\n</div>\n<p class=\"feishu-p\">在需要通信的位置添加代码：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:web_socket_channel/web_socket_channel.dart&#x27;;\nimport &#x27;package:web_socket_channel/status.dart&#x27; as status;\n\nvoid main() async {\n    final wsUrl = Uri.parse(&#x27;ws://example.com&#x27;);\n    final channel = WebSocketChannel.connect(wsUrl);\n\n    await channel.ready;\n\n    channel.stream.listen((message) {\n      print(&quot;received message = ${message}&quot;)\n    });\n    \n    channel.sink.add(&#x27;send message to server&#x27;);\n}</code></pre>\n</div>\n","headings":[{"id":"heading-socket-1","title":"6.12 Socket 与 WebSocket 通信","level":2},{"id":"heading-socket-2","title":"Socket","level":3},{"id":"heading-socket-3","title":"使用方法","level":4},{"id":"heading-socket-4","title":"WebSocket","level":3},{"id":"heading-socket-5","title":"使用方法","level":4}],"wordCount":147,"readTime":5,"file":"微信小程序平台特性_Socket、WebSocket_R56vwolrriKQCOkjJ6pcCX1Bnaf.html"},{"id":"imsdk","chapterId":"chap_wechat_features","chapterTitle":"七、微信小程序平台特性","title":"在微信小程序中使用 Tencent IMSDK","icon":"💬","date":"2024年3月10日","html":"<h2 id=\"heading-imsdk-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-imsdk-1\" class=\"heading-anchor\">#</a>6.13 在微信小程序中使用 Tencent IMSDK</h2>\n<p class=\"feishu-p\">腾讯云 IMSDK 支持 Flutter 和微信小程序使用，在 MPFlutter 中同样可用。</p>\n<p class=\"feishu-p\">本文档将指引你集成并运行 IMSDK。</p>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">下载模板工程 《<a href=\"#first_app\" onclick=\"switchArticle('first_app')\">编写第一个 MPFlutter 微信小程序</a>》</li>\n    <li class=\"feishu-li\">在 scripts/build_wechat.dart 文件中添加以下配置</li>\n</ol>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_build_tools/main.dart&#x27; as build_tools;\n\nvoid main(List&lt;String&gt; arguments) async {\n  final buildArgs = [...arguments]..add(&#x27;--wechat&#x27;);\n  build_tools.addNpmPackage(&quot;TencentCloudChat&quot;, &quot;@tencentcloud/chat&quot;);\n  build_tools.main(buildArgs);\n}\n</code></pre>\n</div>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">在 pubspec.yaml 添加以下依赖</li>\n</ol>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\">dependencies:\n  tencent_cloud_chat_sdk: ^8.5.6864+10</code></pre>\n</div>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">在 wechat 目录下添加对应的 npm 包，并构建成 miniprogram_npm 包，具体方法参照。</li>\n    <li class=\"feishu-li\">在 main.dart 或任意位置使用 Flutter 代码初始化 IMSDK，具体参数见官方文档。</li>\n</ol>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">class MyApp extends StatelessWidget {\n  MyApp({super.key}) {\n    TencentImSDKPlugin.v2TIMManager.initSDK(\n        sdkAppID: 0); // 在这里初始化 IMSDK，后续的使用与正常的腾讯云 IMSDK Flutter 版本无任何差异。\n  }\n}</code></pre>\n</div>\n<ol class=\"feishu-ol\">\n    <li class=\"feishu-li\">后续的使用与 IMSDK Flutter 版本无任何差异。</li>\n</ol>\n<p class=\"feishu-p\">如果你不想自行构建 npm，可以直接下载这个模板工程，已经集成好 IMSDK。</p>\n<div class=\"file-card\" style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(0,0,0,0.03);border:1px solid rgba(0,0,0,0.08);border-radius:8px;margin:12px 0;\">\n    <div class=\"file-icon\" style=\"font-size:24px;\">📦</div>\n    <div class=\"file-info\">\n        <div class=\"file-name\" style=\"font-weight:600;color:var(--text-color, #222);\">awesome_project.zip</div>\n        <div class=\"file-size\" style=\"font-size:12px;color:var(--text-secondary, #666);\">2.8 MB（工程配套附件模板）</div>\n    </div>\n</div>\n<p class=\"feishu-p\">注意，在上线前你需要按照腾讯云的要求配置好业务域名。</p>\n","headings":[{"id":"heading-imsdk-1","title":"6.13 在微信小程序中使用 Tencent IMSDK","level":2}],"wordCount":95,"readTime":5,"file":"微信小程序平台特性_在微信小程序中使用 Tencent IMSDK_DUehwuNAOiwYnzkESl4cApJ3nWc.html"},{"id":"wegame_features","chapterId":"chap_wegame_features","chapterTitle":"八、微信小游戏平台特性","title":"微信小游戏平台特性概述","icon":"🎮","date":"2024年4月21日","html":"\n<h2 id=\"heading-wegame_features-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-wegame_features-1\" class=\"heading-anchor\">#</a>七、微信小游戏平台特性</h2>\n\n\n","headings":[{"id":"heading-wegame_features-1","title":"七、微信小游戏平台特性","level":2}],"wordCount":16,"readTime":1,"file":"12_微信小游戏平台特性_M2kpwyJx6i6NNckjO2pcxPepn0g.html"},{"id":"wegame_api","chapterId":"chap_wegame_features","chapterTitle":"八、微信小游戏平台特性","title":"微信小游戏 API 封装库 (mpflutter_wegame_api)","icon":"🕹️","date":"2024年4月21日","html":"<h2 id=\"heading-wegame_api-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-wegame_api-1\" class=\"heading-anchor\">#</a>7.1 微信小游戏 API 封装库 (mpflutter_wegame_api)</h2>\n<p class=\"feishu-p\">微信小游戏提供了一系统的 API，可用于获取以下能力：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">基础信息</li>\n    <li class=\"feishu-li\">网络</li>\n    <li class=\"feishu-li\">本地文件读写</li>\n    <li class=\"feishu-li\">蓝牙</li>\n    <li class=\"feishu-li\">支付</li>\n    <li class=\"feishu-li\">......</li>\n</ul>\n<p class=\"feishu-p\">你可以通过微信官方文档了解</p>\n<p class=\"feishu-p\">https://developers.weixin.qq.com/minigame/dev/api/</p>\n<h3 id=\"heading-wegame_api-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-wegame_api-2\" class=\"heading-anchor\">#</a>封装库</h3>\n<p class=\"feishu-p\">对于 MPFlutter 应用，如果每一个 API 的调用都需要开发者自行编写 Channel，那是非常麻烦的。</p>\n<p class=\"feishu-p\">我们特别提供了 mpflutter_wegame_api 库，这个库提供了 Dart 的调用封装，你不需要编写任何 JavaScript 代码就可以调用微信 API。</p>\n<p class=\"feishu-p\">添加以下依赖到 pubspec.yaml 就可以使用了：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\">dependencies:\n  mpflutter_wegame_api: {请自行替换成最新版本号}</code></pre>\n</div>\n<h3 id=\"heading-wegame_api-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-wegame_api-3\" class=\"heading-anchor\">#</a>示例代码</h3>\n<p class=\"feishu-p\">对于同步返回方法，你可以直接获取结果。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wegame_api/mpflutter_wegame_api.dart&#x27;;\n\nfinal result = wx.getSystemInfoSync();\nprint(result.model);</code></pre>\n</div>\n<p class=\"feishu-p\">对于异步返回方法以及带参数的方法，你需要使用 .. 的方法设置 Option 参数。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_wegame_api/mpflutter_wegame_api.dart&#x27;;\n\nwx.getSystemInfoAsync(GetSystemInfoAsyncOption()\n      ..success = (result) {\n        final snackBar = SnackBar(\n          content: Text(&#x27;Device model = ${result.model}&#x27;),\n        );\n        ScaffoldMessenger.of(context).showSnackBar(snackBar);\n      });</code></pre>\n</div>\n<p class=\"feishu-p\">Option 的类总是与方法配对提供的，例如 <code class=\"inline-code\">getSystemInfoAsync</code> 对应的就是 <code class=\"inline-code\">GetSystemInfoAsyncOption</code>。</p>\n","headings":[{"id":"heading-wegame_api-1","title":"7.1 微信小游戏 API 封装库 (mpflutter_wegame_api)","level":2},{"id":"heading-wegame_api-2","title":"封装库","level":3},{"id":"heading-wegame_api-3","title":"示例代码","level":3}],"wordCount":84,"readTime":5,"file":"微信小游戏平台特性_微信小游戏 API 封装库_TCIHwggmsiJ7JZkcJRNcHELEnfe.html"},{"id":"license_support","chapterId":"chap_license_support","chapterTitle":"九、商用授权、创业计划与技术支持","title":"商用授权与去除 UNLICENSE 角标","icon":"💼","date":"2024年10月1日","html":"<h2 id=\"heading-license_support-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-license_support-1\" class=\"heading-anchor\">#</a>8.1 商用授权与去除 UNLICENSE 角标</h2>\n<p class=\"feishu-p\">目前 MPFlutter 2.0 已取消收费，你可以自由使用。</p>\n<h3 id=\"heading-license_support-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-license_support-2\" class=\"heading-anchor\">#</a>我可以去掉未授权（UNLICENSE）角标吗？</h3>\n<p class=\"feishu-p\">可以，你可以自由去掉，请通过以下方式去除，修改 <code class=\"inline-code\">scripts/build_wechat.dart</code>。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">import &#x27;package:mpflutter_build_tools/main.dart&#x27; as build_tools;\nvoid main(List&lt;String&gt; arguments) async {\n  final buildArgs = [...arguments]..add(&#x27;--wechat&#x27;);\n  build_tools.licenseGrant = true;\n  build_tools.main(buildArgs);\n}</code></pre>\n</div>\n<p class=\"feishu-p\">MPFlutter 2.0 版本并不是一个完全开源（代码开源、商用付费）的项目，如果你使用 MPFlutter 开发的小程序、小游戏需要用于商业目的，需要购买商用授权。</p>\n<h3 id=\"heading-license_support-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-license_support-3\" class=\"heading-anchor\">#</a>商业目的定义</h3>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">面向企业内部的应用，属于商业目的，需要购买授权。</li>\n    <li class=\"feishu-li\">面向公众的应用，属于商业目的，需要购买授权。</li>\n    <li class=\"feishu-li\">目标用户只包括开发者自己，无任何营利目的，不需要购买授权。</li>\n    <li class=\"feishu-li\">目标用户是以教学演示、内部研究为目的的小程序、小游戏，不需要购买授权。</li>\n    <li class=\"feishu-li\">小程序、小游戏关联实体是自然人，并且小程序、小游戏没有增加任何广告，未用于盈利目的，不需要购买授权，这种行为需要联系作者备案，会提供免费授权证书。</li>\n</ul>\n<h3 id=\"heading-license_support-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-license_support-4\" class=\"heading-anchor\">#</a>个人开发者创业支持计划</h3>\n<p class=\"feishu-p\">针对个人开发者创业需求，特制定该计划，如果同时满足以下条件，可以申请免费授权：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">小程序、小游戏认证主体为个人；</li>\n    <li class=\"feishu-li\">年度广告收入不超过人民币 1000 元（本计划允许放置广告）；</li>\n    <li class=\"feishu-li\">在掘金、Bilibili、知乎等平台，发表与该小程序相关的文章并提及 MPFlutter，默认授权 MPFlutter 团队转载你的文章。</li>\n</ul>\n<p class=\"feishu-p\">详情请阅读 《<a href=\"#startup_program\" onclick=\"switchArticle('startup_program')\">个人开发者创业支持计划</a>》</p>\n<h3 id=\"heading-license_support-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-license_support-5\" class=\"heading-anchor\">#</a>授权方式</h3>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">MPFlutter 的授权是针对单个 appId 授予的，每一个上线的小程序、小游戏都需要购买一次授权。</li>\n    <li class=\"feishu-li\">授权是无期限的，单个 appId 购买授权后就可以一直使用。</li>\n    <li class=\"feishu-li\">授权是不可转让的，只能服务于购买时指定的 appId。</li>\n</ul>\n<h3 id=\"heading-license_support-6\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-license_support-6\" class=\"heading-anchor\">#</a>价格</h3>\n<p class=\"feishu-p\">一个 appId 永久授权价格 ￥300.00 </p>\n<p class=\"feishu-p\"><strong>授权包含以下服务：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">自购买日起 365 天内，Bug 类咨询优先响应。</li>\n    <li class=\"feishu-li\">1 次性能优化建议服务。</li>\n</ul>\n<p class=\"feishu-p\"><strong>授权不包含以下服务：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">非 Bug 类咨询</li>\n    <li class=\"feishu-li\">特别是业务自身的 Bug 不属于响应范围</li>\n    <li class=\"feishu-li\">框架功能请求</li>\n    <li class=\"feishu-li\">可以提交建议，但不保证完成对应功能</li>\n</ul>\n<p class=\"feishu-p\"><strong>授权免责范围：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">使用 MPFlutter 框架，不管任何原因导致的客户资金损失，MPFlutter 不承担责任。</li>\n    <li class=\"feishu-li\">使用 MPFlutter 开发的小程序、小游戏，在运营过程中，违反当地法律的，MPFlutter 不承担责任。</li>\n</ul>\n<h3 id=\"heading-license_support-7\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-license_support-7\" class=\"heading-anchor\">#</a>授权购买方法</h3>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">请通过微信添加 PonyCui@MPFlutter 咨询。</li>\n    <li class=\"feishu-li\">仅解答付款、BUG 问题，不解答本文档和微信文档知识，BUG 优先建议 GitHub 提交 Issue。</li>\n</ul>\n<h3 id=\"heading-license_support-8\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-license_support-8\" class=\"heading-anchor\">#</a>为什么需要商用授权？</h3>\n<p class=\"feishu-p\">由于 MPFlutter 是一项需要长期投入的工作，团队需要持续的回报以保证整个 MPFlutter 的正常运转。</p>\n<p class=\"feishu-p\">另外，我们发现客户在使用一个新的技术时，常会犹豫这项技术是否能有足够的 Issue 响应支持。</p>\n<p class=\"feishu-p\">为此，通过售卖授权的方式，我们可以更专注于服务商业用户，为用户提供更有力的技术保障。</p>\n<p class=\"feishu-p\">如果你只是用于非营利目的应用开发，完全可以免费使用。</p>\n","headings":[{"id":"heading-license_support-1","title":"8.1 商用授权与去除 UNLICENSE 角标","level":2},{"id":"heading-license_support-2","title":"我可以去掉未授权（UNLICENSE）角标吗？","level":3},{"id":"heading-license_support-3","title":"商业目的定义","level":3},{"id":"heading-license_support-4","title":"个人开发者创业支持计划","level":3},{"id":"heading-license_support-5","title":"授权方式","level":3},{"id":"heading-license_support-6","title":"价格","level":3},{"id":"heading-license_support-7","title":"授权购买方法","level":3},{"id":"heading-license_support-8","title":"为什么需要商用授权？","level":3}],"wordCount":126,"readTime":4,"file":"13_商用授权购买_KEL9wIQ7ji4ChmkFnTfcIvJPnzb.html"},{"id":"startup_program","chapterId":"chap_license_support","chapterTitle":"九、商用授权、创业计划与技术支持","title":"个人开发者创业支持计划","icon":"🤝","date":"2024年3月10日","html":"\n<h2 id=\"heading-startup_program-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-startup_program-1\" class=\"heading-anchor\">#</a>8.2 个人开发者创业支持计划</h2>\n\n\n\n<h4 id=\"heading-startup_program-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-startup_program-2\" class=\"heading-anchor\">#</a>前提条件</h4>\n\n\n<p class=\"feishu-p\">针对个人开发者创业需求，特制定该计划，如果同时满足以下条件，可以申请免费授权：</p>\n\n<ul class=\"feishu-ul\">\n<li>小程序、小游戏认证主体为个人；</li>\n<li>年度广告收入不超过人民币 1000 元（本计划允许放置广告）；</li>\n<li>在掘金、Bilibili、知乎等平台，发表与该小程序相关的文章并提及 MPFlutter，默认授权 MPFlutter 团队转载你的文章。</li>\n</ul>\n\n\n<h4 id=\"heading-startup_program-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-startup_program-3\" class=\"heading-anchor\">#</a>授权申请方式</h4>\n\n\n<p class=\"feishu-p\">请通过微信添加 PonyCui@MPFlutter 咨询。</p>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/startup_support_qr.jpeg\" alt=\"image\" class=\"zoomable-img\" onclick=\"openLightbox('./images/startup_support_qr.jpeg', 'image')\" />\n                <div class=\"image-caption\">image</div>\n            </div>\n\n<p class=\"feishu-p\">创业计划授权期限为一年，可申请续期，续期时如果仍然满足前提条件，可继续免费申请。</p>\n\n\n<p class=\"feishu-p\">自 2024 年 1 月 1 日起已付费购买授权的，可申请退款。</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n","headings":[{"id":"heading-startup_program-1","title":"8.2 个人开发者创业支持计划","level":2},{"id":"heading-startup_program-2","title":"前提条件","level":4},{"id":"heading-startup_program-3","title":"授权申请方式","level":4}],"wordCount":371,"readTime":1,"file":"14_个人开发者创业支持计划_SH4dwtMpPi0m14kMMCkcaIyWnuh.html"},{"id":"tech_support","chapterId":"chap_license_support","chapterTitle":"九、商用授权、创业计划与技术支持","title":"技术支持与交流渠道","icon":"💬","date":"2024年3月10日","html":"\n<h2 id=\"heading-tech_support-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-tech_support-1\" class=\"heading-anchor\">#</a>8.3 技术支持与交流渠道</h2>\n\n\n\n<h4 id=\"heading-tech_support-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-tech_support-2\" class=\"heading-anchor\">#</a>BUG 反馈方式</h4>\n\n\n<p class=\"feishu-p\">请直接联系 PonyCui@MPFlutter 私信提 BUG，也可以直接在 <a href=\"https://github.com/mpflutter/mpflutter/issues\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">GitHub</a> 上提 Issue。</p>\n\n\n<p class=\"feishu-p\">提 BUG 要求，使用飞书文档创建 <a href=\"https://weypl4zsnv.feishu.cn/wiki/SaOSwFEtEiG7XkkmBftc67Jxnee\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">BUG 模板</a>  副本，填好问题答案再私信。</p>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/tech_support_qr.jpeg\" alt=\"image\" class=\"zoomable-img\" onclick=\"openLightbox('./images/tech_support_qr.jpeg', 'image')\" />\n                <div class=\"image-caption\">image</div>\n            </div>\n\n<hr class=\"feishu-hr\" />\n\n\n","headings":[{"id":"heading-tech_support-1","title":"8.3 技术支持与交流渠道","level":2},{"id":"heading-tech_support-2","title":"BUG 反馈方式","level":4}],"wordCount":190,"readTime":1,"file":"15_技术支持_EXg0w88B7iCZkbkzGkscZtWlnZf.html"},{"id":"bug_template","chapterId":"chap_license_support","chapterTitle":"九、商用授权、创业计划与技术支持","title":"标准 BUG 反馈模板","icon":"🐛","date":"2024年3月10日","html":"\n<h2 id=\"heading-bug_template-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-bug_template-1\" class=\"heading-anchor\">#</a>8.4 标准 BUG 反馈模板</h2>\n\n\n<p class=\"feishu-p\">文档编写完成后，参考<<a href=\"https://www.feishu.cn/hc/zh-CN/articles/360049067493-%E5%B0%86%E6%96%87%E6%A1%A3%E5%88%86%E4%BA%AB%E7%BB%99%E4%BC%81%E4%B8%9A%E5%A4%96%E9%83%A8%E4%BA%BA%E5%91%98\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">方式三：将云文档设置为获得链接可见</a>>分享给 MPFlutter 成员。</p>\n\n\n<p class=\"feishu-p\">如果不希望使用链接分享，保密要求较高，你可以直接将内容和 zip 包以邮件形式发送到 <a href=\"mailto:service@mpflutter.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">service@mpflutter.com</a></p>\n\n\n\n<h4 id=\"heading-bug_template-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-bug_template-2\" class=\"heading-anchor\">#</a>保密要求</h4>\n\n\n<p class=\"feishu-p\">保密 BUG 将不会添加到公开 List 中</p>\n\n\n<p class=\"feishu-p\">是否保密？</p>\n\n\n\n<h4 id=\"heading-bug_template-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-bug_template-3\" class=\"heading-anchor\">#</a>开发环境（必填）</h4>\n\n\n<p class=\"feishu-p\">Flutter 版本号：</p>\n\n\n<p class=\"feishu-p\">MPFlutter 版本号：</p>\n\n\n<p class=\"feishu-p\">操作系统：</p>\n\n\n<p class=\"feishu-p\">IDE：</p>\n\n\n\n<h4 id=\"heading-bug_template-4\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-bug_template-4\" class=\"heading-anchor\">#</a>问题描述（必填）</h4>\n\n\n<p class=\"feishu-p\">请具体描述问题的复现方法，如果有错误堆栈及错误码也贴到这里</p>\n\n\n\n<h4 id=\"heading-bug_template-5\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-bug_template-5\" class=\"heading-anchor\">#</a>问题工程文件（可选）</h4>\n\n\n<p class=\"feishu-p\">请使用 zip 打包工程文件，上传到这里，请不要打包 build 和 .dart_tool 目录</p>\n\n\n<p class=\"feishu-p\">推荐内容由 AI 生成</p>\n\n\n","headings":[{"id":"heading-bug_template-1","title":"8.4 标准 BUG 反馈模板","level":2},{"id":"heading-bug_template-2","title":"保密要求","level":4},{"id":"heading-bug_template-3","title":"开发环境（必填）","level":4},{"id":"heading-bug_template-4","title":"问题描述（必填）","level":4},{"id":"heading-bug_template-5","title":"问题工程文件（可选）","level":4}],"wordCount":362,"readTime":1,"file":"技术支持_BUG 模板_SaOSwFEtEiG7XkkmBftc67Jxnee.html"},{"id":"version_info","chapterId":"chap_version_info","chapterTitle":"十、版本信息与更新日志 (ChangeLog)","title":"版本信息与更新日志 (2.0.0 ~ 2.8.0)","icon":"📋","date":"2025年3月25日","html":"<h2 id=\"heading-version_info-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-version_info-1\" class=\"heading-anchor\">#</a>九、版本信息与更新日志 (ChangeLog)</h2>\n<h3 id=\"heading-version_info-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-version_info-2\" class=\"heading-anchor\">#</a>稳定版本</h3>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\">dependencies:\n  flutter:\n    sdk: flutter\n  mpflutter_core: 2.8.0 # Flutter 3.27 及以下版本请使用 -&gt; 2.7.8\n  mpflutter_build_tools: 2.8.0\n  mpflutter_wechat_api: 2.2.4 # 这是微信小程序 API\n  mpflutter_wegame_api: 2.5.0 # 这是微信小游戏 API</code></pre>\n</div>\n<h4 id=\"heading-version_info-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-3\" class=\"heading-anchor\">#</a>ChangeLog</h4>\n<h4 id=\"heading-version_info-4\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-4\" class=\"heading-anchor\">#</a>2.8.0(2025-03-25)</h4>\n<blockquote class=\"feishu-blockquote\">\n<p class=\"feishu-p\">注意：Flutter 3.29 版本需要在 main.dart 中设置字体为 Noto Sans SC 才能正确显示中文。</p>\n</blockquote>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">javascript</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-javascript\">material.MaterialApp(\n  theme: material.ThemeData(\n    fontFamily: &quot;Noto Sans SC&quot;,\n    fontFamilyFallback: const [&quot;Noto Sans SC&quot;],\n  )\n)</code></pre>\n</div>\n<p class=\"feishu-p\"><strong>新增功能：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">支持 Flutter 3.29 版本</li>\n</ul>\n<h4 id=\"heading-version_info-5\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-5\" class=\"heading-anchor\">#</a>2.7.15(2025-2-8)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">Flutter 3.27 无法加载图片的问题</li>\n</ul>\n<h4 id=\"heading-version_info-6\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-6\" class=\"heading-anchor\">#</a>2.7.12(2025-1-26)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">支持 Flutter 3.27</li>\n    <li class=\"feishu-li\">支持 NPM Package 定义</li>\n</ul>\n<h4 id=\"heading-version_info-7\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-7\" class=\"heading-anchor\">#</a>2.7.11(2025-1-11)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">支持微信小程序在鸿蒙系统上运行</li>\n</ul>\n<h4 id=\"heading-version_info-8\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-8\" class=\"heading-anchor\">#</a>2.7.10(2024-12-31)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">修正 PlatformView 在多次 Route 跳转后可能不再显示的问题</li>\n    <li class=\"feishu-li\">修正使用微信小程序插件后白屏的问题</li>\n</ul>\n<h4 id=\"heading-version_info-9\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-9\" class=\"heading-anchor\">#</a>2.7.8(2024-11-13)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">优化 Image.encodeToFilePath 的速度</li>\n    <li class=\"feishu-li\">PlatformView 可能未能正确展示的问题</li>\n    <li class=\"feishu-li\">android 数字键盘无高度变化回调的问题</li>\n    <li class=\"feishu-li\">flutter 3.24 焦点无法 blur 的问题</li>\n    <li class=\"feishu-li\">Cavnas.toImage 异常问题</li>\n</ul>\n<h4 id=\"heading-version_info-10\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-10\" class=\"heading-anchor\">#</a>2.7.7(2024-10-29)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">安卓上部分页面意外被 Pop 的问题</li>\n</ul>\n<h4 id=\"heading-version_info-11\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-11\" class=\"heading-anchor\">#</a>2.7.6(2024-09-24)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">Flutter 3.24.3 版本白屏问题</li>\n</ul>\n<h4 id=\"heading-version_info-12\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-12\" class=\"heading-anchor\">#</a>2.7.5(2024-07-30)</h4>\n<p class=\"feishu-p\">因 es_compression 2.0.13 版本存在缺陷，导致字体压缩失败。</p>\n<p class=\"feishu-p\">临时解决方案：在你的 pubspec.yaml 中添加 es_compression: 2.0.12 依赖。</p>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">透明画布未生效的问题</li>\n</ul>\n<h4 id=\"heading-version_info-13\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-13\" class=\"heading-anchor\">#</a>2.7.4(2024-07-28)</h4>\n<blockquote class=\"feishu-blockquote\">\n<p class=\"feishu-p\">重要更新：请尽快使用该版本构建你的小程序，并重新提交微信发布，否则可能导致 iOS 小程序白屏！</p>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">Pointerup 事件异常</li>\n</ul>\n</blockquote>\n<h4 id=\"heading-version_info-14\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-14\" class=\"heading-anchor\">#</a>2.7.3(2024-07-23)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">修复部分 iOS 设备白屏的问题</li>\n    <li class=\"feishu-li\">修复热启动后 PlatformView 失效的问题</li>\n</ul>\n<h4 id=\"heading-version_info-15\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-15\" class=\"heading-anchor\">#</a>2.7.0(2024-07-09)</h4>\n<p class=\"feishu-p\"><strong>新增功能：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">支持 Flutter SDK 3.22.0+</li>\n    <li class=\"feishu-li\">支持 PlatformView 置于 Flutter Canvas 下方</li>\n</ul>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">添加 WebGL 1.0 Fallback 支持</li>\n</ul>\n<h4 id=\"heading-version_info-16\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-16\" class=\"heading-anchor\">#</a>2.6.4(2024-06-26)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">微信小程序基础库 3.4.8 灰度导致的屏幕触摸无响应问题，微信官方正在修复中，该问题暂不影响非开发者用户，影响开发者用户 + 生产环境小程序，如需彻底解决问题，可以使用 2.6.4 重新构建小程序上传、发布。</li>\n</ul>\n<h4 id=\"heading-version_info-17\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-17\" class=\"heading-anchor\">#</a>2.6.3(2024-06-14)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">iOS 14.4 以下版本，小程序黑屏问题。</li>\n</ul>\n<h4 id=\"heading-version_info-18\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-18\" class=\"heading-anchor\">#</a>2.6.0(2024-04-21)</h4>\n<p class=\"feishu-p\"><strong>新增功能：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">新增 fvm 支持</li>\n</ul>\n<h4 id=\"heading-version_info-19\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-19\" class=\"heading-anchor\">#</a>2.5.0(2024-03-24)</h4>\n<p class=\"feishu-p\"><strong>新增功能：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">新增微信小游戏支持。</li>\n    <li class=\"feishu-li\">新增 MPFlutterNetworkImage 用于修正 Flutter Web 无 LoadingBuilder 的支持。</li>\n</ul>\n<h4 id=\"heading-version_info-20\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-20\" class=\"heading-anchor\">#</a>2.4.2(2024-03-12)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">修复一个因 Font 加载导致的严重卡顿问题。</li>\n</ul>\n<h4 id=\"heading-version_info-21\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-21\" class=\"heading-anchor\">#</a>2.4.0(2024-03-10)</h4>\n<p class=\"feishu-p\"><strong>新增功能：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">新增无字体渲染能力的 Skia CanvasKit 产物，并且在 MiniTex 启用的情况下，可以使用该产物。</li>\n    <li class=\"feishu-li\">新增 main.mpflutter.dart 分包策略，默认 main.dart.js 将不大于 700K。</li>\n    <li class=\"feishu-li\">智能分包策略调整，在主包大小保持 2M 的情况下，去除不必要的子分包。</li>\n</ul>\n<h4 id=\"heading-version_info-22\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-22\" class=\"heading-anchor\">#</a>2.3.2 (2024-03-03)</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">TextField 设置 keyboardType 不生效的问题</li>\n    <li class=\"feishu-li\">修复微信小程序在 Windows / macOS 微信上无法运行的问题（关联微信官方 BUG ）</li>\n    <li class=\"feishu-li\">(MiniTex) 目标字体不存在内置字体时，直接使用 MiniTex 进行渲染。</li>\n    <li class=\"feishu-li\">修复 viewPadding 数值不正确导致安全区域异常的问题。</li>\n    <li class=\"feishu-li\">修复 HTTP 空返回值导出请求异常的问题。</li>\n    <li class=\"feishu-li\">修复 Editable inputFormatter 和 enable 属性无效的问题。</li>\n    <li class=\"feishu-li\">修复 flutter_widget_from_html_core 无法使用的问题。</li>\n    <li class=\"feishu-li\">新增 MPFlutterImageEncoder.encodeToFilePath 和 MPFlutterImageEncoder.encodeToBase64。</li>\n</ul>\n<h4 id=\"heading-version_info-23\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-23\" class=\"heading-anchor\">#</a>2.3.1 （2024-02-18）</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">Windows 构建异常</li>\n    <li class=\"feishu-li\">修改 Flutter Web Plugin 非兼容的处理方法，避免因不兼容插件导致的白屏出现。</li>\n</ul>\n<h4 id=\"heading-version_info-24\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-24\" class=\"heading-anchor\">#</a>2.3.0（2024-02-17）</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">PlatformView 显示错位</li>\n</ul>\n<p class=\"feishu-p\"><strong>功能：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">新增 MiniTex 文本渲染器</li>\n</ul>\n<h4 id=\"heading-version_info-25\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-25\" class=\"heading-anchor\">#</a>2.2.0（2024-01-29）</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">PlatformView 无法显示的问题。</li>\n    <li class=\"feishu-li\">使用 GetConnect 请求时，Response 内容为空的问题。</li>\n</ul>\n<p class=\"feishu-p\"><strong>功能：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">优化 Skia CanvasKit 产物大小</li>\n</ul>\n<h4 id=\"heading-version_info-26\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-26\" class=\"heading-anchor\">#</a>2.1.2 （2024-01-20）</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">MPFlutterWechatAppShareManager 未正确拼接分享参数</li>\n    <li class=\"feishu-li\">同一页面多个 PlatformView 无法同时响应触摸</li>\n</ul>\n<h4 id=\"heading-version_info-27\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-27\" class=\"heading-anchor\">#</a>2.1.0（2024-01-14）</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">mpflutter_wechat_api Array 类型统一修改为 List</li>\n    <li class=\"feishu-li\">mpflutter_wechat_api IncludePointsOption set points 缺失</li>\n</ul>\n<p class=\"feishu-p\"><strong>功能：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">新增 Image 解码器</li>\n    <li class=\"feishu-li\">新增 Image 编码器</li>\n    <li class=\"feishu-li\">新增分享朋友圈、收藏支持</li>\n    <li class=\"feishu-li\">新增 DarkMode 支持</li>\n</ul>\n<h4 id=\"heading-version_info-28\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-28\" class=\"heading-anchor\">#</a>2.0.2（2024-01-08）</h4>\n<p class=\"feishu-p\"><strong>修复问题：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">Windows 构建小程序，资源分包存在问题 【已在 Nightly 修复】</li>\n    <li class=\"feishu-li\">小程序启动过程可能有黑色闪屏 【已在 Nightly 修复】</li>\n    <li class=\"feishu-li\">Hot Reload 无法使用【已在 Nightly 修复】</li>\n    <li class=\"feishu-li\">模板工程相关部分也需要修改一下</li>\n</ul>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">void main() {\n  runMPApp(const MyApp());\n\n  if (kIsMPFlutter) {\n    try { // &lt;-- 添加 try catch\n      wx.$$context$$;\n    } catch (e) {}\n  }</code></pre>\n</div>\n<p class=\"feishu-p\"><strong>功能：</strong></p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">内置 brotli 于 mpflutter_build_tools 中，优先使用这个内置的工具。【已在 Nightly 添加】</li>\n</ul>\n<h4 id=\"heading-version_info-29\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-version_info-29\" class=\"heading-anchor\">#</a>2.0.0 (2024-01-07)</h4>\n<p class=\"feishu-p\">正式发布 2.0.0 版本，基础功能已趋向稳定。</p>\n<h3 id=\"heading-version_info-30\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-version_info-30\" class=\"heading-anchor\">#</a>Nightly 版本</h3>\n<p class=\"feishu-p\">包含最新 Bug 修复的代码，如需验证问题请使用以下依赖。</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">yaml</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-yaml\">dependency_overrides: \n  mpflutter_core: \n    git:\n      url: https://github.com/mpflutter/mpflutter.git\n      ref: master\n  mpflutter_build_tools: \n    git:\n      url: https://github.com/mpflutter/mpflutter_build_tools.git\n      ref: master\n  mpflutter_wechat_api:\n    git:\n      url: https://github.com/mpflutter/mpflutter_wechat_api.git\n      ref: master</code></pre>\n</div>\n<h3 id=\"heading-version_info-31\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-version_info-31\" class=\"heading-anchor\">#</a>微信小程序插件版本</h3>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">code</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-text\">mpflutter_wechat_mapview: 0.0.3\nmpflutter_wechat_videoview: 0.0.3\nmpflutter_wechat_webview: 0.0.3\nmpflutter_wechat_button: 0.1.0\nmpflutter_wechat_editable: 0.1.3</code></pre>\n</div>\n","headings":[{"id":"heading-version_info-1","title":"九、版本信息与更新日志 (ChangeLog)","level":2},{"id":"heading-version_info-2","title":"稳定版本","level":3},{"id":"heading-version_info-3","title":"ChangeLog","level":4},{"id":"heading-version_info-4","title":"2.8.0(2025-03-25)","level":4},{"id":"heading-version_info-5","title":"2.7.15(2025-2-8)","level":4},{"id":"heading-version_info-6","title":"2.7.12(2025-1-26)","level":4},{"id":"heading-version_info-7","title":"2.7.11(2025-1-11)","level":4},{"id":"heading-version_info-8","title":"2.7.10(2024-12-31)","level":4},{"id":"heading-version_info-9","title":"2.7.8(2024-11-13)","level":4},{"id":"heading-version_info-10","title":"2.7.7(2024-10-29)","level":4},{"id":"heading-version_info-11","title":"2.7.6(2024-09-24)","level":4},{"id":"heading-version_info-12","title":"2.7.5(2024-07-30)","level":4},{"id":"heading-version_info-13","title":"2.7.4(2024-07-28)","level":4},{"id":"heading-version_info-14","title":"2.7.3(2024-07-23)","level":4},{"id":"heading-version_info-15","title":"2.7.0(2024-07-09)","level":4},{"id":"heading-version_info-16","title":"2.6.4(2024-06-26)","level":4},{"id":"heading-version_info-17","title":"2.6.3(2024-06-14)","level":4},{"id":"heading-version_info-18","title":"2.6.0(2024-04-21)","level":4},{"id":"heading-version_info-19","title":"2.5.0(2024-03-24)","level":4},{"id":"heading-version_info-20","title":"2.4.2(2024-03-12)","level":4},{"id":"heading-version_info-21","title":"2.4.0(2024-03-10)","level":4},{"id":"heading-version_info-22","title":"2.3.2 (2024-03-03)","level":4},{"id":"heading-version_info-23","title":"2.3.1 （2024-02-18）","level":4},{"id":"heading-version_info-24","title":"2.3.0（2024-02-17）","level":4},{"id":"heading-version_info-25","title":"2.2.0（2024-01-29）","level":4},{"id":"heading-version_info-26","title":"2.1.2 （2024-01-20）","level":4},{"id":"heading-version_info-27","title":"2.1.0（2024-01-14）","level":4},{"id":"heading-version_info-28","title":"2.0.2（2024-01-08）","level":4},{"id":"heading-version_info-29","title":"2.0.0 (2024-01-07)","level":4},{"id":"heading-version_info-30","title":"Nightly 版本","level":3},{"id":"heading-version_info-31","title":"微信小程序插件版本","level":3}],"wordCount":431,"readTime":10,"file":"16_版本信息_LBtYwgw3Yi0BQzk6XTIcLOVrnZc.html"},{"id":"articles_and_cases","chapterId":"chap_articles_and_cases","chapterTitle":"十一、深度技术博文与精选案例","title":"Blog Articles 深度技术博文与精选案例概述","icon":"📝","date":"2024年3月10日","html":"\n<h2 id=\"heading-articles_and_cases-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-articles_and_cases-1\" class=\"heading-anchor\">#</a>十、深度技术博文与精选案例</h2>\n\n\n","headings":[{"id":"heading-articles_and_cases-1","title":"十、深度技术博文与精选案例","level":2}],"wordCount":18,"readTime":1,"file":"17_Blog Articles_Bev8wGeWFiy8yWkBNYocdbaJnqh.html"},{"id":"article_how","chapterId":"chap_articles_and_cases","chapterTitle":"十一、深度技术博文与精选案例","title":"在微信小程序里运行完整的 Flutter，怎么做到的？","icon":"🔬","date":"2024年3月10日","html":"<h2 id=\"heading-article_how-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-article_how-1\" class=\"heading-anchor\">#</a>10.1 在微信小程序里运行完整的 Flutter，怎么做到的？</h2>\n<h3 id=\"heading-article_how-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-article_how-2\" class=\"heading-anchor\">#</a>背景</h3>\n<p class=\"feishu-p\">小程序是一种全新的业务形态，特别是微信小程序，既结合了 Web 动态化特性，又拥有 Native 丰富的设备能力支持。</p>\n<p class=\"feishu-p\">在微信这个宿主上，小程序不仅有稳定的分发渠道，更拥有完善的生命周期、数据、AI 能力支持。</p>\n<p class=\"feishu-p\">在该微信上开发小程序，一般使用以下两种方法：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">JavaScript + WXML + WCSS</li>\n    <li class=\"feishu-li\">Taro + React + JavaScript</li>\n</ul>\n<p class=\"feishu-p\">本文要介绍的是使用 Flutter Framework 开发小程序的方法，以及该方法背后的技术原理。</p>\n<h3 id=\"heading-article_how-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-article_how-3\" class=\"heading-anchor\">#</a>技术挑战</h3>\n<p class=\"feishu-p\">尽管 Flutter 官方已经提供 Flutter Web 实现，Flutter Web 本身就是基于 dart2js 运行的，微信小程序可以运行 JavaScript，在原理上跑起 Flutter Web 是没有问题的。</p>\n<p class=\"feishu-p\">但仍然存在以下技术挑战：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">微信小程序没有 W3C 标准的 JavaScript 对象，Flutter Web 不能直接运行。</li>\n    <li class=\"feishu-li\">微信小程序也没有 DOM 实现，Flutter Web HTML Renderer 不能直接渲染。</li>\n    <li class=\"feishu-li\">微信小程序对包大小的限制十分严格，主包不能超过 2M，而 Flutter Web 所编译的 main.dart.js 初始体积就有 1.3 M，必须有合理的分包机制才能上传。</li>\n</ul>\n<p class=\"feishu-p\">我们在 MPFlutter 1.x 版本中，针对上述问题已有一定的探索，1.x 版本的解决方法如下：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">使用微信开源的 kbone 库，模拟 W3C 实现，并通过模拟的 DOM 对象渲染出符合 WXML 要求的视图树。</li>\n    <li class=\"feishu-li\">通过 Shadow Element Tree 的方式，使用 JSON 在 Dart 与 JavaScript 上下文同步视图树。</li>\n    <li class=\"feishu-li\">Fork Flutter Framework，并对其进行外科手术式的裁剪，使 main.dart.js 初始体积降低到 600K。</li>\n</ul>\n<p class=\"feishu-p\">MPFlutter 1.x 方案已经良好的运行了两年，也收到了开发者非常多的反馈，开发者常诟病于裁剪后的 Flutter Framework 不兼容 Flutter 生态上的插件，同时 material 库也无法使用，需要从头开始编写 UI。</p>\n<p class=\"feishu-p\">在 MPFlutter 2.0 版本，我们重新思考在小程序上运行 Flutter 的最佳方式，并在最终使用 CanvasKit Renderer 解决以上全部问题。</p>\n<h3 id=\"heading-article_how-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-article_how-4\" class=\"heading-anchor\">#</a>技术方案</h3>\n<h4 id=\"heading-article_how-5\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-5\" class=\"heading-anchor\">#</a>Summary</h4>\n<p class=\"feishu-p\">通过裁剪 Skia 生成符合微信小程序分包要求的 CanvasKit，使用 Flutter Web + W3C BOM + WebGL Canvas 跑通渲染流程。</p>\n<h4 id=\"heading-article_how-6\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-6\" class=\"heading-anchor\">#</a>技术选型</h4>\n<p class=\"feishu-p\">在介绍技术选型前，需要先介绍 Flutter Web 的两种 Renderer。</p>\n<h4 id=\"heading-article_how-7\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-7\" class=\"heading-anchor\">#</a>HTML Renderer</h4>\n<p class=\"feishu-p\">原理是 Flutter Framework 通过 dart:js 库调用 Document 对象，并基于此将各种 RenderObject 转换为对应的 Element + CSS 添加到 DOM 树中。</p>\n<p class=\"feishu-p\">该方案优点在于兼容性很好，几乎没有额外的依赖；缺点是性能不佳，并且渲染内容一致性难以与 Native Flutter 对齐。</p>\n<h4 id=\"heading-article_how-8\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-8\" class=\"heading-anchor\">#</a>CanvasKit Renderer</h4>\n<p class=\"feishu-p\">原理是通过 WebGL + Skia 渲染界面，该渲染方式与 Native Flutter 是完全一致的。</p>\n<p class=\"feishu-p\">该方案优点在于渲染性能非常好，一致性与 Native Flutter 几乎没有差别；缺点是内存占用大，且需要从远端加载字体。</p>\n<h4 id=\"heading-article_how-9\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-9\" class=\"heading-anchor\">#</a>MPFlutter 2.0 选型</h4>\n<p class=\"feishu-p\">我们在 1.x 版本中用的是 HTML Renderer，通过 kbone 运行的 DOM 模拟层存在很多的问题，最令人诟病的是数据更新后界面刷新慢。当然问题的并不在于 kbone，而是 MPFlutter 1.x 本身对于 Element Tree 的序列化、反序列化的处理存在天然的缺陷，尽管已经通过 Dirty 和 Diff 等手段优化。</p>\n<p class=\"feishu-p\">在 2.x 版本中，我们直接抛弃 HTML Renderer 的想法，使用 CanvasKit Renderer。</p>\n<p class=\"feishu-p\">使用 CanvasKit Renderer 有这几个大前提：</p>\n<ul class=\"feishu-ul\">\n    <li class=\"feishu-li\">微信小程序已支持 WebAssembly 并支持 Brotli 压缩；</li>\n    <li class=\"feishu-li\">微信小程序 Canvas 的性能相比最初的版本有质的提升，并支持 WebGL；</li>\n    <li class=\"feishu-li\">微信小程序全部分包限制放宽到 20M，足够使用。</li>\n</ul>\n<h4 id=\"heading-article_how-10\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-10\" class=\"heading-anchor\">#</a>Skia 裁剪</h4>\n<p class=\"feishu-p\">Skia 是 Google 开源的 2D 渲染库，凭借良好的跨设备能力，优秀的性能表现，在 Google 多个产品中被使用，包括 Chrome / Flutter / Android / Fuchsia 都有 Skia 的身影。</p>\n<p class=\"feishu-p\">Skia 屏蔽了不同设备、平台的具体实现，对外统一以标准的 RenderObject、RenderCommand 开放。</p>\n<p class=\"feishu-p\">Skia 其中一个 Render Target 是 WebGL，也就是 CanvasKit。</p>\n<p class=\"feishu-p\">然而 Flutter Web 默认使用的 CanvasKit 足有 6M 之大，即使使用 Brotli 压缩后仍然不符合小程序分包要求。</p>\n<p class=\"feishu-p\">我们可以通过指定编译选项的方式裁剪 CanvasKit 尺寸，以下是 MPFlutter 使用的 build 配置：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">bash</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-bash\">./modules/canvaskit/compile.sh release no_skottie no_sksl_trace no_alias_font no_effects_deserialization no_encode_jpeg no_encode_png no_encode_webp legacy_draw_vertices no_embedded_font no_woff2</code></pre>\n</div>\n<p class=\"feishu-p\">从配置可见，我们去掉了 skottie、image encoder、内置字体等不必要的功能，这些功能我们可以使用微信小程序 API 补充回来。</p>\n<p class=\"feishu-p\">Brotli 压缩后的 wasm 文件刚好符合 2M 分包要求。</p>\n<h4 id=\"heading-article_how-11\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-11\" class=\"heading-anchor\">#</a>CanvasKit 加载 </h4>\n<p class=\"feishu-p\">Skia 构建完成后，会得到两个产物，<code class=\"inline-code\">canvaskit.wasm</code> 和 <code class=\"inline-code\">canvaskit.js</code>。</p>\n<p class=\"feishu-p\"><code class=\"inline-code\">canvaskit.js</code> 暴露了 wasm 中的各个 c++ 方法调用，同时也提供加载 wasm 的脚手架。</p>\n<p class=\"feishu-p\">但是 <code class=\"inline-code\">canvaskit.js</code> 的实现默认是 Web 的，我们需要将其中的 <code class=\"inline-code\">fetch</code> 以及 <code class=\"inline-code\">WebAssembly</code> 替换为微信小程序对应的实现。</p>\n<p class=\"feishu-p\">这里提供一个使用 Skia 绘制红色矩形的微信小程序工程，有兴趣的同学可以下载到本地研究。</p>\n<div class=\"file-card\" style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(0,0,0,0.03);border:1px solid rgba(0,0,0,0.08);border-radius:8px;margin:12px 0;\">\n    <div class=\"file-icon\" style=\"font-size:24px;\">📦</div>\n    <div class=\"file-info\">\n        <div class=\"file-name\" style=\"font-weight:600;color:var(--text-color, #222);\">canvaskit-demo-0126.zip</div>\n        <div class=\"file-size\" style=\"font-size:12px;color:var(--text-secondary, #666);\">1.7 MB（工程配套附件模板）</div>\n    </div>\n</div>\n<h4 id=\"heading-article_how-12\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-12\" class=\"heading-anchor\">#</a>Flutter Web 在微信中运行</h4>\n<p class=\"feishu-p\">要使 Flutter Web 在微信中运行，最大难点在于 Flutter Web 要求的 Web API 如何补充完整。</p>\n<p class=\"feishu-p\">特别是 Document 、Window、Navigator 这些类，这些类我已经在 GitHub 上开源了，感兴趣的可以逐个文件阅读。</p>\n<p class=\"feishu-p\">https://github.com/mpflutter/mpflutter_build_tools/tree/master/wechat_flutter_js/flutter_bom</p>\n<p class=\"feishu-p\">这里举一个 window 的文件节选段落讲解：</p>\n<div class=\"feishu-code-block\">\n    <div class=\"code-block-bar\">\n        <span class=\"code-badge\">dart</span>\n        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n            <span>复制</span>\n        </button>\n    </div>\n    <pre><code class=\"language-dart\">export class FlutterMiniProgramMockWindow {\n  // screens\n  get devicePixelRatio() {\n    return wxSystemInfo.pixelRatio;\n  }\n\n  get innerWidth() {\n    return wxSystemInfo.windowWidth;\n  }\n\n  get innerHeight() {\n    return wxSystemInfo.windowHeight;\n  }\n\n  // webs\n  navigator = {\n    appVersion: &quot;&quot;,\n    platform: &quot;&quot;,\n    userAgent: &quot;&quot;,\n    vendor: &quot;&quot;,\n    language: &quot;zh&quot;,\n  };\n  \n  // 还有更多。。。\n}</code></pre>\n</div>\n<p class=\"feishu-p\">Flutter Web 在运行过程中，会通过 <code class=\"inline-code\">window.innerWidth</code> / <code class=\"inline-code\">window.innerHeight</code> 获取当前窗口宽高，以便下一步创建合适大小的画布用于渲染。</p>\n<p class=\"feishu-p\">在微信小程序中，我们需要使用 <code class=\"inline-code\">wx.getSystemInfoSync()</code> 获取对应宽高，并在 MockWindow 中返回给 Flutter。</p>\n<p class=\"feishu-p\">关于 BOM 的文件，就不详细展开，都是一些胶水代码。</p>\n<p class=\"feishu-p\">而 Flutter 的 main.dart.js 也需要有一些改造才可以跑在小程序上，主要的改造是通过 export main.dart.js 中的 main 函数，使其适配 CommonJS 可暴露给 Page 调用。</p>\n<h4 id=\"heading-article_how-13\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-13\" class=\"heading-anchor\">#</a>字体的加载</h4>\n<p class=\"feishu-p\">CanvasKit 最大的问题在于字体加载，目前来看是无法复用系统本身的字体的。</p>\n<p class=\"feishu-p\">我们的做法是通过裁剪 NotoSansSC 字体，只包含常用的 9000+ 汉字，内置于小程序包中优先加载它。</p>\n<p class=\"feishu-p\">这样有一个好处，小程序不需要强制从 gstatic 下载字体，省流省加载时间。</p>\n<p class=\"feishu-p\">后续，我们还会研究通过 Canvas 2D 的方式，从本地加载字体。</p>\n<h4 id=\"heading-article_how-14\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-article_how-14\" class=\"heading-anchor\">#</a>分包</h4>\n<p class=\"feishu-p\">关于分包，其实是最好做的，因为 Flutter Web 本身就有 defered load 编译能力。</p>\n<p class=\"feishu-p\">开发者可以轻松地将 main.dart.js 切分成若干个 JS 文件，我们做的就是在 Flutter Web 编译完成后，智能地将这些 JS 文件分配到不同的分包就好了。</p>\n<p class=\"feishu-p\">资源分包也同理，资源通过 brotli 压缩也可以减少包体积。</p>\n<h3 id=\"heading-article_how-15\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-article_how-15\" class=\"heading-anchor\">#</a>总结</h3>\n<p class=\"feishu-p\">整整一套下来，Flutter 已经可以在微信小程序里跑起来了，我们来总结一下做了什么？</p>\n<p class=\"feishu-p\">我们通过裁剪 Skia 使得 CanvasKit 可以很好地跑在小程序上，通过 BOM 兼容的方法，使得 Flutter Web 可以在微信小程序中找到对应实现，通过字体内置、智能分包的方式很好地解决了微信包体积限制。</p>\n<p class=\"feishu-p\">该方案目前已经完全跑通，并已可用，同学们可以在 http://v2.mpflutter.com 文档站了解到更多用法。</p>\n<p class=\"feishu-p\">如果对方案有任何疑问，也欢迎添加微信交流，感谢大家的关注。</p>\n","headings":[{"id":"heading-article_how-1","title":"10.1 在微信小程序里运行完整的 Flutter，怎么做到的？","level":2},{"id":"heading-article_how-2","title":"背景","level":3},{"id":"heading-article_how-3","title":"技术挑战","level":3},{"id":"heading-article_how-4","title":"技术方案","level":3},{"id":"heading-article_how-5","title":"Summary","level":4},{"id":"heading-article_how-6","title":"技术选型","level":4},{"id":"heading-article_how-7","title":"HTML Renderer","level":4},{"id":"heading-article_how-8","title":"CanvasKit Renderer","level":4},{"id":"heading-article_how-9","title":"MPFlutter 2.0 选型","level":4},{"id":"heading-article_how-10","title":"Skia 裁剪","level":4},{"id":"heading-article_how-11","title":"CanvasKit 加载 ","level":4},{"id":"heading-article_how-12","title":"Flutter Web 在微信中运行","level":4},{"id":"heading-article_how-13","title":"字体的加载","level":4},{"id":"heading-article_how-14","title":"分包","level":4},{"id":"heading-article_how-15","title":"总结","level":3}],"wordCount":490,"readTime":3,"file":"Blog Articles_在微信小程序里运行完整的 Flutter，怎么做到的？_LWhrw3gVtiLkK0kSD99cweyjnXn.html"},{"id":"article_video","chapterId":"chap_articles_and_cases","chapterTitle":"十一、深度技术博文与精选案例","title":"【Flutter观察】MPFlutter 2.0 视频实战教程","icon":"🎥","date":"2024年3月10日","html":"\n<h2 id=\"heading-article_video-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-article_video-1\" class=\"heading-anchor\">#</a>10.2 【Flutter观察】MPFlutter 2.0 视频实战教程</h2>\n\n\n<p class=\"feishu-p\">来自 <a href=\"https://space.bilibili.com/3994931\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">MKings-One</a> 网友的分享</p>\n\n\n<p class=\"feishu-p\">你可能还想问 (6)你可能还想问 (6)⭐微信小程序运行完整Flutter的实现方法🌈版本信息：各稳定版本依赖及修复问题汇总📸MPFlutter使用Packages：可用、不可用及应对🛠️Image编码：MPFlutter的图片编码方法及使用指南🕹️自制微信小程序Package：开发、使用与发布指南🎮MiniTex文本渲染器使用方法：Flutter与Web应用推荐内容由 AI 生成</p>\n\n\n<ul class=\"feishu-ul\">\n<li>Bilibili 视频地址：<a href=\"https://space.bilibili.com/3994931\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">MKings-One MPFlutter 2.0 观察与上手实战</a></li>\n</ul>\n\n\n<hr class=\"feishu-hr\" />\n\n\n","headings":[{"id":"heading-article_video-1","title":"10.2 【Flutter观察】MPFlutter 2.0 视频实战教程","level":2}],"wordCount":312,"readTime":1,"file":"Blog Articles_【Flutter观察】MPFlutter 2.0：使用Flutter快速开发高性能微信小程序_GZ0XwofijisGgbk4zOIcxTPlnLc.html"},{"id":"showcase","chapterId":"chap_articles_and_cases","chapterTitle":"十一、深度技术博文与精选案例","title":"MPFlutter 精彩生产案例 (音途 / 像素小画家)","icon":"🎨","date":"2024年3月10日","html":"\n<h2 id=\"heading-showcase-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-showcase-1\" class=\"heading-anchor\">#</a>10.3 MPFlutter 精彩生产案例</h2>\n\n\n<h3 id=\"heading-showcase-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-showcase-2\" class=\"heading-anchor\">#</a>像素小画家</h3>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/case_pixel_painter.jpeg\" alt=\"像素小画家\" class=\"zoomable-img\" onclick=\"openLightbox('./images/case_pixel_painter.jpeg', '像素小画家')\" />\n                <div class=\"image-caption\">像素小画家</div>\n            </div>\n\n\n<p class=\"feishu-p\">一款好用的像素原教旨主义创作工具，基于 mpflutter2.0 构建，拥有优秀的性能，流畅的交互，更多功能持续更新中…</p>\n\n\n<h3 id=\"heading-showcase-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-showcase-3\" class=\"heading-anchor\">#</a>觅音之旅</h3>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/case_music_journey_qr.png\" alt=\"觅音之旅小程序码\" class=\"zoomable-img\" onclick=\"openLightbox('./images/case_music_journey_qr.png', '觅音之旅小程序码')\" />\n                <div class=\"image-caption\">觅音之旅小程序码</div>\n            </div>\n\n\n<p class=\"feishu-p\">觅音将简约与宁静相结合，帮助您从快节奏中脱离，为您提供一个没有干扰的平静时空，保持专注、冥想片刻、放松思绪。</p>\n\n<ul class=\"feishu-ul\">\n<li><strong>源码开源地址</strong>：<a href=\"https://github.com/swiftdo/sound\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://github.com/swiftdo/sound</a></li>\n</ul>\n\n\n<h3 id=\"heading-showcase-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-showcase-4\" class=\"heading-anchor\">#</a>MPFlutter Wonderous</h3>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/case_pixel_painter_qr.png\" alt=\"Wonderous 博物案例\" class=\"zoomable-img\" onclick=\"openLightbox('./images/case_pixel_painter_qr.png', 'Wonderous 博物案例')\" />\n                <div class=\"image-caption\">Wonderous 博物案例</div>\n            </div>\n\n\n<p class=\"feishu-p\">Wonderous 是一个博物展示类小程序，是 MPFlutter 官方示例小程序，原始应用由 gskinner 开发并开源。</p>\n\n<ul class=\"feishu-ul\">\n<li><strong>源码开源地址</strong>：<a href=\"https://github.com/mpflutter/flutter-wonderous-app/tree/mpflutter\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://github.com/mpflutter/flutter-wonderous-app/tree/mpflutter</a></li>\n</ul>\n\n\n<h3 id=\"heading-showcase-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-showcase-5\" class=\"heading-anchor\">#</a>小周五子棋（小游戏）</h3>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/case_music_journey.jpeg\" alt=\"小周五子棋游戏封面\" class=\"zoomable-img\" onclick=\"openLightbox('./images/case_music_journey.jpeg', '小周五子棋游戏封面')\" />\n                <div class=\"image-caption\">小周五子棋游戏封面</div>\n            </div>\n\n\n<p class=\"feishu-p\">《小周五子棋》是一款五子棋小游戏，可以好友对战、匹配对战、人机对战，也可以面对面双人推演。</p>\n\n\n","headings":[{"id":"heading-showcase-1","title":"10.3 MPFlutter 精彩生产案例","level":2},{"id":"heading-showcase-2","title":"像素小画家","level":3},{"id":"heading-showcase-3","title":"觅音之旅","level":3},{"id":"heading-showcase-4","title":"MPFlutter Wonderous","level":3},{"id":"heading-showcase-5","title":"小周五子棋（小游戏）","level":3}],"wordCount":677,"readTime":2,"file":"18_精彩案例_BGMNwe6dAiOr6Rkn2oycF9y5nab.html"}];

        let currentArticleId = "overview";
        const articlesMap = {};
        ARTICLES_DATA.forEach(a => { articlesMap[a.id] = a; });

        // Initialize Tree
        function renderSidebarTree() {
            const navTree = document.getElementById("sidebarNavTree");
            let html = "";
            CHAPTERS_DATA.forEach(chap => {
                html += `<div class="chapter-group" id="${chap.id}">
                    <div class="chapter-header" onclick="toggleChapter('${chap.id}')">
                        <div class="chapter-header-left">
                            <span>${chap.icon}</span>
                            <span>${chap.title}</span>
                        </div>
                        <svg class="chapter-caret" viewBox="0 0 1024 1024"><path d="M831.872 340.777L512 652.672 192.128 340.777a32 32 0 0 0-45.12 45.44l342.4 333.568a32 32 0 0 0 45.184 0l342.4-333.568a32 32 0 0 0-45.12-45.44z"></path></svg>
                    </div>
                    <div class="chapter-items">`;
                
                chap.items.forEach(item => {
                    const art = articlesMap[item.id];
                    html += `<div class="article-nav-item" id="nav-${item.id}" onclick="switchArticle('${item.id}')">
                        <span class="article-item-icon">${item.icon}</span>
                        <span class="article-item-title" title="${item.title}">${item.title}</span>
                    </div>`;
                });
                
                html += `</div></div>`;
            });
            navTree.innerHTML = html;
        }

        function toggleChapter(chapId) {
            const group = document.getElementById(chapId);
            if (group) {
                group.classList.toggle("collapsed");
            }
        }

        // Switch active article
        function switchArticle(aid, hash) {
            const art = articlesMap[aid];
            if (!art) return;

            currentArticleId = aid;
            window.location.hash = aid;

            // Highlight sidebar item
            document.querySelectorAll(".article-nav-item").forEach(el => el.classList.remove("active"));
            const activeNav = document.getElementById("nav-" + aid);
            if (activeNav) {
                activeNav.classList.add("active");
                // ensure parent chapter expanded
                const parentGroup = activeNav.closest(".chapter-group");
                if (parentGroup) parentGroup.classList.remove("collapsed");
            }

            // Update Breadcrumb
            document.getElementById("breadcrumbArea").innerHTML = `<span>/</span> <span>${art.chapterTitle}</span> <span>/</span> <strong>${art.title}</strong>`;

            // Calculate Prev & Next
            const curIdx = ARTICLES_DATA.findIndex(a => a.id === aid);
            const prevArt = curIdx > 0 ? ARTICLES_DATA[curIdx - 1] : null;
            const nextArt = curIdx < ARTICLES_DATA.length - 1 ? ARTICLES_DATA[curIdx + 1] : null;

            let prevNextHtml = `<div class="article-footer-nav">`;
            if (prevArt) {
                prevNextHtml += `<a href="#${prevArt.id}" class="nav-btn-box" onclick="switchArticle('${prevArt.id}')">
                    <span class="nav-btn-label">← 上一篇</span>
                    <span class="nav-btn-title">${prevArt.icon} ${prevArt.title}</span>
                </a>`;
            } else {
                prevNextHtml += `<div></div>`;
            }
            if (nextArt) {
                prevNextHtml += `<a href="#${nextArt.id}" class="nav-btn-box" style="text-align:right" onclick="switchArticle('${nextArt.id}')">
                    <span class="nav-btn-label">下一篇 →</span>
                    <span class="nav-btn-title">${nextArt.icon} ${nextArt.title}</span>
                </a>`;
            } else {
                prevNextHtml += `<div></div>`;
            }
            prevNextHtml += `</div>`;

            // Render main viewport
            const viewport = document.getElementById("articleViewport");
            viewport.innerHTML = `
                <div class="article-meta-header">
                    <div class="article-badge-row">
                        <span class="badge-chapter">${art.chapterTitle}</span>
                        <span class="badge-updated">最近更新: ${art.date}</span>
                    </div>
                    <h1 class="article-h1-title">${art.icon} ${art.title}</h1>
                    <div class="article-stats-bar">
                        <div class="stat-item">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            <span>阅读时间约 ${art.readTime} 分钟</span>
                        </div>
                        <div class="stat-item">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            <span>全文约 ${art.wordCount} 字</span>
                        </div>
                        <div class="stat-item">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                            <span>已支持离线阅读与代码复制</span>
                        </div>
                    </div>
                </div>
                <div class="article-body-content">
                    ${art.html}
                </div>
                ${prevNextHtml}
            `;

            // Render outline
            renderOutline(art.headings);

            // Scroll to top or specific anchor
            if (hash) {
                setTimeout(() => {
                    const target = document.getElementById(hash);
                    if (target) target.scrollIntoView({ behavior: "smooth" });
                }, 50);
            } else {
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        }

        // Render Right Outline (TOC)
        function renderOutline(headings) {
            const outlineList = document.getElementById("outlineList");
            if (!headings || headings.length === 0) {
                outlineList.innerHTML = `<li class="outline-item" style="color:var(--text-tertiary); font-size:12px; padding:8px;">暂无子章节</li>`;
                return;
            }
            let html = "";
            headings.forEach(h => {
                html += `<li class="outline-item level-${h.level}">
                    <a href="#${h.id}" class="outline-link" id="toc-${h.id}" onclick="scrollToHeading('${h.id}', event)">${h.title}</a>
                </li>`;
            });
            outlineList.innerHTML = html;
            setupScrollSpy();
        }

        function scrollToHeading(hid, e) {
            e.preventDefault();
            const el = document.getElementById(hid);
            if (el) {
                el.scrollIntoView({ behavior: "smooth", block: "start" });
                document.querySelectorAll(".outline-link").forEach(l => l.classList.remove("active"));
                const tocEl = document.getElementById("toc-" + hid);
                if (tocEl) tocEl.classList.add("active");
            }
        }

        // ScrollSpy
        let scrollSpyObserver = null;
        function setupScrollSpy() {
            if (scrollSpyObserver) scrollSpyObserver.disconnect();
            const headingEls = document.querySelectorAll(".doc-heading");
            if (!headingEls.length) return;

            scrollSpyObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        document.querySelectorAll(".outline-link").forEach(l => l.classList.remove("active"));
                        const activeToc = document.getElementById("toc-" + id);
                        if (activeToc) activeToc.classList.add("active");
                    }
                });
            }, { rootMargin: "-80px 0px -70% 0px" });

            headingEls.forEach(h => scrollSpyObserver.observe(h));
        }

        // Copy Code Block
        function copyCode(btn) {
            const codeBlock = btn.closest(".feishu-code-block");
            const codeEl = codeBlock.querySelector("code");
            if (!codeEl) return;
            const text = codeEl.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.innerHTML;
                btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00b07c" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> <span style="color:#00b07c">已复制</span>`;
                showToast("已成功复制到剪贴板 ✓");
                setTimeout(() => { btn.innerHTML = orig; }, 2000);
            }).catch(err => {
                showToast("复制失败，请手动选择复制");
            });
        }

        function showToast(msg) {
            const t = document.getElementById("toastMsg");
            t.querySelector("span").innerText = msg;
            t.classList.add("show");
            setTimeout(() => { t.classList.remove("show"); }, 2500);
        }

        // Lightbox
        function openLightbox(src, alt) {
            const modal = document.getElementById("lightboxModal");
            const img = document.getElementById("lightboxImg");
            img.src = src;
            img.alt = alt || "";
            modal.classList.add("open");
        }

        function closeLightbox() {
            document.getElementById("lightboxModal").classList.remove("open");
        }

        // Sidebar live filter
        function filterSidebar(query) {
            const q = query.trim().toLowerCase();
            document.querySelectorAll(".chapter-group").forEach(group => {
                let matchCount = 0;
                group.querySelectorAll(".article-nav-item").forEach(item => {
                    const title = item.innerText.toLowerCase();
                    if (!q || title.includes(q)) {
                        item.style.display = "flex";
                        matchCount++;
                    } else {
                        item.style.display = "none";
                    }
                });
                if (q && matchCount > 0) {
                    group.classList.remove("collapsed");
                    group.style.display = "block";
                } else if (q && matchCount === 0) {
                    group.style.display = "none";
                } else {
                    group.style.display = "block";
                }
            });
        }

        // Search Modal
        function openSearchModal() {
            const modal = document.getElementById("searchModal");
            modal.classList.add("open");
            const input = document.getElementById("modalSearchInput");
            input.value = "";
            input.focus();
            document.getElementById("searchResultsList").innerHTML = `<div class="search-empty-state">输入关键字即可实时全文检索 42 篇技术文章与代码段</div>`;
        }

        function closeSearchModal(e) {
            if (e && e.target !== document.getElementById("searchModal")) return;
            document.getElementById("searchModal").classList.remove("open");
        }

        function handleSearchQuery(query) {
            const q = query.trim().toLowerCase();
            const resultsContainer = document.getElementById("searchResultsList");
            if (!q) {
                resultsContainer.innerHTML = `<div class="search-empty-state">输入关键字即可实时全文检索 42 篇技术文章与代码段</div>`;
                return;
            }

            const hits = [];
            ARTICLES_DATA.forEach(art => {
                const plainTitle = art.title.toLowerCase();
                const plainHtml = art.html.replace(/<[^>]+>/g, " ");
                const lowerText = plainHtml.toLowerCase();

                let score = 0;
                if (plainTitle.includes(q)) score += 10;
                const matchPos = lowerText.indexOf(q);
                if (matchPos !== -1) {
                    score += 5;
                    const start = Math.max(0, matchPos - 40);
                    const end = Math.min(lowerText.length, matchPos + 80);
                    const snippetRaw = plainHtml.substring(start, end).trim();
                    const snippet = snippetRaw.replace(new RegExp(q, "gi"), match => `<mark>${match}</mark>`);
                    hits.push({ art, score, snippet });
                } else if (score > 0) {
                    hits.push({ art, score, snippet: art.title });
                }
            });

            hits.sort((a, b) => b.score - a.score);

            if (hits.length === 0) {
                resultsContainer.innerHTML = `<div class="search-empty-state">未找到包含 "<strong>${htmlEscape(query)}</strong>" 的文档</div>`;
                return;
            }

            let html = "";
            hits.slice(0, 15).forEach(h => {
                html += `<div class="search-result-item" onclick="selectSearchResult('${h.art.id}')">
                    <div class="search-result-chapter">${h.art.chapterTitle}</div>
                    <div class="search-result-title">${h.art.icon} ${h.art.title}</div>
                    <div class="search-result-snippet">...${h.snippet}...</div>
                </div>`;
            });
            resultsContainer.innerHTML = html;
        }

        function selectSearchResult(aid) {
            document.getElementById("searchModal").classList.remove("open");
            switchArticle(aid);
        }

        function htmlEscape(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Theme Toggle
        function toggleTheme() {
            const cur = document.documentElement.getAttribute("data-theme");
            const next = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("mpflutter_theme", next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            document.getElementById("themeIcon").innerText = theme === "dark" ? "☀️" : "🌓";
        }

        // Keyboard navigation
        document.addEventListener("keydown", (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === "k") {
                e.preventDefault();
                openSearchModal();
            }
            if (e.key === "Escape") {
                closeSearchModal();
                closeLightbox();
            }
        });

        // Bootstrap on load
        function initApp() {
            const savedTheme = localStorage.getItem("mpflutter_theme") || "light";
            document.documentElement.setAttribute("data-theme", savedTheme);
            updateThemeIcon(savedTheme);

            renderSidebarTree();

            // Hash router
            const hash = window.location.hash.replace("#", "");
            if (hash && articlesMap[hash]) {
                switchArticle(hash);
            } else {
                switchArticle("overview");
            }
        }

        if (document.readyState === "loading") {
            window.addEventListener("DOMContentLoaded", initApp);
        } else {
            initApp();
        }

        window.addEventListener("hashchange", () => {
            const hash = window.location.hash.replace("#", "");
            if (hash && articlesMap[hash] && hash !== currentArticleId) {
                switchArticle(hash);
            }
        });
    </script>
</body>
</html>
