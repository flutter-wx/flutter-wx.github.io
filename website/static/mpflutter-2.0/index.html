<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPFlutter 2.0 官方文档中心 (100% 本地离线镜像)</title>
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-sidebar: #f5f6f7;
            --bg-header: #ffffff;
            --border-color: #dee0e3;
            --border-subtle: #ebedf0;
            --text-primary: #1f2329;
            --text-secondary: #646a73;
            --text-tertiary: #8f959e;
            --brand-color: #3370ff;
            --brand-hover: #245bdb;
            --brand-bg: #e1eaff;
            --brand-light: #f0f4ff;
            --code-bg: #1e1e1e;
            --code-text: #e6e6e6;
            --code-header-bg: #2d2d2d;
            --code-border: #3c3c3c;
            --callout-info-bg: #eef4fe;
            --callout-info-border: #3370ff;
            --callout-warn-bg: #fff8eb;
            --callout-warn-border: #ff9800;
            --table-header-bg: #f5f6f7;
            --table-hover-bg: #f7f8fa;
            --card-bg: #ffffff;
            --card-border: #dee0e3;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --outline-hover: #f0f1f2;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        [data-theme="dark"] {
            --bg-body: #17181a;
            --bg-sidebar: #1f2023;
            --bg-header: #1f2023;
            --border-color: #2d2f33;
            --border-subtle: #25262a;
            --text-primary: #f0f1f2;
            --text-secondary: #9ea3ab;
            --text-tertiary: #6b7078;
            --brand-color: #4a89ff;
            --brand-hover: #699fff;
            --brand-bg: #1c2b4d;
            --brand-light: #1f2838;
            --code-bg: #141517;
            --code-text: #f0f1f2;
            --code-header-bg: #1e2024;
            --code-border: #2d2f33;
            --callout-info-bg: #182338;
            --callout-info-border: #4a89ff;
            --callout-warn-bg: #2d2112;
            --callout-warn-border: #e68a00;
            --table-header-bg: #232529;
            --table-hover-bg: #282a2f;
            --card-bg: #1f2023;
            --card-border: #2d2f33;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            --outline-hover: #282a2f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-primary);
            background-color: var(--bg-body);
            -webkit-font-smoothing: antialiased;
        }

        /* Header Bar */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 16px;
        }

        .header-logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #3370ff, #00d6b9);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 2px 6px rgba(51,112,255,0.3);
        }

        .header-badge {
            font-size: 11px;
            padding: 2px 8px;
            background: #e1fbf4;
            color: #008765;
            border-radius: 12px;
            font-weight: 500;
            border: 1px solid rgba(0,135,101,0.2);
        }

        [data-theme="dark"] .header-badge {
            background: #0f3329;
            color: #4ce2b8;
            border-color: #174d3f;
        }

        .header-breadcrumbs {
            margin-left: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-breadcrumbs span {
            color: var(--text-tertiary);
        }

        .header-breadcrumbs strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        .header-center {
            flex: 1;
            max-width: 460px;
            margin: 0 24px;
        }

        .header-search-btn {
            width: 100%;
            height: 36px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-tertiary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .header-search-btn:hover {
            border-color: var(--brand-color);
            color: var(--text-secondary);
            background: var(--bg-body);
        }

        .search-shortcut-badge {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-header {
            height: 34px;
            padding: 0 12px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-primary);
            font-weight: 500;
        }

        .btn-header:hover {
            background: var(--bg-sidebar);
            border-color: var(--brand-color);
            color: var(--brand-color);
        }

        .btn-header-primary {
            background: var(--brand-color);
            border-color: var(--brand-color);
            color: white;
        }

        .btn-header-primary:hover {
            background: var(--brand-hover);
            border-color: var(--brand-hover);
            color: white;
        }

        .offline-status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #008765;
            background: #e1fbf4;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        [data-theme="dark"] .offline-status-indicator {
            background: #0f3329;
            color: #4ce2b8;
        }

        .offline-dot {
            width: 8px;
            height: 8px;
            background: #00b07c;
            border-radius: 50%;
            box-shadow: 0 0 6px #00b07c;
        }

        /* App Container */
        .app-container {
            display: flex;
            margin-top: 56px;
            min-height: calc(100vh - 56px);
        }

        /* Left Sidebar */
        .app-sidebar {
            width: 300px;
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            height: calc(100vh - 56px);
            position: sticky;
            top: 56px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .sidebar-filter-box {
            padding: 14px 16px 10px;
            position: sticky;
            top: 0;
            background: var(--bg-sidebar);
            z-index: 10;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sidebar-filter-input {
            width: 100%;
            height: 32px;
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }

        .sidebar-filter-input:focus {
            border-color: var(--brand-color);
        }

        .sidebar-tree {
            padding: 10px 8px 30px;
            flex: 1;
        }

        .chapter-group {
            margin-bottom: 6px;
        }

        .chapter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: background 0.15s;
        }

        .chapter-header:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .chapter-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chapter-caret {
            width: 14px;
            height: 14px;
            transition: transform 0.2s;
            fill: currentColor;
        }

        .chapter-group.collapsed .chapter-caret {
            transform: rotate(-90deg);
        }

        .chapter-group.collapsed .chapter-items {
            display: none;
        }

        .chapter-items {
            padding-left: 12px;
            margin-top: 2px;
        }

        .article-nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 2px;
            transition: all 0.15s;
            position: relative;
        }

        .article-nav-item:hover {
            background: var(--outline-hover);
        }

        .article-nav-item.active {
            background: var(--brand-bg);
            color: var(--brand-color);
            font-weight: 600;
        }

        .article-nav-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 4px;
            bottom: 4px;
            width: 3px;
            background: var(--brand-color);
            border-radius: 2px;
        }

        .article-item-icon {
            font-size: 14px;
            flex-shrink: 0;
        }

        .article-item-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Content View */
        .app-main {
            flex: 1;
            min-width: 0;
            display: flex;
            justify-content: center;
            background: var(--bg-body);
        }

        .article-container {
            width: 100%;
            max-width: 880px;
            padding: 40px 48px 80px;
            min-height: calc(100vh - 56px);
        }

        /* Article Meta */
        .article-meta-header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .article-badge-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .badge-chapter {
            font-size: 12px;
            color: var(--brand-color);
            background: var(--brand-bg);
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: 500;
        }

        .badge-updated {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .article-h1-title {
            font-size: 30px;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .article-stats-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Typography & Feishu Style */
        .doc-heading {
            color: var(--text-primary);
            font-weight: 600;
            margin-top: 36px;
            margin-bottom: 14px;
            position: relative;
            scroll-margin-top: 80px;
        }

        .doc-heading-h2 {
            font-size: 22px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 8px;
        }

        .doc-heading-h3 {
            font-size: 18px;
        }

        .doc-heading-h4 {
            font-size: 15px;
        }

        .heading-anchor {
            opacity: 0;
            position: absolute;
            left: -20px;
            color: var(--text-tertiary);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .doc-heading:hover .heading-anchor {
            opacity: 1;
        }

        .feishu-p {
            margin-bottom: 16px;
            line-height: 1.8;
            color: var(--text-primary);
        }

        .feishu-link {
            color: var(--brand-color);
            text-decoration: none;
            border-bottom: 1px solid rgba(51,112,255,0.3);
            transition: border-color 0.2s;
        }

        .feishu-link:hover {
            border-bottom-color: var(--brand-color);
        }

        .inline-code {
            font-family: var(--font-mono);
            font-size: 13px;
            background: var(--bg-sidebar);
            color: #d13438;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        [data-theme="dark"] .inline-code {
            color: #f87171;
        }

        .feishu-hr {
            border: none;
            height: 1px;
            background: var(--border-color);
            margin: 32px 0;
        }

        /* Lists */
        .feishu-ul, .feishu-ol {
            padding-left: 24px;
            margin-bottom: 16px;
            line-height: 1.8;
        }

        .feishu-ul li, .feishu-ol li {
            margin-bottom: 6px;
        }

        /* Code Block */
        .feishu-code-block {
            background: var(--code-bg);
            border-radius: 8px;
            margin: 20px 0;
            overflow: hidden;
            border: 1px solid var(--code-border);
            box-shadow: var(--shadow-sm);
        }

        .code-block-bar {
            background: var(--code-header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            border-bottom: 1px solid var(--code-border);
        }

        .code-badge {
            font-size: 11px;
            font-family: var(--font-mono);
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .code-copy-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            color: #c0c0c0;
            padding: 3px 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .code-copy-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
            border-color: rgba(255,255,255,0.3);
        }

        .feishu-code-block pre {
            margin: 0;
            padding: 16px;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 13.5px;
            line-height: 1.65;
            color: var(--code-text);
        }

        /* Callout Box */
        .callout-card {
            border-radius: 8px;
            padding: 16px 20px;
            margin: 22px 0;
            border-left: 4px solid var(--callout-info-border);
            background: var(--callout-info-bg);
        }

        .callout-card.callout-important {
            border-left-color: #3370ff;
            background: var(--callout-info-bg);
        }

        .callout-card.callout-warning {
            border-left-color: #ff9800;
            background: var(--callout-warn-bg);
        }

        .callout-card.callout-tip {
            border-left-color: #00b07c;
            background: #e6f9f3;
        }

        [data-theme="dark"] .callout-card.callout-tip {
            background: #0d3023;
        }

        .callout-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .callout-icon {
            font-size: 16px;
        }

        .callout-content {
            font-size: 14px;
            line-height: 1.7;
        }

        .callout-content p {
            margin-bottom: 8px;
        }

        .callout-content p:last-child {
            margin-bottom: 0;
        }

        /* File Download Card */
        .feishu-file-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px 18px;
            margin: 20px 0;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .feishu-file-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--brand-color);
        }

        .file-card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .file-card-icon-wrap {
            flex-shrink: 0;
        }

        .file-card-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .file-card-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .file-size-badge {
            font-weight: 600;
            color: var(--brand-color);
        }

        .file-card-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-card {
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-card-download {
            background: var(--brand-color);
            color: white;
            border: 1px solid var(--brand-color);
        }

        .btn-card-download:hover {
            background: var(--brand-hover);
            border-color: var(--brand-hover);
        }

        .btn-card-browse {
            background: var(--bg-sidebar);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-card-browse:hover {
            background: var(--outline-hover);
            border-color: var(--brand-color);
            color: var(--brand-color);
        }

        /* Images */
        .article-image-box {
            margin: 24px 0;
            text-align: center;
        }

        .zoomable-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            cursor: zoom-in;
            transition: transform 0.2s;
        }

        .zoomable-img:hover {
            transform: scale(1.01);
        }

        .image-caption {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 8px;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            margin: 22px 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }

        .feishu-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            text-align: left;
        }

        .feishu-table th {
            background: var(--table-header-bg);
            color: var(--text-secondary);
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .feishu-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-primary);
        }

        .feishu-table tr:last-child td {
            border-bottom: none;
        }

        .feishu-table tr:hover td {
            background: var(--table-hover-bg);
        }

        /* Article Footer Pagination */
        .article-footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            gap: 16px;
        }

        .nav-btn-box {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            padding: 14px 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            transition: all 0.2s;
            max-width: 48%;
            flex: 1;
        }

        .nav-btn-box:hover {
            border-color: var(--brand-color);
            box-shadow: var(--shadow-sm);
        }

        .nav-btn-label {
            font-size: 11px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .nav-btn-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--brand-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Right Outline (TOC) */
        .app-outline {
            width: 240px;
            flex-shrink: 0;
            position: sticky;
            top: 56px;
            height: calc(100vh - 56px);
            overflow-y: auto;
            padding: 30px 16px;
            user-select: none;
        }

        .outline-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-left: 8px;
        }

        .outline-list {
            list-style: none;
        }

        .outline-item {
            margin-bottom: 2px;
        }

        .outline-link {
            display: block;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12.5px;
            color: var(--text-secondary);
            text-decoration: none;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s;
        }

        .outline-link:hover {
            color: var(--text-primary);
            background: var(--outline-hover);
        }

        .outline-link.active {
            color: var(--brand-color);
            font-weight: 600;

        const ARTICLES_DATA = [{"id": "overview", "chapterId": "chap_overview", "chapterTitle": "一、MPFlutter 2.0 简介", "title": "MPFlutter 2.0 简介", "icon": "🚅", "date": "2025年1月26日", "html": "\n<h2 id=\"heading-overview-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-overview-1\" class=\"heading-anchor\">#</a>一、MPFlutter 2.0 简介</h2>\n\n\n<p class=\"feishu-p\">你正在阅读的是 MPFlutter 2.0 版本文档，1.0 已正式废弃，请勿阅读相关文档。</p>\n\n\n<p class=\"feishu-p\">MPFlutter 已适配原生鸿蒙微信小程序，请移步『版本信息』更新至最新版本，重新编译小程序上传。</p>\n\n\n\n<h3 id=\"heading-overview-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-overview-2\" class=\"heading-anchor\">#</a>什么是 MPFlutter</h3>\n\n\n<p class=\"feishu-p\">MPFlutter 是一款用于构建小程序的开发框架，基于 Flutter 构建，开发体验无限接近于 Flutter 原生应用。</p>\n\n\n<p class=\"feishu-p\">你可以基于 MPFlutter 开发以下平台的小程序、小游戏：</p>\n\n<ul class=\"feishu-ul\">\n<li>微信小程序</li>\n<li>微信小游戏</li>\n<li>抖音小程序（WIP）</li>\n</ul>\n\n\n<h3 id=\"heading-overview-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-overview-3\" class=\"heading-anchor\">#</a>原生 Flutter 开发体验</h3>\n\n\n<p class=\"feishu-p\">MPFlutter 的目标是，在尽可能保留 Flutter 开发体验的同时，降低应用迁移到微信小程序的成本。</p>\n\n\n<p class=\"feishu-p\">我们已经实现以下能力：</p>\n\n<ul class=\"feishu-ul\">\n<li>无缝迁移</li>\n<li>无须裁剪 Flutter Framework，你可以使用 Material / Cupertino 这些官方组件搭建 UI。</li>\n<li>自适应的构建脚本，构建小程序就像构建原生应用一般简单。</li>\n<li>完整的分包支持，适应小程序分包大小限制，静态资源、代码都可以轻松分包。</li>\n<li>实时预览能力</li>\n<li>快速预览，在 Desktop 上使用 Hot Reload / Hot Restart 快速预览界面及应用逻辑</li>\n<li>跨端联调，在 Desktop 预览的基础上，可连接到微信宿主，远程调用端上接口。</li>\n<li>纯正的 Flutter</li>\n<li>支持 Flutter 3.13 以上版本，并且保证跟随官方升级而升级。</li>\n<li>完全一致的 Flutter 插件体系，开发 MPFlutter 插件就像开发 Flutter 插件一样简单。</li>\n<li>完全一致的 Pub 包管理系统，开发好的插件直接上传官方包管理平台即可使用。</li>\n</ul>\n\n<p class=\"feishu-p\">总的来说，MPFlutter 就是尽可能地帮助你以低成本的方式构建微信小程序。</p>\n\n\n\n<h3 id=\"heading-overview-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-overview-4\" class=\"heading-anchor\">#</a>高性能的渲染体验</h3>\n\n\n<p class=\"feishu-p\">MPFlutter 2.0 使用 Skia + WebGL 渲染，对于 MPFlutter 1.0，性能提升是非常明显的。</p>\n\n\n<p class=\"feishu-p\">具体体验在以下场景：</p>\n\n<ul class=\"feishu-ul\">\n<li>频繁更新的界面</li>\n<li>不再通过 WXML <-> JS 双向传递数据，直接通过 JS 控制 WebGL 渲染，只要 Widget 层级合理，可以做到毫秒级驱动界面更新。</li>\n<li>使用 WebGL 驱动渲染，可提升渲染缓存灵活性，你可以使用 RepaintBoundary 进一步提升界面帧率。</li>\n<li>频繁的事件交互</li>\n<li>事件的接收不再单纯依赖宿主小程序的回传，MPFlutter 仅接收最基本的触摸、键盘事件，后续的事件分发全部交回 Flutter Framework 处理。</li>\n<li>这意味着你可以在小程序中获取更多、更实时的事件。</li>\n</ul>\n\n\n", "headings": [{"id": "heading-overview-1", "title": "一、MPFlutter 2.0 简介", "level": 2}, {"id": "heading-overview-2", "title": "什么是 MPFlutter", "level": 3}, {"id": "heading-overview-3", "title": "原生 Flutter 开发体验", "level": 3}, {"id": "heading-overview-4", "title": "高性能的渲染体验", "level": 3}], "wordCount": 1123, "readTime": 3, "file": "01_MPFlutter 2.0_TayPw6pxKiZGdxkNe4bcmSnNnSg.html"}, {"id": "getting_started", "chapterId": "chap_getting_started", "chapterTitle": "二、起步指南", "title": "起步指南概述", "icon": "🚀", "date": "2024年3月12日", "html": "\n<h2 id=\"heading-getting_started-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-getting_started-1\" class=\"heading-anchor\">#</a>二、起步指南</h2>\n\n\n", "headings": [{"id": "heading-getting_started-1", "title": "二、起步指南", "level": 2}], "wordCount": 11, "readTime": 1, "file": "02_起步指南_Wh0OwQF0oiUKrIkyLHrcgwMfn6d.html"}, {"id": "env_install", "chapterId": "chap_getting_started", "chapterTitle": "二、起步指南", "title": "环境安装与依赖配置", "icon": "💻", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-env_install-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-env_install-1\" class=\"heading-anchor\">#</a>2.1 环境安装与依赖配置</h2>\n\n\n<p class=\"feishu-p\">本指南不太适合完全零基础的 Flutter 开发者阅读。</p>\n\n\n<p class=\"feishu-p\">在正式体验 MPFlutter 前，强烈建议你先从基本的 Flutter 开始学习，先使用 Flutter 完成一个桌面应用或移动应用编写。</p>\n\n\n\n<h3 id=\"heading-env_install-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-2\" class=\"heading-anchor\">#</a>Flutter SDK</h3>\n\n\n<p class=\"feishu-p\">版本要求：>= 3.13 & <= 3.16.7 或 >= 3.22</p>\n\n\n<p class=\"feishu-p\">安装方法：<a href=\"https://flutter.cn/docs/get-started/install\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://flutter.cn/docs/get-started/install</a></p>\n\n\n\n<h3 id=\"heading-env_install-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-3\" class=\"heading-anchor\">#</a>操作系统</h3>\n\n\n<p class=\"feishu-p\">你可以使用 Windows / macOS / Linux 完成 MPFlutter 应用开发、调试。</p>\n\n\n<p class=\"feishu-p\">由于微信开发者工具未提供 Linux 版本，因此不建议你使用 Linux 作为主要开发机。</p>\n\n\n\n<h3 id=\"heading-env_install-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-4\" class=\"heading-anchor\">#</a>编辑工具</h3>\n\n\n<p class=\"feishu-p\">你可以使用 VSCode / Android Studio / IntelliJ IDEA 完成 MPFlutter 应用开发，需要在对应编辑器中安装 Flutter 插件。</p>\n\n\n<p class=\"feishu-p\">配置方法：<a href=\"https://flutter.cn/docs/get-started/editor\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://flutter.cn/docs/get-started/editor</a></p>\n\n\n\n<h3 id=\"heading-env_install-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-5\" class=\"heading-anchor\">#</a>微信开发者工具</h3>\n\n\n<p class=\"feishu-p\">我们需要使用「微信开发者工具」进行小程序预览、上传、发布操作。</p>\n\n\n<p class=\"feishu-p\">下载地址：<a href=\"https://developers.weixin.qq.com/miniprogram/dev/devtools/stable.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://developers.weixin.qq.com/miniprogram/dev/devtools/stable.html</a></p>\n\n\n<p class=\"feishu-p\">强烈建议你在下载完成工具以后，体验一下基本的小程序开发知识，特别是预览、上传的操作，具体方法请阅读微信官方文档。</p>\n\n\n\n<h3 id=\"heading-env_install-6\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-6\" class=\"heading-anchor\">#</a>Brotli</h3>\n\n\n<p class=\"feishu-p\">Brotli 是一种用于数据压缩的开源算法，它能够提供高效的压缩比和快速的解压缩速度。Brotli 算法由 Google 开发，最初用于其 Chrome 浏览器中的数据压缩，后来成为了开放的标准。</p>\n\n\n<p class=\"feishu-p\">MPFlutter 使用 Brotli 压缩资源文件，你必须在电脑上安装 brotli 命令行程序，并添加它到 PATH 中。</p>\n\n\n<p class=\"feishu-p\">下面是在各个平台上安装 Brotli 的方法：</p>\n\n\n<p class=\"feishu-p\">1.Linux:</p>\n<ul class=\"feishu-ul\">\n<li>使用包管理器安装：大多数 Linux 发行版都提供了 Brotli 的软件包。你可以使用包管理器（如apt、yum、dnf等）来安装，具体命令可能因发行版而异。例如，在 Ubuntu 上，你可以运行以下命令安装 Brotli：</li>\n</ul>\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">code</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-\">sudo apt-get install brotli</code></pre>\n                </div>\n\n<ul class=\"feishu-ul\">\n<li>从源代码构建：你也可以从 Brotli 的 GitHub 仓库中获取源代码并进行构建。以下是获取和构建 Brotli 的命令：</li>\n</ul>\n\n\n<h3 id=\"heading-env_install-7\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-env_install-7\" class=\"heading-anchor\">#</a>Brotli 在各大操作系统的安装命令指南</h3>\n\n<p class=\"feishu-p\">Brotli 是一种用于高效数据压缩的开源算法，MPFlutter 在构建阶段使用 Brotli 压缩核心资源文件，因此开发环境必须安装 <code class=\"inline-code\">brotli</code> 命令行并将其添加至环境变量 <code class=\"inline-code\">PATH</code> 中：</p>\n<ul class=\"feishu-ul\">\n<li><strong>macOS</strong>:</li>\n</ul>\n\n<p class=\"feishu-p\">```bash</p>\n\n<p class=\"feishu-p\">brew install brotli</p>\n\n<p class=\"feishu-p\">```</p>\n<ul class=\"feishu-ul\">\n<li><strong>Ubuntu / Debian</strong>:</li>\n</ul>\n\n<p class=\"feishu-p\">```bash</p>\n\n<p class=\"feishu-p\">sudo apt-get install brotli</p>\n\n<p class=\"feishu-p\">```</p>\n<ul class=\"feishu-ul\">\n<li><strong>Windows</strong>:</li>\n<li>推荐使用包管理器安装：<code class=\"inline-code\">winget install Google.Brotli</code> 或 <code class=\"inline-code\">vcpkg install brotli</code></li>\n<li>或从 <a href=\"https://github.com/google/brotli/releases\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Google Brotli 官方 GitHub Releases</a> 下载对应 zip，解压并把 <code class=\"inline-code\">brotli.exe</code> 路径加入系统环境变量 <code class=\"inline-code\">PATH</code>。</li>\n<li><strong>验证安装</strong>：</li>\n</ul>\n\n<p class=\"feishu-p\">在终端中运行 <code class=\"inline-code\">brotli --version</code>，若正常输出版本号即安装成功。</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-env_install-1", "title": "2.1 环境安装与依赖配置", "level": 2}, {"id": "heading-env_install-2", "title": "Flutter SDK", "level": 3}, {"id": "heading-env_install-3", "title": "操作系统", "level": 3}, {"id": "heading-env_install-4", "title": "编辑工具", "level": 3}, {"id": "heading-env_install-5", "title": "微信开发者工具", "level": 3}, {"id": "heading-env_install-6", "title": "Brotli", "level": 3}, {"id": "heading-env_install-7", "title": "Brotli 在各大操作系统的安装命令指南", "level": 3}], "wordCount": 1735, "readTime": 5, "file": "03_环境安装_HsMzwcGKNioPlAkh9pPc8NfznIf.html"}, {"id": "first_app", "chapterId": "chap_getting_started", "chapterTitle": "二、起步指南", "title": "编写第一个 MPFlutter 微信小程序", "icon": "📱", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-first_app-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-first_app-1\" class=\"heading-anchor\">#</a>2.2 编写第一个 MPFlutter 微信小程序</h2>\n\n\n\n<h3 id=\"heading-first_app-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_app-2\" class=\"heading-anchor\">#</a>从模板工程开始</h3>\n\n\n<p class=\"feishu-p\">直接下载以下任意一个 awesome_project 并解压：</p>\n\n\n\n\n<div class=\"feishu-file-card\">\n            <div class=\"file-card-left\">\n                <div class=\"file-card-icon-wrap\">\n                    <svg class=\"file-zip-svg\" width=\"36\" height=\"36\" viewBox=\"0 0 32 32\" fill=\"none\">\n                        <path d=\"M1.5 0h14.086a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V26.5a1.5 1.5 0 01-1.5 1.5h-19A1.5 1.5 0 010 26.5v-25A1.5 1.5 0 011.5 0z\" fill=\"#3370FF\"/>\n                        <path d=\"M16.293.293l5.414 5.414A1 1 0 0121.91 6H17.5A1.5 1.5 0 0116 4.5V.09a1 1 0 01.293.203z\" fill=\"#245BDB\"/>\n                        <rect x=\"7\" y=\"11\" width=\"18\" height=\"14\" rx=\"2\" fill=\"#FFFFFF\" fill-opacity=\"0.2\"/>\n                        <text x=\"8\" y=\"21\" fill=\"#FFFFFF\" font-size=\"8\" font-weight=\"bold\" font-family=\"monospace\">ZIP</text>\n                    </svg>\n                </div>\n                <div class=\"file-card-info\">\n                    <div class=\"file-card-title\">awesome_project_275.zip</div>\n                    <div class=\"file-card-subtitle\">Skia Font 版本，起始包体积 5 M，内置常用中文字体支持 • <span class=\"file-size-badge\">2.2 MB</span> • 100% 离线可用</div>\n                </div>\n            </div>\n            <div class=\"file-card-actions\">\n                <a href=\"./awesome_project_275.zip\" download class=\"btn-card btn-card-download\" title=\"下载本地 ZIP 包\">\n                    <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"/></svg>\n                    下载 ZIP\n                </a>\n                <a href=\"./awesome_project/\" class=\"btn-card btn-card-browse\" target=\"_blank\" title=\"浏览本地已解压工程\">\n                    <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z\"/></svg>\n                    已解压目录\n                </a>\n            </div>\n        </div>\n\n\n\n<div class=\"feishu-file-card\">\n            <div class=\"file-card-left\">\n                <div class=\"file-card-icon-wrap\">\n                    <svg class=\"file-zip-svg\" width=\"36\" height=\"36\" viewBox=\"0 0 32 32\" fill=\"none\">\n                        <path d=\"M1.5 0h14.086a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V26.5a1.5 1.5 0 01-1.5 1.5h-19A1.5 1.5 0 010 26.5v-25A1.5 1.5 0 011.5 0z\" fill=\"#3370FF\"/>\n                        <path d=\"M16.293.293l5.414 5.414A1 1 0 0121.91 6H17.5A1.5 1.5 0 0116 4.5V.09a1 1 0 01.293.203z\" fill=\"#245BDB\"/>\n                        <rect x=\"7\" y=\"11\" width=\"18\" height=\"14\" rx=\"2\" fill=\"#FFFFFF\" fill-opacity=\"0.2\"/>\n                        <text x=\"8\" y=\"21\" fill=\"#FFFFFF\" font-size=\"8\" font-weight=\"bold\" font-family=\"monospace\">ZIP</text>\n                    </svg>\n                </div>\n                <div class=\"file-card-info\">\n                    <div class=\"file-card-title\">awesome_project_minitex_275.zip</div>\n                    <div class=\"file-card-subtitle\">MiniTex 版本，起始包体积仅 1.5 M，免字体网络加载 • <span class=\"file-size-badge\">2.2 MB</span> • 100% 离线可用</div>\n                </div>\n            </div>\n            <div class=\"file-card-actions\">\n                <a href=\"./awesome_project_minitex_275.zip\" download class=\"btn-card btn-card-download\" title=\"下载本地 ZIP 包\">\n                    <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"/></svg>\n                    下载 ZIP\n                </a>\n                <a href=\"./awesome_project_minitex/\" class=\"btn-card btn-card-browse\" target=\"_blank\" title=\"浏览本地已解压工程\">\n                    <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z\"/></svg>\n                    已解压目录\n                </a>\n            </div>\n        </div>\n\n\n<p class=\"feishu-p\">解压后，可见这是一个标准的 Flutter 工程。</p>\n\n\n<p class=\"feishu-p\">这个工程存在以下文件，是 MPFlutter 专有的。</p>\n\n\n<p class=\"feishu-p\">fonts</p>\n\n\n<p class=\"feishu-p\">文件夹</p>\n\n\n<p class=\"feishu-p\">存放内置于小程序包的字体文件</p>\n\n\n<p class=\"feishu-p\">wechat</p>\n\n\n<p class=\"feishu-p\">文件夹</p>\n\n\n<p class=\"feishu-p\">存放微信小程序工程文件</p>\n\n<ul class=\"feishu-ul\">\n<li>可修改 wechat/project.config.json 中的工程配置</li>\n<li>可添加额外的小程序逻辑、资源到该工程</li>\n</ul>\n\n<p class=\"feishu-p\">scripts</p>\n\n\n<p class=\"feishu-p\">文件夹</p>\n\n\n<p class=\"feishu-p\">存放构建脚本</p>\n\n\n<p class=\"feishu-p\">另外，lib/main.dart 也和普通的 Flutter 工程不一样，具体是：</p>\n\n<ul class=\"feishu-ul\">\n<li>runApp 换成 runMPApp</li>\n<li>navigatorObservers 必须包含 MPNavigatorObserver</li>\n</ul>\n\n<p class=\"feishu-p\">除此以外，Flutter 所允许编写的任何代码、依赖库都可以在 MPFlutter 中使用。</p>\n\n\n\n<h3 id=\"heading-first_app-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_app-3\" class=\"heading-anchor\">#</a>Flutter SDK 版本支持情况</h3>\n\n\n<p class=\"feishu-p\">Flutter SDK >3.16.7 and <3.22.0以及 > 3.29 是不被支持的。</p>\n\n\n<p class=\"feishu-p\">当你使用 3.22+ SDK 时，请确保 pubspec.yaml 中的 environment.sdk 设置正确：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">environment:\n  sdk: &quot;&gt;=3.4.0 &lt;4.0.0&quot;</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">当你使用 3.16.7- SDK，也需要确保该值如下方所示：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">environment:\n  sdk: &quot;&gt;=3.2.0 &lt;4.0.0&quot;</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">不正确的设置会导致构建失败。</p>\n\n\n\n<h3 id=\"heading-first_app-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_app-4\" class=\"heading-anchor\">#</a>FVM</h3>\n\n\n<p class=\"feishu-p\">从 2.6.0 版本开始，MPFlutter 支持使用 fvm 构建，请在解压后的工程目录下使用 fvm use 命令完成初始化。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">fvm use 3.16.7</code></pre>\n                </div>\n\n\n\n<h3 id=\"heading-first_app-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_app-5\" class=\"heading-anchor\">#</a>构建应用命令与步骤详解</h3>\n<ol class=\"feishu-ol\">\n<li><strong>执行构建命令</strong>：</li>\n</ol>\n\n<p class=\"feishu-p\">在小程序工程根目录下执行：</p>\n\n<p class=\"feishu-p\">```bash</p>\n\n<p class=\"feishu-p\">dart scripts/build_wechat.dart</p>\n\n<p class=\"feishu-p\">```</p>\n\n<p class=\"feishu-p\">如果使用 FVM 管理 Flutter 版本，则运行：</p>\n\n<p class=\"feishu-p\">```bash</p>\n\n<p class=\"feishu-p\">fvm dart scripts/build_wechat.dart</p>\n\n<p class=\"feishu-p\">```</p>\n<ol class=\"feishu-ol\">\n<li><strong>导入微信开发者工具</strong>：</li>\n</ol>\n\n<ul class=\"feishu-ul\">\n<li>打开「微信开发者工具」；</li>\n<li>点击「导入工程」；</li>\n<li>项目目录选择模板工程中的 <code class=\"inline-code\">wechat</code> 目录；</li>\n<li>AppID 填入你注册的微信小程序测试号或正式 AppID；</li>\n<li>导入后即可直接在微信开发者工具中进行实时预览、断点调试及上传发布。</li>\n</ul>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-first_app-1", "title": "2.2 编写第一个 MPFlutter 微信小程序", "level": 2}, {"id": "heading-first_app-2", "title": "从模板工程开始", "level": 3}, {"id": "heading-first_app-3", "title": "Flutter SDK 版本支持情况", "level": 3}, {"id": "heading-first_app-4", "title": "FVM", "level": 3}, {"id": "heading-first_app-5", "title": "构建应用命令与步骤详解", "level": 3}], "wordCount": 2903, "readTime": 9, "file": "04_编写第一个 MPFlutter 微信小程序_I45wwTI9XiH0AXkvQUEc2jZ8nFP.html"}, {"id": "first_game", "chapterId": "chap_getting_started", "chapterTitle": "二、起步指南", "title": "编写第一个 MPFlutter 微信小游戏", "icon": "🎮", "date": "2024年4月21日", "html": "\n<h2 id=\"heading-first_game-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-first_game-1\" class=\"heading-anchor\">#</a>2.3 编写第一个 MPFlutter 微信小游戏</h2>\n\n\n<p class=\"feishu-p\">收到反馈：Flutter 3.16.8 存在白屏及包体积增大问题，请使用 3.16.7 以下版本。</p>\n\n\n\n<h3 id=\"heading-first_game-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_game-2\" class=\"heading-anchor\">#</a>从模板工程开始</h3>\n\n\n<p class=\"feishu-p\">直接下载以下 awesome_game_template 并解压</p>\n\n\n<p class=\"feishu-p\">解压后，可见这是一个标准的 Flutter 游戏工程，使用 Flame 框架开发。</p>\n\n\n<p class=\"feishu-p\">这个工程存在以下文件，是 MPFlutter 专有的。</p>\n\n\n<p class=\"feishu-p\">fonts</p>\n\n\n<p class=\"feishu-p\">文件夹</p>\n\n\n<p class=\"feishu-p\">存放内置于小游戏包的字体文件</p>\n\n\n<p class=\"feishu-p\">wegame</p>\n\n\n<p class=\"feishu-p\">文件夹</p>\n\n\n<p class=\"feishu-p\">存放微信小游戏工程文件</p>\n\n<ul class=\"feishu-ul\">\n<li><a href=\"https://developers.weixin.qq.com/minigame/dev/reference/configuration/app.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">可修改 wegame/game.json 中的游戏配置</a></li>\n<li>可修改 wegame/project.config.json 中的工程配置</li>\n<li>可添加额外的小游戏逻辑、资源到该工程</li>\n</ul>\n\n<p class=\"feishu-p\">scripts</p>\n\n\n<p class=\"feishu-p\">文件夹</p>\n\n\n<p class=\"feishu-p\">存放构建脚本</p>\n\n\n<p class=\"feishu-p\">另外，lib/main.dart 也和普通的 Flutter 工程不一样，具体是：</p>\n\n<ul class=\"feishu-ul\">\n<li>runApp 换成 runMPApp</li>\n</ul>\n\n<p class=\"feishu-p\">除此以外，Flutter 所允许编写的任何代码、依赖库都可以在 MPFlutter 中使用。</p>\n\n\n\n<h3 id=\"heading-first_game-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_game-3\" class=\"heading-anchor\">#</a>Flutter SDK 版本支持情况</h3>\n\n\n<p class=\"feishu-p\">Flutter SDK >3.16.7 and <3.22.0以及 > 3.27 是不被支持的。</p>\n\n\n<p class=\"feishu-p\">当你使用 3.22+ SDK 时，请确保 pubspec.yaml 中的 environment.sdk 设置正确：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">\n  sdk: &quot;&gt;=3.4.0 &lt;4.0.0&quot;</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">当你使用 3.16.7- SDK，也需要确保该值如下方所示：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\">\n  sdk: &quot;&gt;=3.2.0 &lt;4.0.0&quot;</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">不正确的设置会导致构建失败。</p>\n\n\n\n<h3 id=\"heading-first_game-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_game-4\" class=\"heading-anchor\">#</a>构建应用</h3>\n\n\n<p class=\"feishu-p\">在命令行下，执行以下命令构建微信小程序：</p>\n\n\n\n<h3 id=\"heading-first_game-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-first_game-5\" class=\"heading-anchor\">#</a>构建小游戏命令与步骤</h3>\n<ol class=\"feishu-ol\">\n<li><strong>执行构建命令</strong>：</li>\n</ol>\n\n<p class=\"feishu-p\">在小游戏工程根目录下执行：</p>\n\n<p class=\"feishu-p\">```bash</p>\n\n<p class=\"feishu-p\">dart scripts/build_wegame.dart</p>\n\n<p class=\"feishu-p\">```</p>\n<ol class=\"feishu-ol\">\n<li><strong>导入微信开发者工具</strong>：</li>\n</ol>\n\n<ul class=\"feishu-ul\">\n<li>项目目录选择模板工程中的 <code class=\"inline-code\">wegame</code> 目录；</li>\n<li>选择「微信小游戏」模式导入即可开始调试。</li>\n</ul>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-first_game-1", "title": "2.3 编写第一个 MPFlutter 微信小游戏", "level": 2}, {"id": "heading-first_game-2", "title": "从模板工程开始", "level": 3}, {"id": "heading-first_game-3", "title": "Flutter SDK 版本支持情况", "level": 3}, {"id": "heading-first_game-4", "title": "构建应用", "level": 3}, {"id": "heading-first_game-5", "title": "构建小游戏命令与步骤", "level": 3}], "wordCount": 1375, "readTime": 4, "file": "05_编写第一个 MPFlutter 微信小游戏_EbsBwMhzmiVNSXk0dlJcjtxSnwh.html"}, {"id": "learn_more", "chapterId": "chap_getting_started", "chapterTitle": "二、起步指南", "title": "了解更多：核心底层架构原理", "icon": "💡", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-learn_more-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-learn_more-1\" class=\"heading-anchor\">#</a>2.4 深入了解：核心底层架构原理</h2>\n\n\n\n<h4 id=\"heading-learn_more-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-learn_more-2\" class=\"heading-anchor\">#</a>原理</h4>\n\n\n<p class=\"feishu-p\">为什么 MPFlutter 可以运行在微信小程序上？MPFlutter 在背后做了什么工作？</p>\n\n\n<p class=\"feishu-p\">在回答这个问题前，我们先看看 Flutter 官方是如何在 Web 上运行 Flutter 应用的：</p>\n\n\n\n\n<div class=\"article-image-box\">\n                <img src=\"./images/architecture_flutter_wechat.jpg\" alt=\"MPFlutter 运行原理与架构图\" class=\"zoomable-img\" onclick=\"openLightbox('./images/architecture_flutter_wechat.jpg', 'MPFlutter 运行原理与架构图')\" />\n                <div class=\"image-caption\">MPFlutter 运行原理与架构图</div>\n            </div>\n\n\n\n<p class=\"feishu-p\">这里有几个要点：</p>\n\n<ul class=\"feishu-ul\">\n<li>Dart 代码是无法直接运行在浏览器的，必须编译成 JavaScript，Dart 提供了 dart2js 编译器。</li>\n<li>浏览器是没有 Skia API 提供的，因此需要找到合适的 Renderer 用于最终渲染，存在两种 Renderer。</li>\n<li>HTML Renderer，它直接将 RenderTree 翻译成普通的 DOM 对象，添加到 body 上，由浏览器自行合成界面。</li>\n<li>CanvasKit Renderer，它借助 WebAssembly 技术，使得 Skia 可以运行在浏览器上，并结合 WebGL 渲染界面。</li>\n</ul>\n\n<p class=\"feishu-p\">不同的渲染方案各有优点：</p>\n\n<ul class=\"feishu-ul\">\n<li>HTML Renderer 兼容性更好，也不需要关注字体加载问题，但是在移动端性能表现堪忧。</li>\n<li>CanvasKit Renderer 性能最优，兼容性在现阶段已不是问题，但需要关注字体加载、包体积等问题。</li>\n</ul>\n\n<p class=\"feishu-p\">从 Flutter 的渲染一致性角度来看，CanvasKit Renderer 是更贴近 Flutter 的理念的。</p>\n\n\n<p class=\"feishu-p\">MPFlutter 2.0 选择了 CanvasKit Renderer 方案：</p>\n\n\n<p class=\"feishu-p\">MPFlutter 2.0 完全复用 Flutter For Web 的基建，我们提供了以下适配策略：</p>\n\n<ul class=\"feishu-ul\">\n<li>裁剪并编译一个符合微信小程序包大小要求的 Skia WebAssembly 库；</li>\n<li>适当地调整 Skia CanvasKit 加载脚本，使它能运行在微信小程序上；</li>\n<li>添加智能分包策略，使 main.dart.js 以及资源文件可以在构建阶段智能地分配到不同分包中；</li>\n<li>在微信小程序中，补全 Flutter For Web 所需要的 Web API；</li>\n<li>在微信小程序中，补充必要的触摸、键盘事件回传。</li>\n</ul>\n\n\n<h4 id=\"heading-learn_more-3\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-learn_more-3\" class=\"heading-anchor\">#</a>方案优点</h4>\n\n\n<p class=\"feishu-p\">MPFlutter 在帧率表现上优于传统的小程序开发模式。</p>\n\n\n<p class=\"feishu-p\">传统的小程序开发模式其数据交换可见下图：</p>\n\n\n", "headings": [{"id": "heading-learn_more-1", "title": "2.4 深入了解：核心底层架构原理", "level": 2}, {"id": "heading-learn_more-2", "title": "原理", "level": 4}, {"id": "heading-learn_more-3", "title": "方案优点", "level": 4}], "wordCount": 1013, "readTime": 3, "file": "06_了解更多_HlZYwSKQMiQyGlknBlicxI99nkd.html"}, {"id": "build_guide", "chapterId": "chap_build_guide", "chapterTitle": "三、构建指南", "title": "构建指南概述", "icon": "🛠️", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-build_guide-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-build_guide-1\" class=\"heading-anchor\">#</a>三、构建指南</h2>\n\n\n", "headings": [{"id": "heading-build_guide-1", "title": "三、构建指南", "level": 2}], "wordCount": 11, "readTime": 1, "file": "07_构建指南_Ux6QwUyceioRcNkZxI0cgaQhnKf.html"}, {"id": "dart2js", "chapterId": "chap_build_guide", "chapterTitle": "三、构建指南", "title": "Dart2JS 的构建", "icon": "⚡", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-dart2js-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-dart2js-1\" class=\"heading-anchor\">#</a>3.1 Dart2JS 构建深入</h2>\n\n\n\n<h3 id=\"heading-dart2js-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-dart2js-2\" class=\"heading-anchor\">#</a>运行原理</h3>\n\n\n<p class=\"feishu-p\">Flutter 程序之所以可以运行在微信小程序上，是因为 Dart 官方提供了 dart2js 编译器，它可以在 JavaScript 中完整地模拟出 DartVM。</p>\n\n\n<p class=\"feishu-p\">MPFlutter 同样也是借助 flutter build web 命令构建最终 JS 产物。</p>\n\n\n\n<h3 id=\"heading-dart2js-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-dart2js-3\" class=\"heading-anchor\">#</a>构建方法</h3>\n\n\n\n<h4 id=\"heading-dart2js-4\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-dart2js-4\" class=\"heading-anchor\">#</a>常规构建</h4>\n\n\n<p class=\"feishu-p\">常规构建适用于预览、上传、发布，使用以下命令执行常规构建：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">code</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-\">dart scripts/build_wechat.dart</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">常规构建会按照以下步骤执行：</p>\n\n\n<p class=\"feishu-p\">1.使用 flutter build web 构建 web 产物</p>\n\n<p class=\"feishu-p\">2.复制工程根目录下的 wechat 到 build/wechat 目录下</p>\n\n<p class=\"feishu-p\">3.使用 mpflutter_build_tools 工具复制 web 产物到 build/wechat 目录下</p>\n\n<p class=\"feishu-p\">4.微调 wechat 下的 JavaScript 以保证可以在小程序环境下执行</p>\n\n<p class=\"feishu-p\">5.添加分包信息</p>\n\n\n<h4 id=\"heading-dart2js-5\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-dart2js-5\" class=\"heading-anchor\">#</a>调试构建</h4>\n\n\n<p class=\"feishu-p\">调试构建适用于在微信开发者工具中查找运行时问题，使用以下命令构建：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">bash</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-bash\">dart scripts/build_wechat.dart --debug</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">通过该模式构建的产物，可以在微信开发者工具 > 调试 > Source 选项卡中看到 dart 源码，并基于 dart 源码进行断点调试。</p>\n\n\n<p class=\"feishu-p\">该模式打包的产物，会超出小程序包大小限制，不能在真机调试和预览。</p>\n\n\n\n<h4 id=\"heading-dart2js-6\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-dart2js-6\" class=\"heading-anchor\">#</a>性能数据构建</h4>\n\n\n<p class=\"feishu-p\">目前这种方式还未完善，暂时不要使用。</p>\n\n\n<p class=\"feishu-p\">调试构建适用于在预览场景下获取性能数据，它将附带性能信息窗口在应用界面，使用以下命令构建：</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">bash</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-bash\">dart scripts/build_wechat.dart --debug</code></pre>\n                </div>\n\n\n\n<h3 id=\"heading-dart2js-7\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-dart2js-7\" class=\"heading-anchor\">#</a>环境判断评论</h3>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-dart2js-1", "title": "3.1 Dart2JS 构建深入", "level": 2}, {"id": "heading-dart2js-2", "title": "运行原理", "level": 3}, {"id": "heading-dart2js-3", "title": "构建方法", "level": 3}, {"id": "heading-dart2js-4", "title": "常规构建", "level": 4}, {"id": "heading-dart2js-5", "title": "调试构建", "level": 4}, {"id": "heading-dart2js-6", "title": "性能数据构建", "level": 4}, {"id": "heading-dart2js-7", "title": "环境判断评论", "level": 3}], "wordCount": 1444, "readTime": 4, "file": "构建指南_Dart2JS 的构建_Uv0pwdknKixEJIk6ykccbeFEn2c.html"}, {"id": "resources", "chapterId": "chap_build_guide", "chapterTitle": "三、构建指南", "title": "资源文件的构建和使用", "icon": "📦", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-resources-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-resources-1\" class=\"heading-anchor\">#</a>3.2 资源文件的构建和使用</h2>\n\n\n<p class=\"feishu-p\">Flutter 应用程序包含代码和 assets（也为资源），资源是被打包到小程序安装包中的。</p>\n\n\n<p class=\"feishu-p\">由于微信小程序包整体大小限制在 20M 内，建议你尽可能通过 HTTP 加载资源使用。</p>\n\n\n\n<h3 id=\"heading-resources-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-resources-2\" class=\"heading-anchor\">#</a>支持文件类型</h3>\n\n\n<p class=\"feishu-p\">在 MPFlutter 中，你可以使用以下类型的资源文件：</p>\n\n\n\n<h5 id=\"heading-resources-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-resources-3\" class=\"heading-anchor\">#</a>静态数据：</h5>\n\n\n<p class=\"feishu-p\">JSON / Text / 二进制数据文件</p>\n\n\n\n<h5 id=\"heading-resources-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-resources-3\" class=\"heading-anchor\">#</a>图片：</h5>\n\n<ul class=\"feishu-ul\">\n<li>JPEG / PNG</li>\n<li>SVG （需要添加 flutter_svg 依赖库）</li>\n<li>不支持 WebP / GIF / BMP</li>\n</ul>\n\n\n<h5 id=\"heading-resources-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-resources-3\" class=\"heading-anchor\">#</a>字体：</h5>\n\n<ul class=\"feishu-ul\">\n<li>TTF</li>\n</ul>\n\n\n<h3 id=\"heading-resources-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-resources-3\" class=\"heading-anchor\">#</a>资源引入和使用</h3>\n\n\n<p class=\"feishu-p\">直接参数 Flutter 官方文档在 pubspec.yaml 指定，使用 rootBundle 或者 AssetImage 加载就可以。</p>\n\n\n<p class=\"feishu-p\"><a href=\"https://flutter.cn/docs/ui/assets/assets-and-images\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://flutter.cn/docs/ui/assets/assets-and-images</a></p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-resources-1", "title": "3.2 资源文件的构建和使用", "level": 2}, {"id": "heading-resources-2", "title": "支持文件类型", "level": 3}, {"id": "heading-resources-3", "title": "资源引入和使用", "level": 3}], "wordCount": 416, "readTime": 1, "file": "构建指南_资源文件的构建和使用_X88PwdjiBiAnTPkhdbZcCSS1n4e.html"}, {"id": "fonts", "chapterId": "chap_build_guide", "chapterTitle": "三、构建指南", "title": "字体使用与优化配置", "icon": "🔤", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-fonts-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-fonts-1\" class=\"heading-anchor\">#</a>3.3 字体使用与优化配置</h2>\n\n\n\n<h3 id=\"heading-fonts-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-fonts-2\" class=\"heading-anchor\">#</a>应用包内置字体</h3>\n\n\n<p class=\"feishu-p\">MPFlutter 默认使用 <a href=\"https://fonts.google.com/noto/specimen/Noto+Sans/about\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Google NotoSans</a> 和 <a href=\"https://fonts.google.com/specimen/Roboto/about\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">Roboto</a> 字体渲染文本，这两种字体均为<a href=\"https://fonts.google.com/noto/specimen/Noto+Sans/about\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">可商用字体</a>。</p>\n\n\n<p class=\"feishu-p\">在 《<a href=\"https://weypl4zsnv.feishu.cn/wiki/I45wwTI9XiH0AXkvQUEc2jZ8nFP\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">编写第一个 MPFlutter 微信小程序</a>》 文档中下载的 awesome_project，在 fonts 目录下就存在对应的 ttf 文件。</p>\n\n\n<p class=\"feishu-p\">特别提醒你，fonts/NotoSansSC-Regular.ttf 简体中文字体文件是经过裁剪的，它收录了常用的 9000+ 简体汉字。如果你需要使用完整版本的 NotoSansSc，请直接删除这个文件，参考本文档「自定义字体」处理。</p>\n\n\n\n<h3 id=\"heading-fonts-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-fonts-3\" class=\"heading-anchor\">#</a>为什么要指定字体文件？</h3>\n\n\n<p class=\"feishu-p\">MPFlutter 是基于 Flutter For Web + CanvasKit Renderer 渲染的，实质上是通过 Skia + WebGL 渲染界面。</p>\n\n\n<p class=\"feishu-p\">在浏览器上、在微信小程序上，都是无法直接从宿主中获取到系统字体文件的。</p>\n\n\n<p class=\"feishu-p\">无字体文件也就无法渲染文本。</p>\n\n\n\n<h5 id=\"heading-fonts-4\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-fonts-4\" class=\"heading-anchor\">#</a>解决方案：</h5>\n\n\n<p class=\"feishu-p\">Flutter For Web 支持加载本地或远端的 ttf / otf 字体文件，默认是从 <a href=\"http://fonts.gstatic.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">fonts.gstatic.com</a> 的 API 中加载的。</p>\n\n\n<p class=\"feishu-p\">每次都从 <a href=\"http://fonts.gstatic.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">fonts.gstatic.com</a> 加载字体，会影响应用启动速度，所以我们直接把简体中文、英文 ttf 内置到应用包中。</p>\n\n\n\n<h3 id=\"heading-fonts-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-fonts-4\" class=\"heading-anchor\">#</a>自定义字体</h3>\n\n\n<p class=\"feishu-p\">当内置字体无法满足需要时，可以使用参考《<a href=\"https://flutter.cn/docs/cookbook/design/fonts\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://flutter.cn/docs/cookbook/design/fonts</a>》文档添加字体。</p>\n\n\n<p class=\"feishu-p\">对于使用 HTTP 加载字体，先使用 HTTP 或 Dio 下载 Uint8List 再在 Dart 中使用 loadFontFromList 加载。</p>\n\n\n<p class=\"feishu-p\">特别注意：</p>\n\n<ul class=\"feishu-ul\">\n<li>微信有<a href=\"https://developers.weixin.qq.com/miniprogram/dev/framework/ability/domain.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">业务域名</a>限制，如果你需要从 <a href=\"http://fonts.gstatic.com\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">fonts.gstatic.com</a> 加载字体，请务必在微信开发者后台添加它。</li>\n<li>非英文字体，文件大小可能超出分包限制，导致应用无法上传，建议优先使用 HTTP 加载字体。</li>\n<li>大部分字体存在商用版权限制，在使用前务必留意，MPFlutter 不对你使用内置以及自定义字体造成的任何法律问题承担责任。</li>\n</ul>\n\n\n<h3 id=\"heading-fonts-5\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-fonts-5\" class=\"heading-anchor\">#</a>使用 MiniTex 进行文本渲染</h3>\n\n\n<p class=\"feishu-p\">你可以使用 MiniTex 文本渲染器替代 Skia 内置的文本渲染能力，使用 MiniTex 不需要在应用包内置字体，也不需要从 HTTP 服务器加载字体，并支持多国语言、Emoji。</p>\n\n\n<p class=\"feishu-p\">要了解更多 MiniTex 的信息，请点击这里《<a href=\"https://mpflutter.feishu.cn/wiki/JT9kwRkWIiekEMkWxg9cIAITnbd\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">MiniTex 文本渲染器</a>》。</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-fonts-1", "title": "3.3 字体使用与优化配置", "level": 2}, {"id": "heading-fonts-2", "title": "应用包内置字体", "level": 3}, {"id": "heading-fonts-3", "title": "为什么要指定字体文件？", "level": 3}, {"id": "heading-fonts-4", "title": "自定义字体", "level": 3}, {"id": "heading-fonts-5", "title": "使用 MiniTex 进行文本渲染", "level": 3}], "wordCount": 1103, "readTime": 3, "file": "构建指南_字体使用_U1QPw2Am7ii0bwkNbp1cuufgnah.html"}, {"id": "subpackaging", "chapterId": "chap_build_guide", "chapterTitle": "三、构建指南", "title": "小程序智能分包", "icon": "📂", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-subpackaging-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-subpackaging-1\" class=\"heading-anchor\">#</a>3.4 小程序分包指南</h2>\n\n\n<p class=\"feishu-p\">MPFlutter 支持智能分包，帮助你轻松应对微信小程序、抖音小程序的包体积限制。</p>\n\n\n\n<h3 id=\"heading-subpackaging-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-subpackaging-2\" class=\"heading-anchor\">#</a>为什么需要分包？</h3>\n\n\n<p class=\"feishu-p\">微信小程序官方文档：<a href=\"https://developers.weixin.qq.com/miniprogram/dev/framework/subpackages.html\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://developers.weixin.qq.com/miniprogram/dev/framework/subpackages.html</a></p>\n\n\n<p class=\"feishu-p\">主要原因是微信小程序官方要求，对于主包要求不超过 2M，主包 + 所有分包整体不得超过 20M。</p>\n\n\n<p class=\"feishu-p\">这种要求，是合理的，如果包体积不作任何限制，用户首次加载小程序体验会很差。</p>\n\n\n<p class=\"feishu-p\">最初微信小程序的要求是整个应用包不得超过 2M，然而随着小程序的复杂度提升，2M 肯定是不够的，所以官方提供了分包加载支持。</p>\n\n\n<p class=\"feishu-p\">分包是 MPFlutter 必须的，一个单纯的 Hello, World 程序，main.dart.js 代码就已经占去 1.7M，再加上字体、图片等资源文件，绝对是超过 2M 的。</p>\n\n\n<p class=\"feishu-p\">从 2.4.0 版本开始，main.dart.js 可保持在 700K 内，如果分包大小仍然超出限制，仍然需要按照下述方法执行。</p>\n\n\n\n<h3 id=\"heading-subpackaging-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-subpackaging-3\" class=\"heading-anchor\">#</a>代码分包的方法</h3>\n\n\n<p class=\"feishu-p\">针对 main.dart.js 体积过大的问题，Flutter For Web 官方已有提供 defered load 方案。</p>\n\n\n<p class=\"feishu-p\">以下是一个例子，用于将 box.dart 拆到分包中。</p>\n\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">import &#x27;package:flutter/material.dart&#x27;;\nimport &#x27;box.dart&#x27; deferred as box;\n\nclass SomeWidget extends StatefulWidget {\n  const SomeWidget({super.key});\n\n  @override\n  State&lt;SomeWidget&gt; createState() =&gt; _SomeWidgetState();\n}\n\nclass _SomeWidgetState extends State&lt;SomeWidget&gt; {\n  late Future&lt;void&gt; _libraryFuture;\n\n  @override\n  void initState() {\n    _libraryFuture = box.loadLibrary();\n    super.initState();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return FutureBuilder&lt;void&gt;(\n      future: _libraryFuture,\n      builder: (context, snapshot) {\n        if (snapshot.connectionState == ConnectionState.done) {\n          if (snapshot.hasError) {\n            return Text(&#x27;Error: ${snapshot.error}&#x27;);\n          }\n          return box.DeferredBox();\n        }\n        return const CircularProgressIndicator();</code></pre>\n                </div>\n\n\n", "headings": [{"id": "heading-subpackaging-1", "title": "3.4 小程序分包指南", "level": 2}, {"id": "heading-subpackaging-2", "title": "为什么需要分包？", "level": 3}, {"id": "heading-subpackaging-3", "title": "代码分包的方法", "level": 3}], "wordCount": 1691, "readTime": 5, "file": "构建指南_分包_SOyMwWah7iWNiWkRmtncOZepnzh.html"}, {"id": "extensions", "chapterId": "chap_extensions", "chapterTitle": "四、扩展指南与 Package 生态", "title": "扩展指南概述", "icon": "🧩", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-extensions-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-extensions-1\" class=\"heading-anchor\">#</a>四、扩展指南与 Package 生态</h2>\n\n\n", "headings": [{"id": "heading-extensions-1", "title": "四、扩展指南与 Package 生态", "level": 2}], "wordCount": 23, "readTime": 1, "file": "08_扩展指南_ZoBmwKjNLijOIVkmG4HcRqqjn4b.html"}, {"id": "use_packages", "chapterId": "chap_extensions", "chapterTitle": "四、扩展指南与 Package 生态", "title": "在 MPFlutter 里使用 Packages", "icon": "🔌", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-use_packages-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-use_packages-1\" class=\"heading-anchor\">#</a>4.1 在 MPFlutter 里使用 Packages</h2>\n\n\n<p class=\"feishu-p\">MPFlutter 支持开发者使用 Flutter 生态中已有的 Packages。</p>\n\n\n\n<h3 id=\"heading-use_packages-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-use_packages-2\" class=\"heading-anchor\">#</a>可用的 Package</h3>\n\n<ul class=\"feishu-ul\">\n<li>完全不依赖 Platform Channel 的 Package，可以直接引入使用。例如以下 Package：</li>\n<li>Dio</li>\n<li>GetX</li>\n<li>Provider</li>\n<li>json_serializable</li>\n<li>fl_chart</li>\n<li>......</li>\n<li>依赖 Flutter For Web 的 Package，需要 MPFlutter 官方完成对应的小程序 API -> JS 适配才可以使用。以下 Package 已由 MPFlutter 官方完成适配，你可以直接引入使用：</li>\n<li>http</li>\n<li>shared_preferences</li>\n</ul>\n\n\n<h3 id=\"heading-use_packages-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-use_packages-3\" class=\"heading-anchor\">#</a>不可用的 Package</h3>\n\n<ul class=\"feishu-ul\">\n<li>依赖 Platform Channel  的 Package，并且高度依赖设备实现。</li>\n</ul>\n\n<p class=\"feishu-p\">例如：</p>\n\n<ul class=\"feishu-ul\">\n<li>geolocator</li>\n<li>url_launcher</li>\n<li>image_picker</li>\n<li>cached_network_image</li>\n<li>path_provider</li>\n<li>依赖 PlatformView 实现的 Package，也是不可用的。</li>\n</ul>\n\n<p class=\"feishu-p\">例如：</p>\n\n<ul class=\"feishu-ul\">\n<li>google_maps_flutter</li>\n<li>flutter_video_view</li>\n<li>webview_flutter</li>\n</ul>\n\n<p class=\"feishu-p\">针对这些需求，MPFlutter 官方后续会推出方案，支持对应的功能。</p>\n\n\n<p class=\"feishu-p\">你也可以通过阅读微信小程序文档，了解对应的 API 是否可覆盖你的场景。</p>\n\n\n<p class=\"feishu-p\">你可以通过《<a href=\"https://weypl4zsnv.feishu.cn/wiki/KAs6wdMfRiQ1Y0kGB5CcxzMgntc\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">微信小程序 API 封装库</a> 》文档，学习如何使用 mpflutter_wechat_api 库，便利地使用 Dart 调用微信小程序 API。</p>\n\n\n\n<h3 id=\"heading-use_packages-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-use_packages-4\" class=\"heading-anchor\">#</a>忽略不可用的 Package</h3>\n\n\n<p class=\"feishu-p\">不可用的 Package 可能导致小程序无法启动，最常见的表现是冷启动白屏，即使你不在 dart 中调用这些不兼容包，也可能导致白屏。</p>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-use_packages-1", "title": "4.1 在 MPFlutter 里使用 Packages", "level": 2}, {"id": "heading-use_packages-2", "title": "可用的 Package", "level": 3}, {"id": "heading-use_packages-3", "title": "不可用的 Package", "level": 3}, {"id": "heading-use_packages-4", "title": "忽略不可用的 Package", "level": 3}], "wordCount": 831, "readTime": 2, "file": "扩展指南_在 MPFlutter 里使用 Packages_HWPvwnLici0TsYkJoeqc4afTnac.html"}, {"id": "develop_package", "chapterId": "chap_extensions", "chapterTitle": "四、扩展指南与 Package 生态", "title": "自主开发 Package", "icon": "🛠️", "date": "2024年3月10日", "html": "\n<h2 id=\"heading-develop_package-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-develop_package-1\" class=\"heading-anchor\">#</a>4.2 自主开发 Package</h2>\n\n\n\n<h3 id=\"heading-develop_package-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-develop_package-2\" class=\"heading-anchor\">#</a>开发</h3>\n\n\n<p class=\"feishu-p\">请参考 Flutter 官方文档学习 Package 的开发：</p>\n\n\n<p class=\"feishu-p\"><a href=\"https://flutter.cn/docs/packages-and-plugins/developing-packages#web\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">https://flutter.cn/docs/packages-and-plugins/developing-packages#web</a></p>\n\n\n<p class=\"feishu-p\">MPFlutter Package 可直接复用 Flutter For Web Package，使用 dart:js 与 JavaScript API 进行跨语言交互。</p>\n\n\n<p class=\"feishu-p\">如果需要开发特定的微信小程序平台插件，请参考 《<a href=\"https://mpflutter.feishu.cn/wiki/Oc9Kw42X5i8naHkNeo8c6JKGnPc\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">自制微信小程序 Package</a>》。</p>\n\n\n\n<h3 id=\"heading-develop_package-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-develop_package-3\" class=\"heading-anchor\">#</a>发布</h3>\n\n\n<p class=\"feishu-p\">同样的，请参考 Flutter 官方文档，发布 Package 到 pub.dev，然后你就可以与公域开发者分享你的扩展包了。</p>\n\n\n", "headings": [{"id": "heading-develop_package-1", "title": "4.2 自主开发 Package", "level": 2}, {"id": "heading-develop_package-2", "title": "开发", "level": 3}, {"id": "heading-develop_package-3", "title": "发布", "level": 3}], "wordCount": 337, "readTime": 1, "file": "扩展指南_自主开发 Package_K4SYw4XNfim6Kgk446tcH1KGnUe.html"}, {"id": "advanced", "chapterId": "chap_advanced", "chapterTitle": "五、进阶指南", "title": "进阶指南规划与深度架构", "icon": "🚀", "date": "2024年1月12日", "html": "\n<h2 id=\"heading-advanced-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-advanced-1\" class=\"heading-anchor\">#</a>五、进阶指南</h2>\n\n\n\n\n<div class=\"callout-card callout-note\"><div class=\"callout-header\"><span class=\"callout-icon\">📝</span><span class=\"callout-title\">说明</span></div><div class=\"callout-content\">\n<p class=\"feishu-p\"><strong>进阶开发与架构指南</strong></p>\n\n<p class=\"feishu-p\">本章节面向需要进行深度定制、高性能架构优化、复杂原生混合工程集成的开发者。</p>\n\n\n</div></div>\n\n\n\n<h3 id=\"heading-advanced-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-advanced-2\" class=\"heading-anchor\">#</a>1. 架构优化方向</h3>\n<ul class=\"feishu-ul\">\n<li><strong>渲染树精简</strong>：充分利用 <code class=\"inline-code\">RepaintBoundary</code> 减少 WebGL 脏区域重绘，降低小程序 CPU / GPU 负载。</li>\n<li><strong>内存优化</strong>：在小程序单页面栈切换时，主动释放未引用的 ImageProvider 缓存与网络资源。</li>\n<li><strong>自定义 WebGL 渲染管线</strong>：通过扩展 mpflutter_core，支持接入自研 WebGL 滤镜或着色器。</li>\n</ul>\n\n\n<h3 id=\"heading-advanced-3\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-advanced-3\" class=\"heading-anchor\">#</a>2. 原生混合开发</h3>\n<ul class=\"feishu-ul\">\n<li><strong>同层渲染集成</strong>：使用 Platform View Overlay 与原生组件（如 live-pusher, camera, map, video）无缝融合。</li>\n<li><strong>多页面栈与分包分流</strong>：将大型应用的主业务与次要业务划分为不同分包，主包控制在 2MB 以内。</li>\n</ul>\n\n\n<h3 id=\"heading-advanced-4\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-advanced-4\" class=\"heading-anchor\">#</a>3. 持续集成与发布自动化</h3>\n<ul class=\"feishu-ul\">\n<li>通过命令行集成 <code class=\"inline-code\">dart2js</code> 与构建脚本，无缝对接 GitLab CI / GitHub Actions 自动构建与微信小程序预览码生成。</li>\n</ul>\n\n\n\n", "headings": [{"id": "heading-advanced-1", "title": "五、进阶指南", "level": 2}, {"id": "heading-advanced-2", "title": "1. 架构优化方向", "level": 3}, {"id": "heading-advanced-3", "title": "2. 原生混合开发", "level": 3}, {"id": "heading-advanced-4", "title": "3. 持续集成与发布自动化", "level": 3}], "wordCount": 484, "readTime": 1, "file": "09_进阶指南_XOQiwrvBKiCXshkvJxkc4ByhnQd.html"}, {"id": "minitex", "chapterId": "chap_minitex", "chapterTitle": "六、MiniTex 免加载字体文本渲染器", "title": "MiniTex 概述与使用", "icon": "🔤", "date": "2024年6月14日", "html": "\n<h2 id=\"heading-minitex-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-minitex-1\" class=\"heading-anchor\">#</a>5.1 MiniTex 概述与使用</h2>\n\n\n<p class=\"feishu-p\">MiniTex 是一个文本渲染器，同时具备文本排版能力，借助 MiniTex，Flutter Web CanvasKit 应用可以在不加载字体文件的情况下，依然可以渲染多国语言。</p>\n\n\n<p class=\"feishu-p\">具体原理，可阅读《<a href=\"https://mpflutter.feishu.cn/wiki/B62mwAlrzilcoukX16qcupsNndf\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">免加载字体的 Flutter 文本渲染器 —— MiniTex</a>》。</p>\n\n\n\n<h4 id=\"heading-minitex-2\" class=\"doc-heading doc-heading-h4\"><a href=\"#heading-minitex-2\" class=\"heading-anchor\">#</a>使用方法</h4>\n\n\n\n<h5 id=\"heading-minitex-3\" class=\"doc-heading doc-heading-h5\"><a href=\"#heading-minitex-3\" class=\"heading-anchor\">#</a>MPFlutter</h5>\n\n\n<p class=\"feishu-p\">MPFlutter 2.3.0 版本已内置 MiniTex，你只需要在《<a href=\"https://mpflutter.feishu.cn/wiki/I45wwTI9XiH0AXkvQUEc2jZ8nFP\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">编写第一个 MPFlutter 微信小程序</a>》下载 MiniTex 版本的 awesome_project 就可以开始体验。</p>\n\n\n<p class=\"feishu-p\">如果不希望从模板工程开始，可以<a href=\"https://mpflutter.feishu.cn/wiki/LBtYwgw3Yi0BQzk6XTIcLOVrnZc\" class=\"feishu-link\" target=\"_blank\" rel=\"noopener\">升级相关依赖到 2.3.0 版本</a>，然后：</p>\n\n\n<p class=\"feishu-p\">1.在 main.dart 中配置 fontFamily。</p>\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">dart</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-dart\">// main.dart\nclass MyApp extends StatelessWidget {\n  const MyApp({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return MaterialApp(\n      title: &#x27;Flutter Demo&#x27;,\n      theme: ThemeData(\n        // 设置 ThemeData 的 fontFamily 和 fontFamilyFallback 为以下值。\n        fontFamily: &quot;MiniTex&quot;,\n        fontFamilyFallback: [&quot;MiniTex&quot;],\n      ),\n      // ...\n    );\n  }\n}</code></pre>\n                </div>\n\n\n<p class=\"feishu-p\">2.在 pubspec.yaml 中删除字体依赖。</p>\n\n\n\n\n<div class=\"feishu-code-block\">\n                    <div class=\"code-block-bar\">\n                        <span class=\"code-badge\">yaml</span>\n                        <button class=\"code-copy-btn\" onclick=\"copyCode(this)\">\n                            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n                            <span>复制</span>\n                        </button>\n                    </div>\n                    <pre><code class=\"language-yaml\"># pubspec.yaml\nname: awesome_project\ndescription: A new Flutter project.\npublish_to: &#x27;none&#x27;\n\nversion: 1.0.0+1\n\n\n  sdk: &#x27;&gt;=3.1.5 &lt;4.0.0&#x27;\n\n\n\n    sdk: flutter\n  mpflutter_core: ^2.4.0</code></pre>\n                </div>\n\n\n<hr class=\"feishu-hr\" />\n\n\n", "headings": [{"id": "heading-minitex-1", "title": "5.1 MiniTex 概述与使用", "level": 2}, {"id": "heading-minitex-2", "title": "使用方法", "level": 4}], "wordCount": 1445, "readTime": 4, "file": "10_MiniTex 文本渲染器_JT9kwRkWIiekEMkWxg9cIAITnbd.html"}, {"id": "minitex_deep", "chapterId": "chap_minitex", "chapterTitle": "六、MiniTex 免加载字体文本渲染器", "title": "免加载字体的 Flutter 文本渲染器 —— MiniTex", "icon": "📖", "date": "2024年6月14日", "html": "\n<h2 id=\"heading-minitex_deep-1\" class=\"doc-heading doc-heading-h2\"><a href=\"#heading-minitex_deep-1\" class=\"heading-anchor\">#</a>5.2 MiniTex 技术原理与架构解析</h2>\n\n\n<p class=\"feishu-p\">MiniTex 是一个文本渲染器，同时具备文本排版能力，借助 MiniTex，Flutter Web CanvasKit 应用可以在不加载字体文件的情况下，依然可以渲染多国语言。</p>\n\n\n<p class=\"feishu-p\">MiniTex 支持在 MPFlutter 和 Flutter Web 中使用，开源，免费。</p>\n\n\n<p class=\"feishu-p\">本文主要介绍 MiniTex 的实现原理以及使用方法。</p>\n\n\n\n<h3 id=\"heading-minitex_deep-2\" class=\"doc-heading doc-heading-h3\"><a href=\"#heading-minitex_deep-2\" class=\"heading-anchor\">#</a>一、背景</h3>\n\n\n<p class=\"feishu-p\">Flutter Web 存在 CanvasKit 渲染器，该渲染器使用 Skia WebAssembly 驱动，在该模式下渲染文本需要通过加载 ttf 字体文件实现，这种方式对于 Latin 系语言相对友好，但对于汉语、日语等方块字语言则不太友好。</p>\n\n\n<p class=\"feishu-p\">原因在于：</p>\n\n<ul class=\"feishu-ul\">\n<li>方块字语言字符集较大，故未经裁剪的简体中文字体文件一般都超过 5M；</li>\n<li>字体版权不容易处理，可商用字体选择范围少，一般是使用 Noto 系列字体；</li>\n<li>Emoji 文本无法渲染，或渲染效果无法对齐原生。</li>\n</ul>\n\n<p class=\"feishu-p\">MPFlutter 也同样遇到上述
